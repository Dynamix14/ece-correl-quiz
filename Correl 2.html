// ==== CIRCUITS QUIZZES ====
// Transcribed from the two official answer-key papers:
//   Quiz 1 - Electrical Circuits 1 (AK)   [DC fundamentals]
//   Quiz 2 - Electrical Circuits 2 (AC)   [AC fundamentals]
const CIRCUITS_BANK = {
  "Electrical Circuits 1 (DC)": [
    {q:"A heating element is connected to a DC supply and absorbs 48 W of electrical power. Under the passive sign convention, which statement must be true?",options:["Current leaves the terminal marked positive","Voltage and current must have opposite reference directions","Current enters the terminal marked positive","The element is supplying power to the source"],answer:2,diff:"easy",exp:"Under the passive sign convention an element absorbs power when the reference current enters the terminal marked positive, giving p = +vi. Absorbing 48 W therefore requires the current to enter the + terminal.",why:["Current leaving the + terminal is the active (generator) convention, under which the element delivers power instead of absorbing it.","Opposite reference directions for v and i is exactly the active convention — it gives p = −vi and contradicts the stated 48 W absorbed.","","The element absorbs 48 W, so it is a load. Supplying power would mean a negative absorbed power."],src:"Quiz 1 · Electrical Circuits 1 · Q1"},
    {q:"A laboratory DC power supply delivers a steady current of 3 A to a resistive load. The current does not change with time. How should this current be classified?",options:["Alternating current","Transient current","Pulsating current","Direct current"],answer:3,diff:"easy",exp:"A current of constant magnitude whose direction never reverses is direct current (DC). “Steady” means it does not vary with time, so there is no reversal or pulsation.",why:["Alternating current reverses direction periodically, which the statement “does not change with time” rules out.","A transient current decays with time (an exponential discharge); a steady 3 A has no transient behaviour.","A pulsating current varies in magnitude over time, like a rectifier output.",""],src:"Quiz 1 · Electrical Circuits 1 · Q2"},
    {q:"A 50-Ω resistor is initially connected across a 10-V source. If the voltage is increased to 30 V while the resistance remains constant, which statement correctly describes the new current?",options:["The current becomes three times its original value","The current becomes one-third of its original value","The current remains unchanged","The current becomes nine times its original value"],answer:0,diff:"easy",exp:"Ohm's law gives I = V/R. At 10 V: I = 10/50 = 0.2 A. At 30 V: I = 30/50 = 0.6 A. The current triples.",why:["","One-third would follow from LOWERING the voltage to a third of its value (30 V → 10 V), not from raising it.","Current cannot stay the same while V changes at constant R — I = V/R is a direct proportion.","Nine times is the factor for POWER (V²/R rises 3² = 9×), not for current."],src:"Quiz 1 · Electrical Circuits 1 · Q3"},
    {q:"Three resistors having values of 5 Ω, 10 Ω, and 20 Ω are connected in series across a DC supply. Which resistor dissipates the greatest power?",options:["5-Ω resistor","10-Ω resistor","20-Ω resistor","All three dissipate equal power"],answer:2,diff:"easy",exp:"In series the same current flows through all three, so P = I²R. Power is directly proportional to resistance, and the 20 Ω resistor dissipates the most.",why:["P = I²R makes the 5 Ω the SMALLEST dissipater, not the largest.","The 10 Ω sits between the other two; it is not the maximum.","","Equal dissipation needs equal resistances, or equal voltages as in a parallel connection. Here R differs while I is common."],src:"Quiz 1 · Electrical Circuits 1 · Q4"},
    {q:"A connected electrical network contains seven branches and five nodes. How many independent loops does the network have?",options:["4","1","2","3"],answer:3,diff:"medium",exp:"For a connected network the number of independent loops equals b − n + 1 = 7 − 5 + 1 = 3.",why:["4 is the number of independent NODE (KCL) equations, n − 1 = 4 — right for nodal analysis, wrong for loops.","1 loop describes a simple single-loop circuit, where b − n + 1 = 1.","2 comes from using b − n = 2 and forgetting the +1 that accounts for the network being connected.",""],src:"Quiz 1 · Electrical Circuits 1 · Q5"},
    {q:"Four resistive branches are connected in parallel across an ideal 24-V source. One branch is accidentally disconnected. Assuming the source voltage remains constant, what happens to the currents in the remaining branches?",options:["They become zero","They remain unchanged","They all decrease","They all increase"],answer:1,diff:"easy",exp:"Each parallel branch sits directly across the ideal 24 V source, so its current is V/R and depends only on itself. Disconnecting one branch does not change the voltage across the others, so their currents stay the same; only the total current falls.",why:["Only the disconnected branch drops to zero — the others still see the full 24 V.","","Branch current is set by V/R. With an ideal source holding V at 24 V, removing a branch cannot lower the currents in the others.","Removing a branch lowers the TOTAL current drawn from the source, not the individual branch currents."],src:"Quiz 1 · Electrical Circuits 1 · Q6"},
    {q:"A sensor is modeled as a Thevenin source having a relatively large output resistance. When a measuring instrument with a low input resistance is connected, the measured voltage becomes substantially lower than the open-circuit voltage. What phenomenon is occurring?",options:["Current amplification","Source transformation","Loading effect","Resonance"],answer:2,diff:"easy",exp:"The instrument's low input resistance forms a voltage divider with the sensor's large Thevenin resistance, so most of the source voltage is dropped across R_Th. The reading collapses below the open-circuit value — this is the loading effect.",why:["Nothing is amplified; the measured signal is attenuated.","Source transformation is an analysis equivalence (V_Th / R_N), not a measurement error.","","Resonance requires an LC combination at a particular frequency; no reactive element is involved here."],src:"Quiz 1 · Electrical Circuits 1 · Q7"},
    {q:"A resistor network connected in parallel experiences the opening of one branch. Assuming the supply voltage remains constant, what happens to the current in the remaining branches?",options:["The current in each remaining branch increases","The current in each remaining branch decreases","The branch currents remain unchanged","All currents become zero"],answer:2,diff:"easy",exp:"With the supply voltage held constant, every remaining branch still has the full voltage across it, so its current I = V/R is unchanged. Only the opened branch falls to zero, and the total current drops.",why:["Branch currents would rise only through a source with significant internal resistance; here the supply is stated to be constant.","I = V/R with V fixed cannot decrease.","","Only the opened branch carries zero current; the others continue normally."],src:"Quiz 1 · Electrical Circuits 1 · Q8"},
    {q:"During mesh analysis, you assume all mesh currents to be clockwise. After solving the simultaneous equations, one mesh current is found to be negative. What does the negative sign mean?",options:["Kirchhoff's Voltage Law has been violated","The circuit has no physical solution","The resistance in that mesh must be negative","The actual current flows opposite to the initially assumed direction"],answer:3,diff:"easy",exp:"Mesh currents are assigned an arbitrary reference direction. A negative result simply means the real current circulates opposite to the assumed clockwise direction; the magnitude is still correct.",why:["KVL holds for any consistent set of assumed directions — a sign cannot violate it.","A negative root is a perfectly valid solution; only the assumed reference direction was wrong.","Resistance is a physical, positive quantity. The sign belongs to the current, not the resistance.",""],src:"Quiz 1 · Electrical Circuits 1 · Q9"},
    {q:"Which parameter remains numerically unchanged when converting a Thevenin equivalent circuit into its corresponding Norton equivalent?",options:["Source voltage","Source current","Equivalent resistance","Load current"],answer:2,diff:"easy",exp:"The two equivalents share the same resistance: R_Th = R_N. The conversion swaps the source between V_Th and I_N = V_Th / R_Th, so the equivalent resistance is what stays the same.",why:["V_Th disappears in the Norton form, replaced by I_N = V_Th / R_Th.","I_N is a new number computed from V_Th and R_Th — it is not the unchanged quantity.","","Load current is not a parameter of the equivalent itself; it depends on whatever load is attached."],src:"Quiz 1 · Electrical Circuits 1 · Q10"},
    {q:"A circuit is represented by a Thevenin resistance of 75 Ω. For maximum power to be delivered to a purely resistive load, what should the load resistance be?",options:["37.5 Ω","75 Ω","150 Ω","5,625 Ω"],answer:1,diff:"easy",exp:"The maximum power transfer theorem states that a resistive load receives maximum power when R_L = R_Th. With R_Th = 75 Ω, set R_L = 75 Ω.",why:["R_Th / 2 delivers less than the maximum — the power peaks sharply at R_L = R_Th.","","2R_Th also delivers less than the maximum.","5,625 is 75², a power-like quantity, not a resistance."],src:"Quiz 1 · Electrical Circuits 1 · Q11"},
    {q:"Two capacitors, 4 μF and 12 μF, are connected in parallel. Which statement correctly describes their equivalent capacitance?",options:["It is less than 4 μF","It lies between 4 μF and 12 μF","It is equal to the smaller capacitor","It is greater than either individual capacitor"],answer:3,diff:"easy",exp:"Capacitances in parallel add: C_eq = 4 + 12 = 16 μF, which is larger than either capacitor alone.",why:["A value below the smallest capacitor occurs when capacitors are in SERIES.","Falling between the two is not a rule for any simple two-capacitor combination — parallel adds, series drops below the smaller.","Equalling the smaller capacitor would require the other to be zero farads.",""],src:"Quiz 1 · Electrical Circuits 1 · Q12"},
    {q:"The current through a conductor is i(t) = 4e^(−t) A for 0 ≤ t ≤ 3 s. Approximately how much charge passes through the conductor during this interval?",options:["3.80 C","1.27 C","4.95 C","12.0 C"],answer:0,diff:"medium",exp:"Charge is the integral of current: q = ∫₀³ 4e^(−t) dt = 4(1 − e^(−3)) = 4(1 − 0.0498) = 3.80 C.",why:["","1.27 is 3.80 C ÷ 3 s — the time-AVERAGED CURRENT (1.27 A), not the charge.","4.95 adds the fraction (1 − e^(−3) = 0.950) to the 4 C area instead of multiplying by it — a misplaced factor.","12.0 C = 4 A × 3 s keeps the current at its initial value for the whole interval; the exponential decay makes the true charge far smaller."],src:"Quiz 1 · Electrical Circuits 1 · Q13"},
    {q:"A 120-V DC source supplies 2.5 A continuously to a load for 20 minutes. How much electrical energy is consumed in kilowatt-hours?",options:["0.100 kWh","6.00 kWh","0.025 kWh","0.050 kWh"],answer:0,diff:"medium",exp:"P = VI = 120 × 2.5 = 300 W. Energy = 300 W × (20/60) h = 100 Wh = 0.100 kWh.",why:["","6.00 kWh treats 20 MINUTES as 20 HOURS (300 W × 20 h = 6 kWh).","0.025 kWh is the energy over 5 minutes — a fourfold error in the time interval.","0.050 kWh is the energy over 10 minutes, half the stated interval."],src:"Quiz 1 · Electrical Circuits 1 · Q14"},
    {q:"Three resistors of 3 kΩ, 5 kΩ, and 12 kΩ are connected in series across a 40-V source. What is the voltage across the 12-kΩ resistor?",options:["16 V","24 V","6 V","10 V"],answer:1,diff:"medium",exp:"R_T = 3k + 5k + 12k = 20 kΩ, so I = 40/20k = 2 mA. Across the 12 kΩ: V = 2 mA × 12 kΩ = 24 V.",why:["16 V = 2 mA × 8 kΩ, the voltage across the 3 kΩ and 5 kΩ resistors together.","","6 V = 2 mA × 3 kΩ, the drop across the 3 kΩ resistor.","10 V = 2 mA × 5 kΩ, the drop across the 5 kΩ resistor."],src:"Quiz 1 · Electrical Circuits 1 · Q15"},
    {q:"A 12-A current source supplies three parallel resistors having resistances of 4 Ω, 6 Ω, and 12 Ω. What is the current through the 6-Ω resistor?",options:["2 A","4 A","6 A","8 A"],answer:1,diff:"medium",exp:"The conductances add: 1/4 + 1/6 + 1/12 = 0.5 S, so V = 12/0.5 = 24 V. Current in the 6 Ω branch = 24/6 = 4 A.",why:["2 A = 24 V ÷ 12 Ω is the current in the 12 Ω branch.","","6 A = 24 V ÷ 4 Ω is the current in the 4 Ω branch, the largest share.","8 A would need a 3 Ω branch, which this network does not contain — a current-divider slip."],src:"Quiz 1 · Electrical Circuits 1 · Q16"},
    {q:"A delta-connected resistive network has resistances of 12 Ω, 18 Ω, and 30 Ω. Determine the Wye resistance connected to the junction common to the 12-Ω and 18-Ω delta branches.",options:["5.4 Ω","3.6 Ω","6.0 Ω","9.0 Ω"],answer:1,diff:"hard",exp:"For delta→wye the arm at the node shared by the 12 Ω and 18 Ω branches is R_a = (12 × 18)/(12 + 18 + 30) = 216/60 = 3.6 Ω.",why:["5.4 Ω matches no arm of this conversion — the denominator must be the 60 Ω sum of all three delta resistors.","","6.0 Ω = (30 × 12)/60 is the arm at the 30 Ω / 12 Ω junction — the wrong node.","9.0 Ω = (18 × 30)/60 is the arm at the 18 Ω / 30 Ω junction — the wrong node."],src:"Quiz 1 · Electrical Circuits 1 · Q17"},

    {q:"Determine the equivalent resistance.",options:["16.6 Ω","18.8 Ω","12.2 Ω","14.4 Ω"],answer:3,diff:"hard",exp:"Left path: 2 Ω + (6 Ω ‖ 3 Ω = 2 Ω) = 4 Ω. Right path: 1 Ω + 5 Ω = 6 Ω. Those two are in parallel: (4 × 6)/10 = 2.4 Ω. Add the outer 4 Ω and 8 Ω in series: R_eq = 4 + 2.4 + 8 = 14.4 Ω.",why:["16.6 Ω is not produced by any valid reduction of this network. The left path is 2 + (6‖3) = 4 Ω and the right path is 1 + 5 = 6 Ω; they are in parallel, giving 2.4 Ω.","18.8 Ω matches no correct reduction either — it ignores the parallel combination of the two 4 Ω and 6 Ω paths.","12.2 Ω matches no correct reduction — the 2 Ω must be ADDED in series inside the left path, not combined in parallel.",""],src:"Quiz 1 · Electrical Circuits 1 · Q20",img:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbEAAADsCAIAAAB11Q97AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAjLklEQVR4nO2d0W8TV77H5w/wC49+QEKKUvEQ6QqhPJS70jUPZItYhaqIB/YhgohVjLpSeLiYG6lwV9qkd4WloMCqtBUjkapoI7Uj0KZVCcVbChSaxlFSlQp5C7RpUkskm6ZZK4TE9fj+xsceT8Yz47E9npnj+X4UoWBPnJNz5nzn9zu/3/kdIQ8AAKCE4HUDAADAR0ATAQCgDDQRAADKQBMBAKAMNBEAAMpAEwEAoAw0EQAAykATAQCgDDSxBZHXF5I3rr51tv9oX2wwHj93hr45HRev3UktZ71uG6gBeS2dvPH+W3/qPxqNDZ4rDGQ0FhelO6mVrOx141oWaCIX5DLJ4YiwO5ZYqnbli8UpMdrZ1hkVH6TXyvMmu5waH+pu6+ge/PhJ5temthUYkEsnr0uSGIsIh8XUuo0fkLOLk2L0N9s6/yg+WFgvD+TmSmp8sLujrXvooyer0MVmAE3kgcxkPBIWqmtidvHzob0hIbTv/NRqpfCtz0n97UKo/djYk03MJhfJPRJ7B96N99AQCvY0UV787H/3bhdCB+NTyxVDJWfnpGh7SGg/MfZkrSkNDjbQRP+zkoz3RCJtVTVRXr51emeILjsx/qOx5q1Nj+zbLgg7DorfbjanrcAUUsausC1NlJ8lTu8R6Ol14u9p44FcnR15lUY6dFBM4fHmNNBEn0Ne80hP/LoU211NEzfmxnppngjb+sefmS0bZmZHDijGSsebD9Ywl9zFtibKc2NHlIHsiI4vmAySvDF7YY8ykJHBByvONzXYQBN9TS59c6BnJJl5lqiqifLCeLRDmSZ7LsxumOld9tl4/zbbHhxwEruaqI7RgZHZjNlF8rPxqHJRuEt8lHO8qcEGmuhjcj9Ivb+PJ8kQWKquicUpJwhdYsp0luRWEwOFi+yEa4Cj2NXE9ZR4WKj63FpNxAoDGY4lVp1uacCBJvqWjQUp1if9UNA3G5ooPx070mZbE+FzuY5dTSytgdjSxFDH4H3EWZwFmuhTcgtSX5+0UFQ3G5qorhWGBxKrZqJYskGs1hxBc7CriepaodVw51Jil2C95gjqBJroS8hr7otJCxul/9vRRHnj4dtdioHxSjz5i8klc9KxnUpA8+Qni5hJLmM/7rzx9aWu7fTg     {q:"Given identical capacitances P, Q, and R and the total equivalent capacitance of the circuit is 3 μF. Determine the values of P, Q, and R.",options:["4.2 μF","3.8 μF","5.4 μF","6.6 μF"],answer:0,diff:"hard",exp:"Top branch: 2 μF in series with (3.5 μF ‖ 4.5 μF = 8 μF) → (2 × 8)/10 = 1.6 μF. Bottom branch: P, Q, R in series = C/3. The branches are in parallel, so 1.6 + C/3 = 3 → C/3 = 1.4 → C = 4.2 μF.",why:["","3.8 μF would make the bottom branch 1.27 μF and the total 2.87 μF — short of the stated 3 μF.","5.4 μF would make the bottom branch 1.8 μF for a total of 3.4 μF.","6.6 μF would make the bottom branch 2.2 μF for a total of 3.8 μF."],src:"Quiz 1 · Electrical Circuits 1 · Q22",img:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAW0AAAD5CAIAAABj4/OUAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAQF0lEQVR4nO2dS67jthJAva0eNHpNd/ombz9ZQUZZjNeQ6QOeESG8bP5EkSpVFXmEg6Bj61rFInlMUh+/3n//DwBghpd6BADgHTwCALPgEQCYBY8AwCx4BABmwSMAMAseAYBZ8AgAzIJHAGAWPALX+PrPf3/8/PX6Z/v8448//zrdv8hMDK/mpp6iDSHp0MtHGcV+25bCpT/5vB6L6fPvonRqn/kBj6hA0qGXfAwSzNJQyfEnyWCkNopJPurwQq4Ghh7WoCagi5oyjjnOqUc6j4JHnEJNQBehSyfKOJ2nhHd7lkXwiFOoCRjhmJiEQUptnnKI4JjXhGlRe/ByySNhlnTL8i0Mg0fgMqF7nw4K4j3DOmhjpnPVI/mGSlTAI3CZ/MRNbTxy7Jmcgml0+KseOUY38TquenL2BI/AOLVFkzY3ekQ9A3BATcAU4Zq0/j9pWACPOIWagC5qXTp4pDi1Ka6qNpZI4pWUeHX2WElNdsMjdqAmoIu4S8evN6QQ3i3+SXFeEy66D4sdx3pKcgE+HrEGNQG95P0/WR/Jl0vyUUxtXBMO0R8JHrEDNQG91O6vCSOO4rJrmPjEW22RFY84hZqAayReSIxwqCSZyMR/0rgOrV8Nx/RHPRUQwCNgBYYYfqHawBBcSOYUPAIAs+ARAJgFjwDALHgEAGbBIwAwCx4BceLnDBVv8E92OH0GPVgDj4A4yXOPatfOt692BcvgERAHjywPHgFx2h55Z89JxCPuwCMgDh5ZHjwC4uCR5cEjIA4eWR48AuLgkeXBIyAOHlkePALiXPXIi6eQeIMKA3EGPGJ8Y8SUgEdWo/g8VIMbHlkJPLIU2v3rwoZHVgKPLIV2/7qwtT2S/Gpv/G9FwlgPj6QNTz0CuJG4Kx6vhJtrk/8e/zi6xKu0rpnclZs/Fz4+aH6g5HMuecRsLy3+sAa88chihK5o6mcZ8Mjy4JGb+ePPvxQfn5GPRyyAR5bHUGt7mGS6O9P5806iNS7AI88UxGyEWhhqbY8Wu9ms5z9Nqz/jkWcKYjZCLQy1tufKHLXXuIkPD0lCv40XGo9nBT48x8EjzxTEbIRaGGptzxB+7Do5GZF75Ct7VuihhkISLfVbPPJAQcxGqIWh1vYMoSmcvljTTd5F7fTbuMeqB1OMCo8siaHW9gxreyTujerB5HkryiJ/12wvxSM1DLW2ZyjOTY4     {q:"A capacitor is constructed with parallel plates and has a value of 50 pF. What would be the capacitance if the plate area is doubled and the plate spacing is halved?",options:["200 pF","250 pF","150 pF","100 pF"],answer:0,diff:"medium",exp:"C = εA/d. Doubling the area doubles C and halving the spacing doubles it again: 2 × 2 × 50 pF = 200 pF.",why:["","250 pF needs an overall factor of 5, which neither change produces.","150 pF corresponds to a factor of 3 — mixing up how the two effects combine.","100 pF accounts only for the doubled area and ignores the halved spacing."],src:"Quiz 1 · Electrical Circuits 1 · Q23"},
    {q:"An air-core solenoid has a cross-sectional area of 80 mm², a length of 1.2 m, and is wound uniformly with 150 turns. Assuming the relative permeability of air is unity, determine the inductance of the solenoid.",options:["0.188 μH","0.754 μH","1.885 μH","18.85 μH"],answer:2,diff:"hard",exp:"L = μ₀N²A/ℓ = (4π×10⁻⁷)(150²)(80×10⁻⁶)/1.2 = 1.885×10⁻⁶ H = 1.885 μH.",why:["0.188 μH is a factor of ten too small — a decade error converting 80 mm² to 80×10⁻⁶ m².","0.754 μH is what you get with an effective length of 3 m instead of 1.2 m.","","18.85 μH is a factor of ten too large, from treating 80 mm² as 80×10⁻⁵ m²."],src:"Quiz 1 · Electrical Circuits 1 · Q24"},
    {q:"A step-down transformer having a turns ratio of 20:1 has a primary voltage of 4 kV and a load of 10 kW. Neglecting losses, calculate the value of the secondary current.",options:["40 A","50 A","30 A","60 A"],answer:1,diff:"medium",exp:"V₂ = V₁/20 = 4000/20 = 200 V. Neglecting losses P₂ = P₁ = 10 kW, so I₂ = P/V₂ = 10 000/200 = 50 A.",why:["40 A would need a secondary voltage of 250 V, i.e. a 16:1 ratio — the stated ratio fixes V₂ at 200 V.","","30 A would need a secondary voltage of 333 V (≈ 12:1).","60 A would need a secondary voltage of 167 V (≈ 24:1)."],src:"Quiz 1 · Electrical Circuits 1 · Q25"}
  ],
  "Electrical Circuits 2 (AC)": [
    {q:"An AC waveform is applied to a transmission system operating at a fixed frequency. Which property fundamentally distinguishes alternating current from direct current in practical power systems?",options:["AC continuously stores energy in resistors","AC periodically reverses polarity and direction with time","AC always produces constant instantaneous voltage","AC cannot be represented mathematically using sinusoidal functions"],answer:1,diff:"easy",exp:"The defining property of AC is that its polarity and direction reverse periodically, following a sinusoidal (or other periodic) law. DC keeps one polarity and one direction.",why:["Resistors dissipate energy as heat; they do not store it, under AC or DC.","","An AC voltage varies continuously — only its RMS value is constant, and even that is an average.","AC is modelled precisely by sinusoids: v(t) = V_m sin(ωt + θ)."],src:"Quiz 2 · Electrical Circuits 2 · Q1"},
    {q:"It is observed that increasing the frequency of a sinusoidal waveform decreases its time period proportionally. Which mathematical relationship correctly explains this behavior?",options:["Frequency only affects amplitude and not time duration","Period is independent of frequency in AC systems","Frequency is directly proportional to period","Frequency and period are inversely proportional"],answer:3,diff:"easy",exp:"T = 1/f, so frequency and period are reciprocals — raising f lowers T in proportion.",why:["Amplitude and frequency are independent parameters of a sinusoid.","The period is fixed by the frequency through T = 1/f.","Direct proportionality would mean T rises with f, contradicting the observation.",""],src:"Quiz 2 · Electrical Circuits 2 · Q2"},
    {q:"A sinusoidal voltage source is represented by v(t) = V_m sin(ωt + θ). Which parameter determines the horizontal displacement of the waveform relative to the reference axis?",options:["Angular frequency","Peak amplitude","Phase angle","RMS value"],answer:2,diff:"easy",exp:"θ is the phase angle — it shifts the sinusoid horizontally along the time axis. ω sets the period and V_m sets the height.",why:["ω = 2πf fixes the period (horizontal compression), not the shift.","V_m sets the peak height, a vertical scale factor.","","RMS is a magnitude, V_m/√2 — it carries no phase information."],src:"Quiz 2 · Electrical Circuits 2 · Q3"},
    {q:"An AC current waveform produces the same heating effect in a resistor as a 10-A DC current. Which AC quantity is numerically equal to this equivalent DC current?",options:["Peak current","Average current","RMS current","Peak-to-peak current"],answer:2,diff:"easy",exp:"The RMS (effective) value is defined as the DC value that produces the same heating effect. So 10 A DC ⇔ 10 A RMS.",why:["Peak current is √2 times the RMS for a sinusoid, so it heats the resistor twice as much.","The average of a full sinusoid is zero, and over a half-cycle it is 0.637 V_p — neither is the heating equivalent.","","Peak-to-peak is 2√2 times the RMS — a span, not a heating equivalent."],src:"Quiz 2 · Electrical Circuits 2 · Q4"},
    {q:"Increasing the operating frequency of a capacitor-connected AC circuit while keeping capacitance constant. What happens to the capacitive reactance?",options:["It increases linearly","It decreases inversely with frequency","It becomes independent of frequency","It changes polarity from negative to positive"],answer:1,diff:"easy",exp:"X_C = 1/(2πfC), so X_C is inversely proportional to f. Raising the frequency lowers the reactance.",why:["A linear increase describes inductive reactance, X_L = 2πfL.","","X_C depends on f; it is only a constant at a fixed frequency.","Reactance is a magnitude and never changes sign — the −j comes from the impedance phase, not from the frequency."],src:"Quiz 2 · Electrical Circuits 2 · Q5"},
    {q:"A purely inductive circuit is connected to a sinusoidal AC source. Which statement correctly describes the phase relationship between voltage and current?",options:["Current leads voltage by 90°","Voltage and current are in phase","Voltage leads current by 90°","Current and voltage are always opposite in polarity"],answer:2,diff:"easy",exp:"In a pure inductor the current lags the voltage by 90° (ELI) — equivalently, the voltage leads the current by 90°.",why:["That is the capacitor rule (ICE): current leads voltage by 90°.","In phase describes a pure resistor.","","Opposite polarity (180°) describes neither element; the reactive displacement is 90°."],src:"Quiz 2 · Electrical Circuits 2 · Q6"},
    {q:"A series RC circuit operates at a frequency where the capacitive reactance equals the resistance. If the source frequency is increased further, what happens to the circuit behavior?",options:["Current begins to lag the voltage","Capacitive reactance increases beyond resistance","The circuit becomes more inductive","The voltage across the resistor becomes greater than the capacitor voltage"],answer:3,diff:"medium",exp:"X_C = 1/(2πfC) falls as f rises, so beyond the R = X_C point the reactance drops below the resistance. The resistor then takes the larger share of the source voltage, V_R > V_C, and the phase angle moves toward 0°.",why:["An RC circuit can never become inductive — the current keeps leading the voltage, by less than 45° now.","X_C is inversely proportional to f, so it falls, not rises.","There is no inductor in the circuit, so it cannot become inductive.",""],src:"Quiz 2 · Electrical Circuits 2 · Q7"},
    {q:"An impedance is expressed as Z = 8 − j6 Ω. The circuit is best described as:",options:["Purely resistive","Inductive because the imaginary term is negative","Capacitive because the imaginary term is negative","Resonant because resistance exists"],answer:2,diff:"easy",exp:"Z = R + jX_L − jX_C. A negative imaginary part means the reactive term is −jX_C, so the reactance is capacitive.",why:["A purely resistive impedance has NO imaginary part (X = 0).","Inductive impedance carries a POSITIVE imaginary part, +jX_L.","","Resonance requires X_L = X_C so that the imaginary part cancels to zero."],src:"Quiz 2 · Electrical Circuits 2 · Q8"},
    {q:"In AC circuit analysis, why are impedance and admittance commonly expressed in complex-number form?",options:["To eliminate resistance from calculations","To simultaneously represent magnitude and phase relationships","To avoid using Kirchhoff's Laws in AC analysis","Because AC quantities cannot be measured directly"],answer:1,diff:"easy",exp:"A complex number carries both magnitude and angle in a single symbol, so impedance encodes the magnitude ratio AND the phase shift at once — exactly what a reactive network does to a sinusoid.",why:["Resistance is the real part and remains essential; nothing is eliminated.","","KCL and KVL apply unchanged — that is the whole point of phasors and impedance.","AC quantities are measured routinely with meters and oscilloscopes."],src:"Quiz 2 · Electrical Circuits 2 · Q9"},
    {q:"A power system has a low lagging power factor due to heavy inductive loading. Which engineering consequence is most likely to occur?",options:["Reduced transmission current","Increased reactive power demand and line losses","Elimination of apparent power","Voltage and current become perfectly in phase"],answer:1,diff:"medium",exp:"A low lagging power factor means a large reactive component. For the same real power the apparent power S = P/pf is higher, so line current and I²R losses rise and more kVAR support is needed.",why:["A low power factor RAISES the current for the same real power, since S = P/pf.","","Apparent power S = VI is largest exactly when the power factor is poor; it does not vanish.","Voltage and current are furthest apart in phase when the power factor is low."],src:"Quiz 2 · Electrical Circuits 2 · Q10"},
    {q:"A circuit absorbs substantial reactive power but relatively low true power. Which electrical component is primarily responsible for this non-productive power exchange?",options:["Pure resistor","Semiconductor diode","Reactive elements such as inductors and capacitors","DC voltage source only"],answer:2,diff:"easy",exp:"Reactive power Q is energy shuttled back and forth by inductors (magnetic field) and capacitors (electric field) every half cycle without being dissipated.",why:["A pure resistor absorbs only true power (pf = 1); it stores nothing.","A diode is a one-way conductor — it dissipates, it does not store reactive energy.","","A DC source delivers real energy; at DC, X_L = 0 and X_C is infinite, so no reactive exchange occurs at all."],src:"Quiz 2 · Electrical Circuits 2 · Q11"},
    {q:"An AC load has a true power of 3 kW and reactive power of 4 kVAR. Which statement regarding the apparent power is correct?",options:["Apparent power is less than true power","Apparent power equals algebraic difference of true and reactive powers","Apparent power only exists in purely resistive circuits","Apparent power represents the vector combination of true and reactive powers"],answer:3,diff:"medium",exp:"S = P + jQ, so |S| = √(P² + Q²) = √(3² + 4²) = 5 kVA. Apparent power is the phasor (vector) sum of P and Q.",why:["S is always ≥ P; here S = 5 kVA against P = 3 kW. They are equal only at pf = 1.","P and Q are 90° apart, so they combine as a vector √(P²+Q²), never algebraically (which would give 1 kVA).","S = VI exists in every AC circuit; this load is not purely resistive because Q ≠ 0.",""],src:"Quiz 2 · Electrical Circuits 2 · Q12"},
    {q:"A series RLC circuit operates exactly at resonance. Which condition exists at resonance?",options:["X_L > X_C","X_C > X_L","X_L = X_C","R = 0"],answer:2,diff:"easy",exp:"Resonance occurs when the reactances cancel, X_L = X_C, leaving Z = R purely resistive.",why:["X_L > X_C means operation above resonance — the circuit is inductive.","X_C > X_L means operation below resonance — the circuit is capacitive.","","R is never zero in a practical circuit; it is what remains at resonance and sets the minimum impedance."],src:"Quiz 2 · Electrical Circuits 2 · Q13"},
    {q:"In a series resonant circuit, what happens to the impedance and current at the resonant frequency?",options:["Impedance becomes minimum while current becomes maximum","Impedance becomes maximum while current becomes minimum","Both impedance and current become zero","Both impedance and current become maximum"],answer:0,diff:"easy",exp:"At series resonance Z = R because the reactances cancel — the smallest possible impedance — so I = V/R is the largest possible current.",why:["","Maximum impedance with minimum current is the signature of PARALLEL resonance.","Only the reactive part cancels; R remains, so Z = R ≠ 0 and the current is maximal, not zero.","Impedance cannot be maximum at resonance — it is exactly at its minimum."],src:"Quiz 2 · Electrical Circuits 2 · Q14"},
    {q:"A series RLC circuit is operated at a frequency higher than its resonant frequency. The circuit behaves predominantly:",options:["Inductive because inductive reactance dominates","Open-circuit because current becomes zero","Capacitive because current leads voltage","Purely resistive because reactances cancel completely"],answer:0,diff:"medium",exp:"Above resonance X_L = 2πfL grows and X_C = 1/(2πfC) shrinks, so X_L > X_C. The net reactance is positive, the circuit is inductive, and the current lags the voltage.",why:["","The current does not fall to zero; it decreases but is still limited by Z = √(R² + (X_L−X_C)²).","Capacitive behaviour occurs BELOW resonance, where X_C > X_L.","Complete cancellation happens only exactly at f₀."],src:"Quiz 2 · Electrical Circuits 2 · Q15"},
    {q:"A voltage is given by: v(t) = 80 sin(377t − 25°). Find the instantaneous voltage at t = 4 ms.",options:["70.24 V","66.82 V","56.89 V","78.35 V"],answer:0,diff:"medium",exp:"ωt = 377 × 0.004 = 1.508 rad = 86.4°. The argument is 86.4° − 25° = 61.4°, and v = 80 sin 61.4° = 80 × 0.8780 = 70.24 V.",why:["","66.82 V does not satisfy the equation at t = 4 ms. Forgetting to convert ωt from radians to degrees gives a meaningless angle.","56.89 V does not satisfy the equation at t = 4 ms.","78.35 V does not satisfy the equation at t = 4 ms — it is close to the value with the 25° phase shift omitted."],src:"Quiz 2 · Electrical Circuits 2 · Q16"},
    {q:"A sinusoidal current has a peak-to-peak value of 28.28 A. What DC current will produce the same heating effect in a resistor?",options:["7.07 A","10.0 A","14.14 A","20.0 A"],answer:1,diff:"medium",exp:"I_peak = I_pp/2 = 14.14 A. The heating-equivalent DC value is the RMS: I_rms = I_peak/√2 = 14.14/1.414 = 10.0 A.",why:["7.07 A divides by √2 a second time (10/√2), as if one more conversion were needed.","","14.14 A is the PEAK value, which heats the resistor twice as much as 10 A DC.","20.0 A is 28.28/√2 — applying the √2 conversion to the peak-to-peak value instead of the peak."],src:"Quiz 2 · Electrical Circuits 2 · Q17"},
    {q:"A coupling capacitor of 0.047 μF is installed into a 25 kHz signal-conditioning circuit to block low-frequency interference. Determine the capacitive reactance presented to the signal source.",options:["270.9 Ω","540.8 Ω","135.5 Ω","54.2 Ω"],answer:2,diff:"medium",exp:"X_C = 1/(2πfC) = 1/(2π × 25 000 × 0.047×10⁻⁶) = 1/(7.3828×10⁻³) = 135.5 Ω.",why:["270.9 Ω is the reactance at 12.5 kHz, half the stated frequency.","540.8 Ω is the reactance at 6.25 kHz, a quarter of the stated frequency.","","54.2 Ω is the reactance at 62.5 kHz, 2.5× the stated frequency."],src:"Quiz 2 · Electrical Circuits 2 · Q18"},
    {q:"The current drawn by an industrial motor winding modeled as a pure inductance of 250 mH is analyzed. The winding is connected to a 240 V, 50 Hz source. Determine the RMS current drawn by the winding and identify the phase relationship.",options:["3.06 A leading","6.11 A leading","6.11 A lagging","3.06 A lagging"],answer:3,diff:"medium",exp:"X_L = 2πfL = 2π(50)(0.25) = 78.54 Ω, so I = 240/78.54 = 3.06 A. In a pure inductance the current LAGS the voltage by 90°, so the answer is 3.06 A lagging.",why:["3.06 A leading has the right magnitude but the wrong phase — leading is the capacitor rule, not the inductor rule.","6.11 A leading is wrong on both magnitude and phase.","6.11 A lagging has the right phase but twice the correct magnitude — it comes from dropping the 2 in X_L = 2πfL.",""],src:"Quiz 2 · Electrical Circuits 2 · Q19"},
    {q:"A sensor-conditioning interface contains a series RC branch with R = 60 Ω, X_C = 80 Ω connected across a 200 V rms source. Determine the branch current and phase behavior of the circuit.",options:["2 A lagging","2 A leading","2.5 A lagging","2.5 A leading"],answer:1,diff:"medium",exp:"|Z| = √(R² + X_C²) = √(60² + 80²) = √10 000 = 100 Ω, so I = 200/100 = 2 A. A capacitive branch makes the current LEAD the voltage: 2 A leading.",why:["2 A lagging has the correct magnitude but the wrong phase — an RC branch is capacitive, so the current leads.","","2.5 A lagging uses X_C alone as the impedance (200/80) and also has the wrong phase.","2.5 A leading uses X_C alone as the impedance (200/80); R must be included in the magnitude."],src:"Quiz 2 · Electrical Circuits 2 · Q20"},
    {q:"An aircraft navigation subsystem behaves as a series RLC load with R = 18 Ω, X_L = 90 Ω, X_C = 42 Ω supplied by a 230 V rms AC bus. Determine the line current and overall circuit characteristic.",options:["2.45 A inductive","2.45 A capacitive","3.12 A inductive","3.12 A capacitive"],answer:0,diff:"hard",exp:"KEYED ANSWER: A (2.45 A inductive). ⚠ CAUTION — the values as stated give X_net = 90 − 42 = 48 Ω, so |Z| = √(18² + 48²) = 51.26 Ω and I = 230/51.26 = 4.49 A lagging, which is not among the choices. The keyed letter is kept so your score matches the exam; treat this item as internally inconsistent.",why:["","2.45 A does not follow from |Z| = 51.26 Ω, and X_L > X_C makes the circuit inductive, not capacitive.","3.12 A would need |Z| ≈ 73.7 Ω, but R = 18 Ω against X_net = 48 Ω gives 51.26 Ω.","3.12 A capacitive fails on the magnitude and on the phase, since X_L > X_C makes the load inductive."],src:"Quiz 2 · Electrical Circuits 2 · Q21"},
    {q:"A parallel AC network contains: a 25 Ω resistive branch, a branch with X_L = 40 Ω, and a branch with X_C = 20 Ω. Determine the total admittance.",options:["0.04 − j0.025 S","0.025 + j0.04 S","0.025 − j0.04 S","0.04 + j0.025 S"],answer:3,diff:"hard",exp:"Y = 1/R + 1/(jX_L) + 1/(−jX_C) = 1/25 − j/40 + j/20 = 0.04 − j0.025 + j0.05 = 0.04 + j0.025 S.",why:["0.04 − j0.025 S keeps the inductor term −j/40 but omits the capacitor's +j/20 — the C branch is left out.","0.025 + j0.04 S is the reciprocal of 25 Ω and 40 Ω with the real and imaginary parts swapped.","0.025 − j0.04 S is that swapped form with the wrong sign on the susceptance.",""],src:"Quiz 2 · Electrical Circuits 2 · Q22"},
    {q:"A fabrication plant consumes 4.8 kW at a lagging power factor of 0.6. Determine the apparent power demand and reactive power absorbed by the facility.",options:["8 kVA, 6.4 kVAR","6.4 kVA, 8 kVAR","8 kVA, 4.8 kVAR","4.8 kVA, 6.4 kVAR"],answer:0,diff:"hard",exp:"S = P/pf = 4.8/0.6 = 8 kVA, and Q = √(S² − P²) = √(8² − 4.8²) = √(64 − 23.04) = √40.96 = 6.4 kVAR absorbed, since the power factor is lagging.",why:["","6.4 kVA, 8 kVAR swaps S and Q — S is always the largest of the three quantities.","8 kVA, 4.8 kVAR gives the right S but uses the real power 4.8 as if it were Q, so Q² + P² would not equal S².","4.8 kVA, 6.4 kVAR sets the apparent power equal to the real power, but S = P/pf = 8 kVA is always the larger."],src:"Quiz 2 · Electrical Circuits 2 · Q23"},
    {q:"A communication load exhibits an impedance of Z = 15 − j20 Ω. Determine the power factor and the nature of the load.",options:["0.6 lagging","0.8 lagging","0.6 leading","0.8 leading"],answer:2,diff:"medium",exp:"|Z| = √(15² + 20²) = 25 Ω, so pf = R/|Z| = 15/25 = 0.6. The negative imaginary part means capacitive reactance, and a capacitive load draws a LEADING current.",why:["0.6 lagging has the right magnitude but the wrong nature — a −j term means capacitive, hence leading.","0.8 lagging uses sin θ = 20/25 = 0.8 as though it were the power factor, and the wrong nature too.","","0.8 leading is sin θ = X/|Z| = 20/25, the reactive ratio, not the power factor (which is R/|Z|)."],src:"Quiz 2 · Electrical Circuits 2 · Q24"},
    {q:"The circuit is designed with a series resonant intermediate-frequency filter using L = 50 mH, C = 0.02 μF with a winding resistance of 12 Ω. Determine the resonant frequency and circuit impedance at resonance.",options:["1.59 kHz, 0 Ω","5.03 kHz, 0 Ω","1.59 kHz, 12 Ω","5.03 kHz, 12 Ω"],answer:3,diff:"hard",exp:"f₀ = 1/(2π√(LC)) = 1/(2π√(50×10⁻³ × 0.02×10⁻⁶)) = 1/(2π × 31.62×10⁻⁶) = 5.03 kHz. At series resonance the reactances cancel and Z = R = 12 Ω.",why:["1.59 kHz is 5.03/√10, from an error evaluating LC = 10⁻⁹; 0 Ω is also impossible because R remains in the circuit.","5.03 kHz is the correct frequency, but 0 Ω ignores the stated 12 Ω winding resistance — Z at series resonance equals R, not zero.","1.59 kHz gets both the frequency and the impedance wrong.",""],src:"Quiz 2 · Electrical Circuits 2 · Q25"}
  ]
};

});

// Safe storage wrapper: localStorage can throw (file:// origin, private
// browsing, disabled storage). Never let that take down the whole script.
const safeStore = {
  get(key) {
    try { return window.localStorage.getItem(key); }
    catch (e) { console.warn('localStorage unavailable:', e.message); return null; }
  },
  set(key, val) {
    try { window.localStorage.setItem(key, val); }
    catch (e) { console.warn('localStorage write failed:', e.message); }
  },
  remove(key) {
    try { window.localStorage.removeItem(key); }
    catch (e) { console.warn('localStorage remove failed:', e.message); }
  }
};

function loadHistory() {
  try { return JSON.parse(localStorage.getItem('correlQuizHistory') || '{}') || {}; }
  catch (e) { console.warn('Corrupt quiz history, starting fresh.'); return {}; }
}

let askedHistory = loadHistory();

}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (mode === 'topic') {
    document.getElementById('topicView').style.display = 'block';
  } else {
    document.getElementById('topicView').style.display = 'none';
    startQuiz();
  }
}

// Bank text goes into innerHTML, so it must be escaped first: an option like
// "0<K<8" is otherwise parsed as markup and renders as just "0", eating the rest.
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function renderTopicGrid() {
  const grid = document.getElementById('topicGrid');
  grid.innerHTML = '';
  Object.keys(QUESTION_BANK).forEach(topic => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.innerHTML = `${esc(topic)}<div class="count">${QUESTION_BANK[topic].length} questions</div>`;
    btn.onclick = () => toggleTopic(topic, btn);
    grid.appendChild(btn);
  });
}

function toggleTopic(topic, btn) {
  if (selectedTopics.includes(topic)) {
    selectedTopics = selectedTopics.filter(t => t !== topic);
    btn.classList.remove('active');
  } else {
    selectedTopics.push(topic);
    btn.classList.add('active');
  }
}

function updateCounts() {
  // Update counts based on history
  document.querySelectorAll('.topic-btn').forEach((btn, i) => {
    const topic = Object.keys(QUESTION_BANK)[i];
    const total = QUESTION_BANK[topic].length;
    const asked = (askedHistory[topic] || []).length;
    btn.querySelector('.count').textContent = `${total} questions (${asked} asked)`;
  });
}

function getQuestions(topic, count, difficulty) {
  let pool = [...QUESTION_BANK[topic]];
  
  // Filter by difficulty
  if (difficulty !== 'all') {
    pool = pool.filter(q => q.diff === difficulty);
  }
  
  // Sort by least recently asked (questions not in history come first)
  const history = askedHistory[topic] || [];
  pool.sort((a, b) => {
    const aGlobalIdx = QUESTION_BANK[topic].indexOf(a);
    const bGlobalIdx = QUESTION_BANK[topic].indexOf(b);
    const aHistIdx = history.findIndex(h => h.index === aGlobalIdx);
    const bHistIdx = history.findIndex(h => h.index === bGlobalIdx);
    // Questions not in history (-1) come first
    const aOrder = aHistIdx === -1 ? -1 : aHistIdx;
    const bOrder = bHistIdx === -1 ? -1 : bHistIdx;
    return aOrder - bOrder;
  });
  
  // Take first 'count' questions, avoiding recently asked
  let selected = pool.slice(0, count);
  
  // If not enough, fill from remaining
  if (selected.length < count) {
    const remaining = QUESTION_BANK[topic].filter(q => !selected.includes(q));
    selected = selected.concat(remaining.slice(0, count - selected.length));
  }
  
  return selected;
}



function startQuiz() {
  const qCount = parseInt(document.getElementById('qCount').value) || 10;
  const difficulty = document.getElementById('difficulty').value;

  let questions = [];

  if (currentMode === 'topic') {
    if (selectedTopics.length === 0) {
      alert('Please select at least one topic!');
      return;
    }
    selectedTopics.forEach(topic => {
      let qs = getQuestions(topic, Math.ceil(qCount / selectedTopics.length), difficulty);
      qs.forEach(q => { delete q.tosSection; });
      questions = questions.concat(qs);
    });
    questions = shuffleArray(questions).slice(0, qCount);
  } else if (currentMode === 'trial') {
    // General Trial Exam across all topics (randomly selected and balanced)
    const topics = Object.keys(QUESTION_BANK);
    topics.forEach(topic => {
      let qs = getQuestions(topic, Math.ceil(qCount / topics.length), difficulty);
      qs.forEach(q => { delete q.tosSection; });
      questions = questions.concat(qs);
    });
    questions = shuffleArray(questions).slice(0, qCount);
  } else if (currentMode === 'elecs' || currentMode === 'est') {
    // TOS Exam: STRICT sequence and category allocation following the Table of Specifications
    const config = TOS_CONFIG[currentMode];
    const sections = config.sections;
    const qLimit = qCount === 100 ? 100 : qCount;

    // Proportionally scale section allocations if qCount is less than 100
    let sectionAlloc = sections.map(s => {
      return {
        section: s,
        count: Math.floor((s.count / 100) * qLimit)
      };
    });

    let currentAllocSum = sectionAlloc.reduce((sum, a) => sum + a.count, 0);
    let rem = qLimit - currentAllocSum;
    if (rem > 0) {
      let fracs = sections.map((s, idx) => ({
        idx: idx,
        frac: ((s.count / 100) * qLimit) - sectionAlloc[idx].count
      })).sort((a, b) => b.frac - a.frac);
      for (let i = 0; i < rem; i++) {
        sectionAlloc[fracs[i % fracs.length].idx].count++;
      }
    }

    // Process each section in the EXACT order specified in the TOS
    sectionAlloc.forEach(item => {
      const s = item.section;
      const targetCount = item.count;
      if (targetCount <= 0) return;

      let sectionQs = [];
      if (s.banks) {
        // Multi-bank section (e.g., Diodes and Transistors)
        let subAlloc = s.banks.map(sub => ({
          bank: sub.bank,
          count: Math.floor((sub.count / s.count) * targetCount)
        }));
        let subSum = subAlloc.reduce((sum, sa) => sum + sa.count, 0);
        let subRem = targetCount - subSum;
        for (let i = 0; i < subRem; i++) {
          subAlloc[i % subAlloc.length].count++;
        }
        subAlloc.forEach(sa => {
          let qs = getQuestions(sa.bank, sa.count, difficulty);
          sectionQs = sectionQs.concat(qs);
        });
        // Shuffle within the section so diodes & transistors interleave
        sectionQs = shuffleArray(sectionQs);
      } else {
        sectionQs = getQuestions(s.bank, targetCount, difficulty);
      }

      // Label every question with its exact TOS section name and item number
      sectionQs.forEach((q, qIdx) => {
        q.tosSection = s.label;
        q.tosItemNum = qIdx + 1;
        q.tosItemTotal = targetCount;
      });

      // Append in STRICT order - DO NOT globally shuffle afterwards
      questions = questions.concat(sectionQs);
    });
  } else if (currentMode === 'weak') {
    // Find topics with lowest accuracy
    const topicAccuracy = {};
    Object.keys(QUESTION_BANK).forEach(topic => {
      const h = askedHistory[topic] || [];
      if (h.length === 0) {
        topicAccuracy[topic] = 0;
      } else {
        const correct = h.filter(x => x.correct).length;
        topicAccuracy[topic] = correct / h.length;
      }
    });
    const sorted = Object.keys(topicAccuracy).sort((a, b) => topicAccuracy[a] - topicAccuracy[b]);
    const weakTopics = sorted.slice(0, Math.min(3, sorted.length));
    weakTopics.forEach(topic => {
      let qs = getQuestions(topic, Math.ceil(qCount / weakTopics.length), difficulty);
      qs.forEach(q => { delete q.tosSection; });
      questions = questions.concat(qs);
    });
    questions = shuffleArray(questions).slice(0, qCount);
  }

  currentQuestions = questions;
  currentIndex = 0;
  score = 0;
  answers = [];

  document.getElementById('topicView').style.display = 'none';
  document.getElementById('quizArea').classList.add('active');
  document.getElementById('resultArea').classList.remove('active');

  showQuestion();
}

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showQuestion() {
  const q = currentQuestions[currentIndex];
  const total = currentQuestions.length;
  const progress = ((currentIndex) / total) * 100;
  
  document.getElementById('progressFill').style.width = progress + '%';
  
  const card = document.getElementById('questionCard');
  card.innerHTML = `
    ${q.tosSection ? `<div class="tos-badge">TOS: ${esc(q.tosSection)}</div>` : ''}
    <div class="question-num">Question ${currentIndex + 1} of ${total} | ${q.diff.toUpperCase()}</div>
    <div class="question-text">${esc(q.q)}${q.img ? `<img class="qfig" src="${q.img}" alt="circuit diagram">` : ''}</div>
    <div class="options">
      ${q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectAnswer(${i})">${String.fromCharCode(65 + i)}. ${esc(opt)}</button>
      `).join('')}
    </div>
    <div class="explanation" id="explanation"></div>
  `;
  
  document.getElementById('nextBtn').style.display = 'none';
}

function selectAnswer(idx) {
  const q = currentQuestions[currentIndex];
  const buttons = document.querySelectorAll('.option-btn');
  const explanation = document.getElementById('explanation');
  
  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.answer) {
      btn.classList.add('correct');
    } else if (i === idx && idx !== q.answer) {
      btn.classList.add('wrong');
    }
  });
  
  const correct = idx === q.answer;
  if (correct) score++;
  
  answers.push({
    question: q.q,
    correct: correct,
    explanation: q.exp,
    why: q.why,
    src: q.src,
    picked: idx,
    answer: q.answer,
    options: q.options
  });
  
  // Update history
  const topic = findTopicForQuestion(q);
  if (!askedHistory[topic]) askedHistory[topic] = [];
  const globalIdx = QUESTION_BANK[topic].indexOf(q);
  askedHistory[topic].push({ index: globalIdx, q: q.q, correct: correct, timestamp: Date.now() });
  localStorage.setItem('correlQuizHistory', JSON.stringify(askedHistory));
  
  let html = `<h4>${correct ? 'Correct!' : 'Incorrect'}</h4><p>${esc(q.exp || '')}</p>`;
  if (!correct) {
    html += `<p class="why-wrong">The correct answer is: ${String.fromCharCode(65 + q.answer)}. ${esc(q.options[q.answer])}</p>`;
  }
  // Per-option analysis: shown when the bank supplies `why`, and always shown
  // after a wrong pick so the trap option is explained.
  if (q.why && (!correct || q.why.some(x => x))) {
    html += `<div class="opt-review"><div class="hdr">${correct ? 'Why the other options are wrong:' : 'Every option, and why:'}</div>`;
    q.options.forEach((opt, i) => {
      const why = (q.why && q.why[i]) ? q.why[i] : '';
      if (!why && i !== q.answer && i !== idx) return;
      const cls = i === idx ? 'picked' : (i === q.answer ? 'right' : 'other');
      html += `<div class="opt-row ${cls}"><span class="opt-key">${String.fromCharCode(65 + i)}</span>`
           +  `<span>${esc(why) || (i === q.answer ? 'The correct answer.' : '')}</span></div>`;
    });
    html += `</div>`;
  }
  if (q.src) html += `<div class="source-line">Source: ${q.src}</div>`;
  explanation.innerHTML = html;
  explanation.classList.add('show');
  
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function findTopicForQuestion(question) {
  for (const [topic, questions] of Object.entries(QUESTION_BANK)) {
    if (questions.includes(question)) return topic;
  }
  return 'Unknown';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    showResults();
  } else {
    showQuestion();
  }
}

function showResults() {
  document.getElementById('quizArea').classList.remove('active');
  document.getElementById('resultArea').classList.add('active');
  
  const total = currentQuestions.length;
  const pct = Math.round((score / total) * 100);
  
  document.getElementById('scoreBig').textContent = `${score}/${total} (${pct}%)`;
  document.getElementById('scoreStats').innerHTML = `
    <div class="stat-item"><div class="val" style="color:var(--accent2)">${score}</div><div class="lbl">Correct</div></div>
    <div class="stat-item"><div class="val" style="color:var(--danger)">${total - score}</div><div class="lbl">Wrong</div></div>
    <div class="stat-item"><div class="val">${pct}%</div><div class="lbl">Score</div></div>
  `;
  
  const review = document.getElementById('reviewArea');
  review.innerHTML = '<h3 style="margin-bottom:12px">Review</h3>';
  answers.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'review-item ' + (a.correct ? 'correct' : 'wrong');
    div.innerHTML = `
      <div class="q">${i + 1}. ${esc(a.question)}</div>
      <div class="a">${a.correct ? 'Correct' : 'Incorrect'}</div>
      <div class="e">${esc(a.explanation)}</div>
    `;
    review.appendChild(div);
  });
}

function quitQuiz() {
  document.getElementById('quizArea').classList.remove('active');
  document.getElementById('topicView').style.display = 'block';
  updateCounts();
}

function backToTopics() {
  document.getElementById('resultArea').classList.remove('active');
  document.getElementById('topicView').style.display = 'block';
  updateCounts();
}

function resetHistory() {
  if (confirm('Reset all quiz history? This will clear your progress tracking.')) {
    askedHistory = {};
    localStorage.removeItem('correlQuizHistory');
    updateCounts();
  }
}

// Start
init();
</script>
</body>
</html>
