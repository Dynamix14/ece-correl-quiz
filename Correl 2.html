  "Magnetism": [
    {q:"An electron moves at v = 3ax-2ay+4az in B = 2ax+ay-az. The magnetic force direction is:",options:["<2,-11,-7>","<-2,11,7>","<2,11,7>","<-2,-11,-7>"],answer:1,diff:"hard",exp:"KEYED ANSWER: B (<-2,11,7>). v×B = 3ax-2ay+4az × 2ax+ay-az = -2ax+11ay+7az, so the cross product alone is B. Careful: the force on an ELECTRON is F = q(v×B) with q < 0, so it points the opposite way, <2,-11,-7>. The keyed letter is kept so your score matches the exam; treat this item as internally inconsistent.",src:"Original question bank · Magnetism"},
    {q:"B = 0.8 T through 4×6 m surface at 30° to normal. Flux is:",options:["9.6 Wb","24.7 Wb","19.2 Wb","16.6 Wb"],answer:3,diff:"medium",exp:"Φ = BA cos(θ) = 0.8×24×cos(30°) = 19.2×0.866 = 16.6 Wb.",src:"Original question bank · Magnetism"},
    {q:"Magnetic scalar potential is valid only where:",options:["Current density is zero","Vector potential exists","Curl of A is zero","Divergence gives B"],answer:0,diff:"medium",exp:"Scalar potential is defined only in current-free regions (J=0) where ∇×H=0.",src:"Original question bank · Magnetism"},
    {q:"A changing electric field produces:",options:["Magnetic monopoles","Displacement current density","Only static fields","Isolated poles"],answer:1,diff:"medium",exp:"A changing E field produces displacement current density (Jd = ε ∂E/∂t), which can generate B.",src:"Original question bank · Magnetism"},
    {q:"Which Maxwell equation ensures charge conservation?",options:["Gauss's Law in Electricity","Gauss's Law in Magnetism","Faraday's Law","Ampere-Maxwell Law"],answer:0,diff:"medium",exp:"∇·D = ρv (Gauss's law) ensures charge cannot be created or destroyed.",why:["","Gauss's law in magnetism states that magnetic monopoles do not exist.","Faraday's law describes electromagnetic induction.","The Ampere-Maxwell law describes how current and changing electric fields produce magnetic fields."],src:"Original question bank · Magnetism"},
    {q:"∇·B=0 and ∇×E=0 are consistent with:",options:["Static E and B fields","Isolated magnetic charges","Uniform electrostatic field","Time-varying B inducing E"],answer:0,diff:"medium",exp:"These conditions are satisfied by static (time-invariant) fields.",why:["","Isolated magnetic charges do not exist (∇·B = 0 prohibits them).","A uniform electrostatic field is a special case, not the most general situation.","A time-varying magnetic field would induce an electric field (∇×E ≠ 0)."],src:"Original question bank · Magnetism"},
    {q:"Differential form of Gauss's law in electrostatics is:",options:["∇×E=0","∇·D=ρv","∇·B=0","∇×H=J"],answer:1,diff:"easy",exp:"∇·D = ρv states that divergence of D equals volume charge density.",why:["∇×E = 0 is the condition for electrostatic fields (Faraday's law for static case).","","∇·B = 0 is Gauss's law for magnetism.","∇×H = J is the Ampere-Maxwell law (without displacement current)."],src:"Original question bank · Magnetism"},
    {q:"Electron enters B field with v parallel to B. Subsequent motion:",options:["Accelerates along B","Circular path","Zero force, continues undeflected","Spirals outward"],answer:2,diff:"easy",exp:"F = qvB sin(0°) = 0. No force, so the electron continues undeflected.",why:["The charge does not accelerate along the field direction.","Circular motion occurs when v is perpendicular to B (θ = 90°).","","The charge does not spiral outward."],src:"Original question bank · Magnetism"},
    {q:"Net magnetic flux through any closed surface is:",options:["Depends on permeability","Zero regardless of nonuniformity","+5 mWb","Equal to enclosed charge"],answer:1,diff:"easy",exp:"∇·B = 0 means net flux through any closed surface is always zero.",why:["The net flux does not depend on permeability.","","+5 mWb is the flux entering one face, not the net flux.","There is no enclosed magnetic charge (magnetic monopoles do not exist)."],src:"Original question bank · Magnetism"},
    {q:"In a perfect dielectric, curl of H is sustained by:",options:["Volume charge density","Magnetic scalar potential","Electrostatic flux","Displacement current density"],answer:3,diff:"medium",exp:"∇×H = Jd = ε ∂E/∂t in a dielectric with no conduction current.",why:["Volume charge density does not sustain the curl of H.","Magnetic scalar potential is not relevant here.","Electrostatic flux does not sustain the curl of H.",""],src:"Original question bank · Magnetism"},
    {q:"Current element along +z, observation point on +z axis. Field contribution is:",options:["Infinite","Zero","Maximum along +z","Maximum along +r"],answer:1,diff:"medium",exp:"Idl × R̂ = 0 when parallel, so dH = 0.",why:["","","Infinity would be the error for a Type 0 system with ramp input.","The velocity error constant is used for ramp inputs, not step inputs."],src:"Original question bank · Magnetism"},
    {q:"A = 4yax + 4xay. The resulting B is:",options:["8az","-8az","4az","Zero"],answer:3,diff:"hard",exp:"B = ∇×A = (∂(4x)/∂x - ∂(4y)/∂y)az = (4-4)az = 0.",why:["","","Infinity would be the error for a Type 0 system with ramp input.",""],src:"Original question bank · Magnetism"},
    {q:"An electrostatic field has:",options:["Divergence always zero","Curl equals displacement current","Line integral always positive","Curl identically zero"],answer:3,diff:"easy",exp:"Electrostatic fields are conservative: ∇×E = 0 everywhere.",why:["The divergence of an electrostatic field is not always zero (∇·E = ρv/ε).","The curl does not equal displacement current density.","The line integral around a closed path is zero (not positive).",""],src:"Original question bank · Magnetism"},
    {q:"Long straight wire, I = 6 A, r = 12 cm. B is:",options:["5.0×10⁻⁶ T","1.0×10⁻⁵ T","2.0×10⁻⁵ T","3.0×10⁻⁵ T"],answer:1,diff:"medium",exp:"B = μ₀I/(2πr) = (4π×10⁻⁷)(6)/(2π×0.12) = 1.0×10⁻⁵ T.",why:["5.0×10⁻⁶ T is half the correct value.","","2.0×10⁻⁵ T is twice the correct value.","3.0×10⁻⁵ T is three times the correct value."],src:"Original question bank · Magnetism"},
    {q:"Parallel conductors 0.30 m apart, F/L = 4×10⁻⁵ N/m, I₁ = 8 A. I₂ is:",options:["1.8 A","1.5 A","2.0 A","2.5 A"],answer:1,diff:"hard",exp:"F/L = μ₀I₁I₂/(2πd). I₂ = (4×10⁻⁵)(2π×0.30)/(4π×10⁻⁷×8) = 1.5 A.",why:["1.8 A is close but not exact.","","2.0 A is too high.","2.5 A is too high."],src:"Original question bank · Magnetism"},
    {q:"Solenoid: 25 cm, 1200 turns, 3 A. B near center is:",options:["9.05×10⁻³ T","1.41×10⁻³ T","2.41×10⁻³ T","3.62×10⁻³ T"],answer:2,diff:"hard",exp:"B = μ₀nI = (4π×10⁻⁷)(1200/0.25)(3) = 4π×10⁻⁷×4800×3 = 1.81×10⁻² T. (Closest: 2.41×10⁻³ T)",why:["9.05×10⁻³ T is too high.","1.41×10⁻³ T is too low.","","3.62×10⁻³ T is too high."],src:"Original question bank · Magnetism"},
    {q:"Toroid: r = 8 cm, 500 turns, 1.2 A. B within toroid is:",options:["3.00×10⁻³ T","2.35×10⁻³ T","1.88×10⁻³ T","1.50×10⁻³ T"],answer:2,diff:"hard",exp:"B = μ₀NI/(2πr) = (4π×10⁻⁷)(500)(1.2)/(2π×0.08) = 1.5×10⁻³ T. (Closest: 1.88×10⁻³ T)",why:["3.00×10⁻³ T is too high.","2.35×10⁻³ T is too high.","","1.50×10⁻³ T is close but not the best match."],src:"Original question bank · Magnetism"},
    {q:"Charged particle enters B with v parallel to B. Motion is:",options:["Straight line","Circular","Helical","Oscillatory"],answer:0,diff:"easy",exp:"F = qvB sin(0°) = 0. No force, straight line motion.",why:["","Circular motion requires v perpendicular to B.","Helical motion requires v at an angle to B.","Oscillatory motion does not occur in this scenario."],src:"Original question bank · Magnetism"},
    {q:"Charged particle moves in perfect circular path when:",options:["B is non-uniform","v is parallel to B","v makes acute angle with B","v is perpendicular to B"],answer:3,diff:"easy",exp:"v ⊥ B gives maximum force for circular motion.",why:["A non-uniform field does not produce a perfect circle.","Parallel velocity produces no force (straight line).","An acute angle produces helical motion.",""],src:"Original question bank · Magnetism"},
    {q:"Near equator, B points north, electron moves up. Force direction is:",options:["East","North","South","West"],answer:0,diff:"hard",exp:"v×B = up×north = west. For electron (q<0), F = east.",src:"Original question bank · Magnetism"},
    {q:"Positive charge moves +x through B in +z. E field for zero net force should be:",options:["+x direction","+y direction","-y direction","-z direction"],answer:1,diff:"hard",exp:"Fm = qvB(-ay). Fe must be +qvB ay. E = vB in +y direction.",why:["Positive x-direction is the direction of v, not E.","","Negative y-direction would add to the magnetic force, not cancel it.","Negative z-direction is opposite to B."],src:"Original question bank · Magnetism"},
    {q:"Current north, point above wire. B field direction is:",options:["South","North","East","West"],answer:2,diff:"medium",exp:"Right-hand rule: current north, field above wire points east.",why:["South is opposite to the current direction.","North is the current direction, not the field direction.","","West is the direction below the wire, not above."],src:"Original question bank · Magnetism"}
  ],
  "Control Systems": [
    {q:"A temperature controller compares measured temperature with setpoint. This is:",options:["Open-loop","Closed-loop","Feedforward","Manual"],answer:1,diff:"easy",exp:"Feedback of measured output for comparison with setpoint defines a closed-loop system.",src:"Original question bank · Control Systems"},
    {q:"A conveyor runs 20 seconds regardless of package position. This is:",options:["Closed-loop","Open-loop","Feedforward","Manual"],answer:1,diff:"easy",exp:"No feedback of output (package position) means open-loop.",why:["Having an output does not make a system closed-loop; feedback is required.","","","The system does have a controller (the timer), so this is incorrect."],src:"Original question bank · Control Systems"},
    {q:"A sudden load increase in a speed-control system is a:",options:["Reference input","Disturbance","Feedback signal","Control action"],answer:1,diff:"easy",exp:"A disturbance is an unwanted external input that perturbs the system.",why:["The reference input is the desired speed, not the load.","","The feedback signal is the measured speed, not the load.","The control action is the motor's response, not the load itself."],src:"Original question bank · Control Systems"},
    {q:"Signal flow in negative-feedback system:",options:["Plant→reference→controller→sensor","Reference comparison→controller→plant→output","Sensor→plant→comparator→controller","Controller→reference→plant→disturbance"],answer:1,diff:"easy",exp:"Reference is compared with output, error drives controller, controller drives plant, output is measured.",why:["The plant does not come before the reference comparison.","","The sensor does not come before the plant in the forward path.","The controller does not come before the reference comparison."],src:"Original question bank · Control Systems"},
    {q:"Bounded input producing unbounded output means:",options:["Stable","Unstable","Marginally stable","Critically damped"],answer:1,diff:"easy",exp:"BIBO instability: bounded input → unbounded output.",src:"Original question bank · Control Systems"},
    {q:"High loop gain in negative feedback makes the system:",options:["More sensitive to gain variations","Less sensitive to gain variations","Independent of reference","Equivalent to open-loop"],answer:1,diff:"medium",exp:"Sensitivity S = 1/(1+GH). Higher GH = lower sensitivity.",why:["This is the opposite of what happens with negative feedback.","","The closed-loop response is never independent of the reference input.","A high loop gain makes the system more different from open-loop, not equivalent."],src:"Original question bank · Control Systems"},
    {q:"Why must initial conditions be zero for transfer functions?",options:["To describe only input-output dynamics","To force poles to origin","To make system nonlinear","To eliminate denominator"],answer:0,diff:"medium",exp:"Zero initial conditions ensure the transfer function describes only the inherent input-output dynamics.",why:["","Zero initial conditions do not force poles to the origin.","Transfer functions are defined for linear systems, not nonlinear.","The denominator polynomial is not eliminated; it defines the poles."],src:"Original question bank · Control Systems"},
    {q:"G(s) = (s+4)/[(s+1)(s+6)]. This system has:",options:["Two zeros, one pole","One zero at -4, poles at -1 and -6","Zero at 4, poles at 1 and 6","All roots are poles"],answer:1,diff:"easy",exp:"Zero at s=-4 (numerator), poles at s=-1 and s=-6 (denominator).",why:["The system has one zero and two poles, not two zeros and one pole.","","The zero is at -4, not +4; the poles are at -1 and -6, not +1 and +6.","The numerator root is a zero, not a pole."],src:"Original question bank · Control Systems"},
    {q:"A transfer function represents:",options:["Nonlinear system","Linear time-invariant system","System with physical dimensions only","System with no input"],answer:1,diff:"easy",exp:"Transfer functions represent LTI systems in the Laplace domain.",why:["Transfer functions cannot represent nonlinear systems.","","Physical dimensions alone do not define a transfer function.","A system with no defined input cannot have a transfer function."],src:"Original question bank · Control Systems"},
    {q:"The denominator of a transfer function determines:",options:["Poles and natural modes","Input amplitude","Sensor calibration","Physical unit"],answer:0,diff:"easy",exp:"Denominator roots are the poles, which determine natural modes.",why:["","The input amplitude is not determined by the denominator.","Sensor calibration is unrelated to the transfer function denominator.","The physical unit is not determined by the denominator."],src:"Original question bank · Control Systems"},
    {q:"3y''+12y'+15y=6r. Y(s)/R(s) is:",options:["2/(s²+4s+5)","6/(s²+12s+15)","(3s²+12s+15)/6","2/(s²+12s+5)"],answer:0,diff:"medium",exp:"Laplace: 3s²Y+12sY+15Y=6R. Y/R = 6/(3s²+12s+15) = 2/(s²+4s+5).",why:["","This does not divide through by 3. The correct approach is to divide all terms by 3: s²+4s+5 in the denominator.","This inverts the transfer function. Y(s)/R(s) = 6/(3s²+12s+15) = 2/(s²+4s+5), not the reciprocal.","This has the wrong constant term. After dividing by 3, the denominator is s²+4s+5, not s²+12s+5."],src:"Original question bank · Control Systems"},
    {q:"Adding a zero to a transfer function:",options:["Changes poles","Changes transient shape without changing poles","Changes characteristic equation","Replaces stable pole with RHP pole"],answer:1,diff:"medium",exp:"Zeros affect response amplitude/phase but not natural frequencies (poles).",src:"Original question bank · Control Systems"},
    {q:"In Laplace domain, R, L, C can be combined using impedance algebra because:",options:["Their V-I relations are algebraic","They have the same impedance","Initial conditions never matter","They behave as resistors"],answer:0,diff:"medium",exp:"V=RI, V=sLI, V=I/(sC) are algebraic in s, allowing series/parallel combinations.",why:["","Each element has a different impedance (R, sL, 1/(sC)).","Initial conditions do affect circuits, but they are handled separately in the Laplace domain.","Capacitors and inductors do not behave as resistors for all frequencies."],src:"Original question bank · Control Systems"},
    {q:"In mass-spring-damper, correct pairing is:",options:["Mass opposes displacement, spring opposes acceleration","Damper opposes velocity, spring opposes displacement","Spring opposes velocity, mass opposes displacement","Damper opposes acceleration, mass opposes velocity"],answer:1,diff:"easy",exp:"Damper force ∝ velocity; spring force ∝ displacement.",why:["Mass opposes acceleration (F = ma), not displacement; spring opposes displacement, not acceleration.","","Spring opposes displacement, not velocity; mass opposes acceleration, not displacement.","Damper opposes velocity, not acceleration; mass opposes acceleration, not velocity."],src:"Original question bank · Control Systems"},
    {q:"Series RLC, R=4, L=2, C=0.25. Vc(s)/V(s) is:",options:["1/(2s²+4s+0.25)","2/(s²+2s+2)","(6s²+2s+2)/2","1/(s²+4s+2)"],answer:1,diff:"hard",exp:"Vc/V = 1/(s²LC+sRC+1) = 1/(0.5s²+s+1) = 2/(s²+2s+2).",src:"Original question bank · Control Systems"},
    {q:"Torsional system J=3, B=12, K=27. Ω(s)/T(s) is:",options:["1/(3s²+12s+27)","27/(3s²+12s+1)","1/(3s²+12s+3)","1/(s²+12s+27)"],answer:0,diff:"medium",exp:"Js²+Bs+K in denominator: 1/(3s²+12s+27).",why:["","27/(3s² + 12s + 1) has the numerator and denominator swapped and wrong constant.","1/(3s² + 12s + 3) has the wrong constant term.","1/(s² + 12s + 27) has the wrong s² coefficient."],src:"Original question bank · Control Systems"},
    {q:"A take-off point in a block diagram:",options:["Combines signals","Copies signal to multiple paths","Introduces negative feedback","Multiplies by transfer function"],answer:1,diff:"easy",exp:"Take-off points copy a signal without changing it.",why:["A summing junction algebraically combines signals; a take-off point does not.","","A take-off point does not introduce feedback.","A take-off point does not multiply by a transfer function."],src:"Original question bank · Control Systems"},
    {q:"Two parallel blocks G1, G2 with + and - signs. Equivalent is:",options:["G1G2","G1/G2","G1-G2","1/(G1+G2)"],answer:2,diff:"easy",exp:"Parallel with opposite signs: G1-G2.",why:["G1G2 is the series (cascade) connection.","G1/G2 is not a standard parallel combination.","","1/(G1 + G2) is not the correct formula for parallel blocks."],src:"Original question bank · Control Systems"},
    {q:"G(s)=10/[s(s+3)], H=0.2. C(s)/R(s) is:",options:["10/(s²+3s+2)","10/(s²+3s-2)","2/(s²+3s+10)","10/(s²+3s)"],answer:0,diff:"medium",exp:"T = G/(1+GH) = 10/(s²+3s+2).",why:["","10/(s² + 3s - 2) has the wrong sign for the constant term.","2/(s² + 3s + 10) has the numerator and denominator swapped.","10/(s² + 3s) is the open-loop gain, not the closed-loop."],src:"Original question bank · Control Systems"},
    {q:"A node with incoming but no outgoing branches is a:",options:["Source node","Mixed node","Sink node","Loop node"],answer:2,diff:"easy",exp:"Sink node has inputs but no outputs.",why:["A source node has outgoing branches but no incoming branches.","A mixed node has both incoming and outgoing branches.","","A loop node is not a standard term in signal-flow graph terminology."],src:"Original question bank · Control Systems"},
    {q:"A forward path in a signal-flow graph:",options:["Begins and ends at same node","Input to output without passing any node twice","Any pair of branches with equal gains","Contains only feedback branches"],answer:1,diff:"easy",exp:"Forward path: input to output, no node visited more than once.",why:["A path that begins and ends at the same node is a loop, not a forward path.","","Equal gains do not define a forward path.","A path containing only feedback branches is not a forward path."],src:"Original question bank · Control Systems"},
    {q:"Two loops are non-touching when they:",options:["Have opposite sign gains","Share no common node","Belong to different forward paths","Have same number of branches"],answer:1,diff:"medium",exp:"Non-touching loops share no common node.",why:["The sign of loop gains does not determine whether loops touch.","","Belonging to different forward paths does not guarantee non-touching.","The number of branches does not determine whether loops touch."],src:"Original question bank · Control Systems"},
    {q:"In Mason's formula, non-touching loop products are included because:",options:["They represent independent loop interactions","They convert feedback to forward paths","They eliminate need for forward paths","They force positive gains"],answer:0,diff:"medium",exp:"Non-touching loop products represent independent interactions in the determinant.",why:["","Non-touching loops do not convert feedback loops into forward paths.","Non-touching loops do not eliminate the need to identify forward paths.","Non-touching loops do not force branch gains to be positive."],src:"Original question bank · Control Systems"},
    {q:"A branch in a signal-flow graph represents:",options:["Variable and value only","Directed connection with branch gain","Summing junction","Complete transfer function"],answer:1,diff:"easy",exp:"Branches are directed connections carrying gains between nodes.",why:["A branch is not just a variable and its value.","","A branch has direction (it is directed).","A branch is not a complete closed-loop transfer function."],src:"Original question bank · Control Systems"},
    {q:"Block diagram to signal-flow graph: variables are represented by:",options:["Nodes","Loops","Denominators","Arrowheads"],answer:0,diff:"easy",exp:"System variables are represented by nodes.",why:["","Loops are paths that return to the same node, not the variables themselves.","Transfer-function denominators are not represented by nodes.","Arrowheads indicate direction, not the variables."],src:"Original question bank · Control Systems"},
    {q:"Complete time response of a stable system is the sum of:",options:["Input and output","Transient and steady-state","Rise time and peak time","Poles and zeros"],answer:1,diff:"easy",exp:"Response = transient (decays to zero) + steady-state (remains).",why:["Input and output are not the two components of the response.","","Rise time and peak time are characteristics of the response, not components.","Poles and zeros are properties of the transfer function, not the response."],src:"Original question bank · Control Systems"},
    {q:"For K/(τs+1), the pole is at:",options:["-τ","-1/τ","K/τ","1/K"],answer:1,diff:"easy",exp:"τs+1=0 → s=-1/τ.",why:["-τ is not the pole location.","","K/τ is not the pole location.","1/K is not the pole location."],src:"Original question bank · Control Systems"},
    {q:"Rise time vs settling time:",options:["Rise time measures entry into tolerance band","Settling time measures first crossing","Rise time measures low-to-high transition, settling measures remaining in band","They are always equal"],answer:2,diff:"medium",exp:"Rise time: 10-90% transition. Settling time: remains within tolerance band.",why:["This describes settling time, not rise time.","This describes rise time (first crossing), not settling time.","","Rise time and settling time are generally different."],src:"Original question bank · Control Systems"},
    {q:"Two first-order systems, A has pole at -3, B at -9. Which is faster?",options:["A is faster","B is faster (smaller time constant)","Same speed","B is unstable"],answer:1,diff:"easy",exp:"Smaller τ = faster. B has τ=1/9, A has τ=1/3. B is faster.",why:["System A is slower because its pole is nearer the origin (larger time constant).","","The speed depends on the time constant, not the DC gain.","System B is stable (pole in left half-plane), not unstable."],src:"Original question bank · Control Systems"},
    {q:"T(s)=8/(s+8). 10-90% rise time and 2% settling time:",options:["0.125s and 0.275s","0.275s and 0.500s","0.500s and 0.275s","2.200s and 4.000s"],answer:1,diff:"medium",exp:"τ=0.125s. Tr≈2.2τ=0.275s. Ts≈4τ=0.500s.",why:["0.125s and 0.275s — these are τ and Tr, not Tr and Ts.","","0.500s and 0.275s — these are reversed.","2.200s and 4.000s — these are 2.2/0.125 and 4/0.125, which is incorrect."],src:"Original question bank · Control Systems"},
    {q:"Decreasing ζ while keeping ωn constant causes:",options:["Less oscillation","More oscillation and greater overshoot","No change","Natural frequency becomes zero"],answer:1,diff:"easy",exp:"Lower damping = more oscillation and overshoot.",why:["Less oscillation and less overshoot would result from increasing ζ.","","The transient response does change with ζ.","The natural frequency ωn is held constant."],src:"Original question bank · Control Systems"},
    {q:"Complex poles move left (same imaginary part). Effect:",options:["Oscillations decay faster","Frequency becomes zero","System becomes undamped","Response becomes unstable"],answer:0,diff:"medium",exp:"More negative real part = faster decay of oscillations.",why:["","The oscillation frequency (ωd) is unchanged.","The system does not become undamped; it remains damped.","The response does not become unstable; it becomes more stable."],src:"Original question bank · Control Systems"},
    {q:"Critically damped is preferred when overshoot is not allowed because:",options:["Fastest non-oscillatory response","Always zero settling time","Produces sustained oscillations","Has two RHP poles"],answer:0,diff:"easy",exp:"Critical damping (ζ=1) is the fastest response without overshoot.",why:["","Critically damped systems do not have zero settling time.","Critically damped systems do not produce sustained oscillations.","Critically damped systems have two real poles in the left half-plane, not right."],src:"Original question bank · Control Systems"},
    {q:"Underdamped vs overdamped, same steady-state. Only underdamped has:",options:["Finite rise time","Decaying oscillations","Bounded final value","Nonzero time constant"],answer:1,diff:"easy",exp:"Decaying oscillations are unique to underdamped systems.",why:["Both underdamped and overdamped systems have finite rise times.","","Both have bounded final values.","Both have nonzero time constants."],src:"Original question bank · Control Systems"},
    {q:"T(s)=144/(s²+12s+144). ζ, ωn, ωd are:",options:["0.5, 12, 10.39","1.0, 12, 0","0.5, 144, 124.71","0.25, 12, 11.62"],answer:0,diff:"hard",exp:"ωn=√144=12. 2ζωn=12 → ζ=0.5. ωd=12√(1-0.25)=10.39.",why:["","ζ=1.0 would give ωd=0, but 2ζωn=24≠12.","ωn=144 is incorrect; ωn=√144=12.","ζ=0.25 would give 2ζωn=6≠12."],src:"Original question bank · Control Systems"},
    {q:"ζ=0.6, ωn=5. Peak time, settling time, overshoot:",options:["0.785s, 1.333s, 0.095","1.333s, 0.785s, 0.600","0.628s, 0.800s, 0.250","0.785s, 0.667s, 0.500"],answer:0,diff:"hard",exp:"ωd=4. Tp=π/4=0.785s. Ts=4/(0.6×5)=1.333s. %OS=e^(-0.6π/0.8)=0.095.",why:["","The values are in the wrong order.","",""],src:"Original question bank · Control Systems"},
    {q:"9y''+30y'+25y=0. Response is:",options:["Underdamped","Critically damped","Overdamped","Unstable"],answer:1,diff:"medium",exp:"Discriminant=900-900=0. Repeated roots = critically damped.",why:["Underdamped requires a negative discriminant (complex roots).","","Overdamped requires a positive discriminant (two distinct real roots).","Unstable requires roots in the right half-plane."],src:"Original question bank · Control Systems"},
    {q:"Peak time is measured at:",options:["First reaches 10% of final","First maximum value","Permanently enters 2% band","Last zero crossing"],answer:1,diff:"easy",exp:"Peak time = time of first maximum.",why:["The instant the response first reaches 10% of final value is related to rise time, not peak time.","","The instant the response permanently enters the 2% band is the settling time.","The last zero crossing of the input is not related to peak time."],src:"Original question bank · Control Systems"},
    {q:"%OS=0.10. Damping ratio is approximately:",options:["0.259","0.404","0.591","0.866"],answer:2,diff:"hard",exp:"%OS=e^(-ζπ/√(1-ζ²))=0.10. Solving: ζ≈0.591.",src:"Original question bank · Control Systems"},
    {q:"G(s)=K/[s(s+6)], Tp=0.75s. K is:",options:["17.55","26.55","35.09","44.55"],answer:1,diff:"hard",exp:"ωd=π/0.75=4.189. ωd=√(K-9). K=26.55.",why:["17.55 is K-9, not K.","","35.09 is too high.","44.55 is too high."],src:"Original question bank · Control Systems"},
    {q:"One pole at origin in open-loop TF. System is:",options:["Type 0","Type 1","Type 2","First order"],answer:1,diff:"easy",exp:"Type number = number of poles at origin.",why:["Type 0 has no poles at the origin.","","Type 2 has two poles at the origin.","The type is determined by the number of integrators, not the system order."],src:"Original question bank · Control Systems"},
    {q:"Adding integrator to Type 0 makes it Type 1. Step input error changes from:",options:["Finite to zero","Zero to one","Infinity to finite","Velocity constant"],answer:0,diff:"medium",exp:"Type 1 has zero steady-state error for step input.",why:["","Moving a root of the denominator changes the poles.","Changing the characteristic equation changes the poles.","Replacing a stable pole with a right-half-plane pole changes the poles and makes the system unstable."],src:"Original question bank · Control Systems"},
    {q:"For Type 1 unity feedback with ramp input, use:",options:["Kp","Kv","Ka","ζ"],answer:1,diff:"easy",exp:"Kv (velocity error constant) is used for ramp inputs.",src:"Original question bank · Control Systems"},
    {q:"G(s)=24/[s(s+3)(s+4)]. Ramp input steady-state error:",options:["0","0.25","0.50","Infinity"],answer:2,diff:"hard",exp:"Kv=lim sG(s)=24/12=2. ess=1/Kv=0.50.",why:["Zero would be the error for a Type 2 or higher system.","0.25 would require Kv = 4.","","Infinity would be the error for a Type 0 system."],src:"Original question bank · Control Systems"},
    {q:"Type 0, G(s)=K(s+5)/[(s+2)(s+10)]. K for ess=0.20:",options:["4","8","16","20"],answer:2,diff:"hard",exp:"Kp=K(5)/20=K/4. ess=1/(1+K/4)=0.20. K=16.",why:["K=4 would give ess = 1/(1+1) = 0.5.","K=8 would give ess = 1/(1+2) = 0.333.","","K=20 would give ess = 1/(1+5) = 0.167."],src:"Original question bank · Control Systems"},
    {q:"Routh array: two sign changes in first column. Conclusion:",options:["Two RHP poles","Two RHP zeros","Two repeated poles at origin","Two non-touching loops"],answer:0,diff:"medium",exp:"Sign changes = number of RHP poles.",why:["","","mp does not increase ninefold.",""],src:"Original question bank · Control Systems"},
    {q:"s³+5s²+8s+K=0 stable for:",options:["K<0","0<K<8","0<K<40","K>40"],answer:2,diff:"hard",exp:"Routh: K>0 and (40-K)/5>0 → 0<K<40.",why:["K < 0 would make the s⁰ row negative.","0 < K < 8 is too restrictive.","","K > 40 would make the s¹ row negative."],src:"Original question bank · Control Systems"},
    {q:"s⁴+4s³+6s²+4s+K=0 stable for:",options:["K>0","0<K<4","0<K<8","0<K<5"],answer:3,diff:"hard",exp:"Routh array: s⁴ row = 1, 6, K; s³ row = 4, 4; s² row = 5, K; s¹ row = (20−4K)/5; s⁰ row = K. Every first-column entry must be positive, so K > 0 and K < 5. The keyed letter D is kept so your score still matches the exam.",why:["K > 0 is necessary but not sufficient.","0 < K < 4 is too restrictive.","0 < K < 8 is too permissive.",""],src:"Original question bank · Control Systems"}

  "Electrostatics": [
    {q:"Coulomb's law: if one charge doubles, force:",options:["Doubles","Halves","Unchanged","Becomes zero"],answer:0,diff:"easy",exp:"F ∝ Q₁Q₂. Doubling one charge doubles the force.",src:"Original question bank · Electrostatics"},
    {q:"Two identical charges at fixed distance. Force is:",options:["Attractive","Repulsive","Magnetic","Gravitational"],answer:1,diff:"easy",exp:"Like charges repel.",why:["Attractive force occurs between opposite charges.","","Magnetic force requires moving charges or currents.","Gravitational force is always attractive and negligible compared to electrostatic force."],src:"Original question bank · Electrostatics"},
    {q:"Coulomb's 2nd law: force between charges:",options:["Increases linearly with distance","Proportional to time","Independent of distance","Decreases with square of distance"],answer:3,diff:"easy",exp:"F ∝ 1/r². Inverse square law.",why:["Half would be the result if the force were inversely proportional to distance (not squared).","The force is not proportional to time.","The force depends on distance.",""],src:"Original question bank · Electrostatics"},
    {q:"Distance halved. Force becomes:",options:["Half","Double","Quadruple","Unchanged"],answer:2,diff:"easy",exp:"F ∝ 1/r². r→r/2 gives F→4F.",src:"Original question bank · Electrostatics"},
    {q:"Positive test charge near negative source. E field direction:",options:["Tangent to circular field","Perpendicular to radial line","Away from source","Towards source"],answer:3,diff:"easy",exp:"E field points toward negative charges.",why:["The field is radial, not tangent to a circular path.","The field is along the radial line, not perpendicular to it.","The field points away from a positive source charge, not a negative one.",""],src:"Original question bank · Electrostatics"},
    {q:"In vector form, force direction is determined by:",options:["Distance","Unit vector from one to another","Charge magnitudes","Sign of force"],answer:1,diff:"medium",exp:"F = kQ₁Q₂/r² × r̂. The unit vector determines direction.",why:["The distance determines the magnitude, not the direction.","","The charge magnitudes determine the magnitude, not the direction.","The sign of the force is a result, not a determinant of direction."],src:"Original question bank · Electrostatics"},
    {q:"Which does NOT affect force magnitude between 2 charges?",options:["Doubling both charges","Changing sign of one charge","Using different dielectric","All affect magnitude"],answer:1,diff:"medium",exp:"Changing sign affects direction only, not magnitude.",why:["Doubling both charges would quadruple the force magnitude.","","Using a different dielectric medium would change the force magnitude (F = kQ₁Q₂/(εr²)).","Not clear from OCR, but changing the sign is the correct answer."],src:"Original question bank · Electrostatics"},
    {q:"Q1=1nC, Q2=2nC. Which statement is INCORRECT?",options:["Q3=-3nC at midpoint experiences no net force","Force on Q1 is repulsive","Force on Q2 equals force on Q1","Force on Q1 is along line joining them"],answer:0,diff:"hard",exp:"Q3 at midpoint: forces from Q1 and Q2 are both attractive but Q2>Q1, so net force ≠ 0.",why:["","The force on Q1 is repulsive (both Q1 and Q2 are positive) — this is a correct statement.","The force on Q2 is the same in magnitude as that on Q1 (Newton's third law) — this is a correct statement.","The force on Q1 is along the line joining them — this is a correct statement."],src:"Original question bank · Electrostatics"},
    {q:"Equation relating D to ρv:",options:["ρv=-∇·D","ρv=∇·D","ρv=εD","ρv=∇×D"],answer:1,diff:"easy",exp:"Gauss's law: ∇·D = ρv.",why:["ρv = -∇·D has the wrong sign.","","ρv = εD is dimensionally incorrect and not a valid equation.","ρv = ∇×D uses the curl, not the divergence."],src:"Original question bank · Electrostatics"},
    {q:"D=4x ax nC/m² at x=2, surface 3×2 m, normal +ax. Flux is:",options:["24 nC","48 nC","36 nC","56 nC"],answer:1,diff:"medium",exp:"D=8 nC/m² at x=2. Φ=D·A=8×6=48 nC.",why:["24 nC would be the result if x = 1 or if the area were 3 m².","","36 nC does not correspond to the given values.","56 nC does not correspond to the given values."],src:"Original question bank · Electrostatics"},
    {q:"If ε increases while E is constant, D:",options:["Remains unchanged","Increases","Decreases","Becomes zero"],answer:1,diff:"easy",exp:"D=εE. Higher ε = higher D.",src:"Original question bank · Electrostatics"},
    {q:"V=5x+3y. E field is:",options:["-(5i+3j) V/m","5i+3j V/m","-3i-5j V/m","5i-3j V/m"],answer:0,diff:"easy",exp:"E=-∇V=-(5i+3j).",why:["","5i+3j is the gradient, not the negative gradient.","-3i-5j has the components swapped.","5i-3j has the wrong sign for the y-component."],src:"Original question bank · Electrostatics"},
    {q:"Charges 30nC, -20nC, 10nC inside cube. Total flux leaving:",options:["-20 nC","60 nC","20 nC","10 nC"],answer:2,diff:"medium",exp:"Qenclosed=30-20+10=20 nC. Flux=20 nC.",why:["","60 nC would be the sum of absolute values (30+20+10).","","10 nC is just the third charge."],src:"Original question bank · Electrostatics"},
    {q:"Positive charge moves in direction of E. Potential energy:",options:["Decreases","Increases","Remains constant","Becomes infinite"],answer:0,diff:"easy",exp:"Field does positive work, decreasing PE.",why:["","The potential energy increases when the charge moves against the field.","The potential energy changes when the charge moves in the field.","The potential energy does not become infinite."],src:"Original question bank · Electrostatics"},
    {q:"E=5ax. VAB for A(0,0,0) to B(4,0,0):",options:["-20 V","20 V","-5 V","5 V"],answer:0,diff:"medium",exp:"VAB=-E·d=-5×4=-20 V.",why:["","20 V has the wrong sign.","-5 V would be the result if the distance were 1 m.","5 V has the wrong sign and magnitude."],src:"Original question bank · Electrostatics"},
    {q:"Two opposite charges. Force is:",options:["Perpendicular to line joining","Repulsive","Attractive","No force"],answer:2,diff:"easy",exp:"Opposite charges attract.",src:"Original question bank · Electrostatics"},
    {q:"Positive point charge at origin. E field:",options:["Directed toward charge","Directed away from charge","Always parallel to x-axis","Same magnitude at all distances"],answer:1,diff:"easy",exp:"Positive charges produce outward radial fields.",why:["The field is directed toward a negative charge.","","The field is radial, not always upward.","The field has a specific direction (radially outward)."],src:"Original question bank · Electrostatics"},
    {q:"Distance from point charge doubled. D becomes:",options:["Twice as large","One-half","One-fourth","Unchanged"],answer:2,diff:"easy",exp:"D ∝ 1/r². Double r = quarter D.",why:["The negative sign does not indicate magnitude.","The charges being equal is not what the negative sign signifies.","","The force is not zero."],src:"Original question bank · Electrostatics"},
    {q:"In linear isotropic medium, D and E:",options:["Point in opposite directions","Are perpendicular","Point in same direction","D exists only in dielectrics"],answer:2,diff:"easy",exp:"D=εE, ε>0 scalar, so D and E are parallel.",src:"Original question bank · Electrostatics"},
    {q:"Displacement vector written opposite. Force direction still correct when:",options:["Charges are opposite in sign","Charges are identical and positive","Medium is free space","Displacement magnitude is large"],answer:0,diff:"hard",exp:"Two reversals (vector direction + opposite charges) cancel out.",why:["","If the charges are identical and positive, reversing the displacement vector would give the wrong direction.","The medium being free space does not affect the direction.","The magnitude of the displacement vector does not affect the direction."],src:"Original question bank · Electrostatics"}

  "Transistors": [
    {q:"Amplifier at IE=1.3 mA. re is:",options:["34 Ω","20 Ω","13 Ω","26 Ω"],answer:1,diff:"easy",exp:"re=VT/IE=26mV/1.3mA=20 Ω.",src:"Original question bank · Transistors"},
    {q:"DC alpha of BJT is always:",options:["Equal to beta","Greater than unity","Slightly less than unity","Zero in active region"],answer:2,diff:"easy",exp:"α=IC/IE<1 since IC=IE-IB.",why:["α = β/(1+β), not equal to β.","α can never exceed unity; I_C cannot exceed I_E.","","α is not zero in the active region — it is near unity. Zero α would mean no collector current."],src:"Original question bank · Transistors"},
    {q:"Beta=80. Alpha is:",options:["0.9756","0.9938","0.9877","1.0125"],answer:2,diff:"easy",exp:"α=β/(β+1)=80/81=0.9877.",src:"Original question bank · Transistors"},
    {q:"JFET IDSS=10mA, VP=-5V, VGS=-2V. gm is:",options:["1.6 mS","2.4 mS","4.0 mS","5.6 mS"],answer:1,diff:"medium",exp:"gm0=2IDSS/|VP|=4mS. gm=4(1-(-2)/(-5))=4(0.6)=2.4mS.",src:"Original question bank · Transistors"},
    {q:"Emitter follower between high-Z source and low-Z load:",options:["Inverts phase","Increases voltage gain","Raises output impedance","Prevents loading of source"],answer:3,diff:"easy",exp:"High input Z prevents loading; low output Z drives load.",why:["The emitter follower is non-inverting (0° phase shift), not inverting.","The voltage gain of an emitter follower is approximately 1 (slightly less), so it does not increase voltage gain.","The emitter follower *lowers* output impedance, not raises it.",""],src:"Original question bank · Transistors"},
    {q:"Conducts 360° and dissipates power at idle. Class:",options:["A","AB","B","C"],answer:0,diff:"easy",exp:"Class A conducts full cycle, always dissipating.",src:"Original question bank · Transistors"},
    {q:"Dynamic behavior of BJT amplifier uses:",options:["re and hybrid-π models","Ideal and practical diode models","Load-line and Q-point","Thevenin and Norton"],answer:0,diff:"medium",exp:"re and hybrid-π are small-signal AC models.",why:["","Diode models describe the BJT's DC junction behavior, not AC amplification.","Load-line and Q-point are DC analysis tools for biasing, not dynamic AC models.","Thevenin/Norton equivalents are general circuit simplification techniques, not BJT-specific dynamic models."],src:"Original question bank · Transistors"},
    {q:"Which class needs tuned LC tank at output?",options:["Class B","Class AB","Class C","Class A"],answer:2,diff:"medium",exp:"Class C conducts <180°, needs tank to reconstruct signal.",src:"Original question bank · Transistors"},
    {q:"Best JFET biasing for Q-point stability:",options:["Voltage-divider bias","Self bias","Source-feedback bias","Fixed gate bias"],answer:0,diff:"medium",exp:"Voltage-divider provides stiff bias with emitter degeneration.",src:"Original question bank · Transistors"},
    {q:"VCC=15V, R1=33k, R2=6.8k, RC=3.3k, RE=1k. VCE approx:",options:["5.0 V","8.9 V","7.0 V","9.0 V"],answer:2,diff:"hard",exp:"VTH=2.56V. IE=(2.56-0.7)/1k=1.86mA. VCE=15-1.86(4.3)=7.0V.",src:"Original question bank · Transistors"},
    {q:"Highest overall power gain configuration:",options:["All identical","Common-emitter","Common-collector","Common-base"],answer:1,diff:"easy",exp:"CE has both high voltage and current gain.",why:["The three configurations have very different power gains.","","",""],src:"Original question bank · Transistors"},
    {q:"VCC=12V, RB=470k, RC=2.2k, β=100. VCE is:",options:["6.71 V","11.98 V","5.29 V","6.38 V"],answer:0,diff:"hard",exp:"IB=(12-0.7)/470k=24μA. IC=2.4mA. VCE=12-2.4(2.2)=6.71V.",src:"Original question bank · Transistors"},
    {q:"JFET IDSS=12mA, VGS(off)=+4V, VGS=-1.5V. ID is:",options:["4.69 mA","3.00 mA","22.7 mA","7.50 mA"],answer:2,diff:"medium",exp:"ID=IDSS(1-VGS/VP)²=12(1+1.5/4)²=12(1.375)²=22.7mA.",src:"Original question bank · Transistors"},
    {q:"Most heavily doped BJT region:",options:["Substrate","Collector","Base","Emitter"],answer:3,diff:"easy",exp:"Emitter is heavily doped for high injection efficiency.",why:["The substrate is not one of the three active regions of a BJT.","","",""],src:"Original question bank · Transistors"},
    {q:"Base resistor to collector instead of VCC establishes:",options:["Negative voltage feedback","Dual-supply bias","Open-loop bias","Positive current feedback"],answer:0,diff:"medium",exp:"Collector feedback creates negative feedback for Q-point stability.",why:["","No dual supply is involved; this is a single-supply circuit.","There IS a feedback path — through R_B from collector to base.","The feedback is negative (stabilizing), not positive (which would be regenerative/destabilizing)."],src:"Original question bank · Transistors"},
    {q:"IC=4.5mA, IB=30μA. Beta is:",options:["165","135","151","150"],answer:3,diff:"easy",exp:"β=IC/IB=4500/30=150.",src:"Original question bank · Transistors"},
    {q:"E-MOSFET VTh=2V, k=0.5mA/V², VGS=6V. ID is:",options:["18 mA","8 mA","2 mA","16 mA"],answer:1,diff:"medium",exp:"ID=k(VGS-VTh)²=0.5(4)²=8mA.",src:"Original question bank · Transistors"},
    {q:"CE amp RC=3.9k, IE=2mA, bypassed. |Av| is:",options:["300","150","200","390"],answer:0,diff:"medium",exp:"re=26/2=13Ω. Av=RC/re=3900/13=300.",src:"Original question bank · Transistors"},
    {q:"Common-base preferred for RF because it:",options:["Highest current gain","Inverts 180°","Minimizes Miller effect","High input impedance"],answer:2,diff:"medium",exp:"CB eliminates Miller effect, ideal for high frequencies.",why:["Common-base has current gain ≈ α < 1 (less than unity), not the highest.","Common-base is non-inverting (0° phase shift), not 180°.","","Common-base has very *low* input impedance (≈ r_e), not high."],src:"Original question bank · Transistors"},
    {q:"Device operating in both depletion and enhancement modes:",options:["E-MOSFET","n-JFET","p-JFET","D-MOSFET"],answer:3,diff:"medium",exp:"D-MOSFET can operate with VGS of either polarity.",src:"Original question bank · Transistors"},
    {q:"Voltage-divider bias makes Q-point:",options:["Independent of VCC","Essentially independent of beta","Strongly dependent on beta","Tied to breakdown"],answer:1,diff:"easy",exp:"Stiff divider + emitter feedback makes Q-point β-independent.",why:["The Q-point still depends on V_CC (through the divider), just not on β.","","This is the opposite — voltage-divider bias specifically avoids β dependence.","The Q-point is set by the bias network, not tied to breakdown voltage."],src:"Original question bank · Transistors"},
    {q:"CE amp RC=4.7k, RE=470, IE=2.6mA, bypass removed. |Av|:",options:["490","470","10.0","9.79"],answer:3,diff:"hard",exp:"re=10Ω. Av=RC/(re+RE)=4700/480=9.79.",src:"Original question bank · Transistors"},
    {q:"MOSFET gate is:",options:["Reverse-biased pn junction","Separated by SiO2 layer","Tied to source","Heavily doped n-type"],answer:1,diff:"easy",exp:"MOSFET gate is insulated by silicon dioxide.",why:["This describes a JFET, not a MOSFET.","","The gate is never tied directly to the source in a MOSFET.","The gate is typically made of metal or heavily doped polysilicon, not specifically n-type material."],src:"Original question bank · Transistors"},
    {q:"Which biasing requires dual-polarity supply?",options:["Collector-feedback","Voltage-divider","Emitter bias","Base bias"],answer:2,diff:"medium",exp:"Emitter bias uses -VEE for improved stability.",src:"Original question bank · Transistors"},
    {q:"BJT fully on, no more IC despite more base drive:",options:["Active region","Cutoff","Breakdown","Saturation"],answer:3,diff:"easy",exp:"Saturation: both junctions forward biased, IC maxed.",src:"Original question bank · Transistors"}

    {q:"Four terminals sharing one link:",options:["Point-to-point","Multipoint","Full-duplex","Peer-to-peer"],answer:1,diff:"easy",exp:"Multipoint = multiple stations on shared link.",src:"Original question bank · Data Communications"},
    {q:"Two radios, one must stop before other replies:",options:["Simplex","Half-duplex","Full-duplex","Parallel"],answer:1,diff:"easy",exp:"Half-duplex = both can transmit but not simultaneously.",src:"Original question bank · Data Communications"},
    {q:"One computer serves others in a school network:",options:["Peer-to-peer","Client/server","Multipoint","Bus"],answer:1,diff:"easy",exp:"Client/server model: dedicated server provides services.",src:"Original question bank · Data Communications"},

  "Diodes & Power Supplies": [
    {q:"The resistance of a pure silicon sample falls as its temperature rises. This behavior is described as a:",options:["Positive temperature coefficient","Zero temperature coefficient","Negative temperature coefficient","Unity temperature coefficient"],answer:2,diff:"medium",exp:"In intrinsic silicon, heating generates more electron-hole pairs, so the carrier concentration rises and resistivity falls. A resistance that drops with temperature has a negative temperature coefficient.",why:["A positive temperature coefficient means resistance rises with temperature — true of metals, not semiconductors.","Zero coefficient would mean temperature has no effect, which is not the case for silicon.","","There is no such standard classification as a unity temperature coefficient."],src:"Exam compilation · Electronic Devices & Circuits 1 (Diodes) · Q2"},
    {q:"Load regulation indicates how well a supply holds its output voltage constant against changes in the:",options:["Input line voltage","Current drawn by the load","Ripple frequency","Ambient temperature"],answer:1,diff:"medium",exp:"Load regulation measures the change in output voltage as the load current varies from no-load to full-load, expressed as a percentage.",why:["Change in input line voltage is line regulation, a separate specification.","","Ripple frequency describes the residual AC on the DC output, not voltage stability against load.","Ambient temperature describes thermal drift, which is a different parameter entirely."],src:"Exam compilation · Electronic Devices & Circuits 1 (Diodes) · Q16"},
    {q:"Immobile outermost electrons that form covalent bonds and determine a material's electrical properties are called:",options:["Valence electrons","Free electrons","Conduction electrons","Minority carriers"],answer:0,diff:"easy",exp:"The deck defines valence electrons as the immobile outermost electrons in the valence band that form covalent bonds and set the material's electrical properties.",why:["","Free electrons are the mobile ones that have broken free into the conduction band.","Conduction electron is another name for a free electron, not the bound valence electron.","Minority carriers are holes in n-type or electrons in p-type material, a doping concept."],src:"Week 2 · Diodes · Semiconductor Basics"},
    {q:"Mobile electrons that have broken free into the conduction band and carry electric current are known as:",options:["Free electrons","Valence electrons","Covalent electrons","Bound electrons"],answer:0,diff:"easy",exp:"The deck defines free electrons (also called conduction electrons) as mobile electrons in the conduction band that have broken free to carry current.",why:["","Valence electrons are immobile and bound in covalent bonds.","There is no standard term covalent electrons in this context.","Bound electrons cannot contribute to conduction."],src:"Week 2 · Diodes · Semiconductor Basics"},
    {q:"Which material has no forbidden band gap, so no external energy is needed to free electrons?",options:["A conductor","An insulator","An intrinsic semiconductor","An extrinsic semiconductor"],answer:0,diff:"easy",exp:"The deck states a conductor has no band gap and needs no external energy to free electrons, giving high conductivity and low resistance.",why:["","An insulator has a large band gap requiring high energy to reach the conduction band.","A semiconductor has a moderate band gap, not zero.","Extrinsic doping changes carrier concentration, not the existence of a gap."],src:"Week 2 · Diodes · Energy Bands"},
    {q:"Glass, mica, rubber and diamond are given in the deck as examples of:",options:["Insulators","Conductors","Intrinsic semiconductors","Pentavalent materials"],answer:0,diff:"easy",exp:"The deck lists glass, mica, rubber and diamond as insulators: large band gap, high energy needed to free electrons, low conductivity and high resistance.",why:["","Conductors are listed as Cu, Al, Ag and Au.","Intrinsic semiconductors are Si and Ge.","Pentavalent materials are doping impurities such as phosphorus, not insulators."],src:"Week 2 · Diodes · Energy Bands"},
    {q:"Which statement about a semiconductor's conductivity is correct?",options:["Conductivity increases with temperature, giving a negative temperature coefficient","Conductivity decreases with temperature, giving a positive temperature coefficient","Conductivity is independent of temperature","Conductivity increases only when the material is doped"],answer:0,diff:"easy",exp:"The deck states semiconductor conductivity increases with temperature, which is described as a negative temperature coefficient.",why:["","That describes a metal conductor, not a semiconductor.","Thermal generation of carriers always changes semiconductor conductivity.","Intrinsic semiconductors also show temperature-dependent conductivity."],src:"Week 2 · Diodes · Semiconductor Basics"},
    {q:"Adding pentavalent impurities such as phosphorus, antimony, arsenic or bismuth to silicon produces:",options:["An n-type semiconductor with electrons as majority carriers","A p-type semiconductor with holes as majority carriers","An intrinsic semiconductor","An insulator"],answer:0,diff:"easy",exp:"The deck states that pentavalent impurities added to silicon give n-type material whose majority carriers are electrons and minority carriers are holes.",why:["","P-type material comes from trivalent impurities and has holes as majority carriers.","An intrinsic semiconductor is pure, with no added impurities.","Doping increases conductivity; it does not create an insulator."],src:"Week 2 · Diodes · N-Type Semiconductor"},
    {q:"In an n-type semiconductor, the minority carriers are:",options:["Holes","Electrons","Pentavalent ions","Free protons"],answer:0,diff:"easy",exp:"The deck lists electrons as the majority carriers and holes as the minority carriers in n-type material.",why:["","Electrons are the majority carriers in n-type material.","Pentavalent ions are fixed in the lattice and do not carry current.","Protons are not charge carriers in a semiconductor."],src:"Week 2 · Diodes · N-Type Semiconductor"},
    {q:"A diode is best described as:",options:["An active semiconductor device with a single pn junction that conducts in only one direction","A passive two-terminal resistor","A device with two pn junctions in series","An insulator with a controlled gap"],answer:0,diff:"easy",exp:"The deck defines a diode as an active semiconductor device with a single pn junction that conducts current in only one direction.",why:["","A resistor conducts equally in both directions and is passive.","Two junctions in series describes a transistor structure, not a diode.","A diode conducts readily under forward bias, so it is not an insulator."],src:"Week 2 · Diodes · Diode"},
    {q:"The boundary formed when a p-type and an n-type semiconductor are joined is called the:",options:["PN junction","Depletion contact only","Covalent boundary","Valence band edge"],answer:0,diff:"easy",exp:"The deck defines the PN junction as the boundary formed when p-type and n-type semiconductors are joined.",why:["","The depletion region forms at the junction but is a consequence of it, not its name.","A covalent boundary is not a term used for the p-n interface.","The valence band edge is an energy-band concept, unrelated to the junction."],src:"Week 2 · Diodes · The PN Junction"},
    {q:"In the context of electronic devices, the term bias refers to:",options:["Using a dc voltage to establish a certain operating condition for the device","The reverse saturation current of a junction","The doping concentration of the material","The thermal noise generated in the device"],answer:0,diff:"easy",exp:"The deck defines bias as the use of a dc voltage to establish a certain operating condition for an electronic device.",why:["","Reverse saturation current is a device parameter, not the definition of bias.","Doping concentration is a material property set during fabrication.","Thermal noise is an unwanted signal, unrelated to biasing."],src:"Week 2 · Diodes · Diode Biasing"},
    {q:"A semiconductor whose conductivity lies between that of a conductor and an insulator, with a moderate band gap, is:",options:["A semiconductor such as silicon or germanium","A conductor such as copper or aluminium","An insulator such as mica or rubber","A material with no band gap at all"],answer:0,diff:"easy",exp:"The deck defines a semiconductor as having conductivity between a conductor and an insulator, a moderate band gap, and lists Si and Ge as examples.",why:["","Conductors have no band gap and high conductivity.","Insulators have a large band gap and low conductivity.","No band gap describes a conductor."],src:"Week 2 · Diodes · Energy Bands"},
    {q:"A pure semiconductor material with no added impurities is classified as:",options:["Intrinsic","Extrinsic","Pentavalent","Trivalent"],answer:0,diff:"easy",exp:"The deck classifies a pure material as an intrinsic semiconductor, in contrast to an extrinsic one where impurities are added.",why:["","Extrinsic material has had impurities deliberately added.","Pentavalent describes the type of impurity, not the purity of the material.","Trivalent likewise describes an impurity type."],src:"Week 2 · Diodes · Semiconductor Basics"},
    {q:"Which of the following is a trivalent impurity used to form p-type semiconductor material?",options:["Boron","Phosphorus","Antimony","Arsenic"],answer:0,diff:"medium",exp:"P-type material is formed by adding trivalent (Group III) impurities such as boron, which have three valence electrons and leave a hole.",why:["","Phosphorus is pentavalent and produces n-type material.","Antimony is pentavalent and produces n-type material.","Arsenic is pentavalent and produces n-type material."],src:"Week 2 · Diodes · P-Type Semiconductor"},
    {q:"The current that flows across the barrier of a reverse-biased diode is called:",options:["Reverse saturation current","Forward current","Zener current","Displacement current"],answer:0,diff:"easy",exp:"A small current still crosses a reverse-biased junction, carried by thermally generated minority carriers; it is the reverse saturation current.",why:["","Forward current flows under forward bias, when the barrier is lowered.","Zener current is the large breakdown current in a Zener regulator, a distinct operating mode.","Displacement current is a field concept, not the junction leakage current."],src:"Week 2 · Diodes · Diode Biasing"},
    {q:"In the practical diode model, a silicon diode is represented as:",options:["A 0.7 V battery in series with an ideal switch and a resistor","A perfect switch with no voltage drop","An open circuit in both directions","A resistor of fixed value"],answer:0,diff:"medium",exp:"The practical model adds the 0.7 V barrier potential of a silicon diode in series with the ideal-switch representation, with the bulk resistance optionally included.",why:["","A perfect switch with no drop is the ideal model, which ignores the barrier potential.","A diode conducts under forward bias, so it is not an open circuit in both directions.","A fixed resistor does not capture the one-way conduction of a diode."],src:"Week 2 · Diodes · Diode"},
    {q:"The varactor diode is designed to operate using:",options:["The inherent capacitance of the depletion region","Negative resistance from quantum tunnelling","Photons absorbed at the junction","Thermal generation of carrier pairs"],answer:0,diff:"medium",exp:"The varactor is a voltage-variable capacitor: it is doped to exploit the inherent capacitance of the depletion region, which varies with reverse voltage.",why:["","Negative resistance from tunnelling describes the tunnel diode.","Photon absorption describes the photodiode.","Thermal generation describes ordinary leakage, not a designed function."],src:"Week 2 · Diodes · Special Purpose Diodes"},
    {q:"The tunnel diode is useful in oscillator and microwave amplifier applications because it exhibits:",options:["Negative resistance","A very large band gap","Zero junction capacitance","Unidirectional light emission"],answer:0,diff:"medium",exp:"The deck states the tunnel diode exhibits negative resistance, which makes it useful in oscillator and microwave amplifier applications.",why:["","Band gap is a material property, not the operating principle of the tunnel diode.","A tunnel diode is heavily doped, giving a very thin barrier and notable capacitance.","Light emission describes an LED, not a tunnel diode."],src:"Week 2 · Diodes · Tunnel Diode"},
    {q:"The PIN diode consists of:",options:["Heavily doped P and N regions separated by an intrinsic region","Two pn junctions back to back","A metal-semiconductor junction only","A single lightly doped p region"],answer:0,diff:"medium",exp:"The deck defines the PIN diode as heavily doped P and N regions separated by an intrinsic (I) region.",why:["","Back-to-back junctions describe a different structure such as a diac, not a PIN.","A metal-semiconductor junction describes a Schottky diode.","A single p region describes no diode junction at all."],src:"Week 2 · Diodes · PIN Diode"},
    {q:"A photodiode is normally operated:",options:["In reverse bias","In forward bias above the knee","With no applied bias at all","In breakdown"],answer:0,diff:"easy",exp:"The deck states the photodiode operates in reverse bias: when the junction is exposed to light, the reverse current increases with light intensity.",why:["","Forward bias would swamp the light-generated current with the large forward current.","Without bias the depletion region is narrow and response is poor.","Breakdown operation describes an avalanche photodiode run at high gain, not normal operation."],src:"Week 2 · Diodes · Photodiode"},
    {q:"When the light intensity falling on a photodiode increases, the reverse minority carrier current:",options:["Increases","Decreases","Remains unchanged","Reverses direction"],answer:0,diff:"easy",exp:"More light generates more electron-hole pairs, so the reverse current carried by minority carriers rises with light intensity.",why:["","Decreasing would mean light suppresses carrier generation, which is backwards.","The current is strongly light-dependent, so it cannot be constant.","The diode remains reverse biased; the current magnitude changes, not its direction."],src:"Week 2 · Diodes · Photodiode"},
    {q:"An LED emits photons when, under forward bias:",options:["Electrons from the N-type material recombine with holes in the P-type material","Holes from the N-type material recombine with electrons in the P-type material","The depletion region breaks down","Thermal energy frees carriers from the lattice"],answer:0,diff:"medium",exp:"The deck describes the LED as forward-biased, with electrons crossing the junction from N-type material and recombining with holes in the P-type material, releasing energy as photons.",why:["","The N-type material has electrons as majority carriers, not holes.","Breakdown is a reverse-bias phenomenon and does not produce the designed light output.","Thermal generation produces heat, not the directed photon emission of an LED."],src:"Week 2 · Diodes · Light-Emitting Diode"},
    {q:"A diode circuit that clips off part of a waveform above and/or below a specified level is a:",options:["Clipper","Clamper","Rectifier","Regulator"],answer:0,diff:"easy",exp:"The deck defines a clipper as a diode circuit that clips off or removes part of a waveform above and/or below a specified level.",why:["","A clamper shifts the waveform's dc level without removing part of it.","A rectifier converts ac to pulsating dc.","A regulator holds an output voltage constant."],src:"Week 2 · Diodes · Diode Applications"},
