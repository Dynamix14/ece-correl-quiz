<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECE Correl Quiz Trainer</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --fg: #c9d1d9;
  --accent: #58a6ff;
  --accent2: #7ee787;
  --danger: #f85149;
  --warn: #d29922;
  --muted: #8b949e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 8px; color: var(--accent); font-size: 1.8em; }
.subtitle { text-align: center; color: var(--muted); margin-bottom: 24px; }
.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.topic-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  color: var(--fg);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  font-size: 0.95em;
}
.topic-btn:hover { border-color: var(--accent); background: #1c2128; }
.topic-btn.active { border-color: var(--accent); background: #1c2128; box-shadow: 0 0 0 1px var(--accent); }
.topic-btn .count { color: var(--muted); font-size: 0.85em; margin-top: 4px; }
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.controls label { color: var(--muted); font-size: 0.9em; }
.controls select, .controls input {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg);
  padding: 6px 10px;
  font-size: 0.9em;
}
.btn {
  background: var(--accent);
  color: #0d1117;
  border: none;
  border-radius: 6px;
  padding: 10px 20px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
.btn.danger { background: var(--danger); color: #fff; }
.quiz-area { display: none; }
.quiz-area.active { display: block; }
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--card);
  border-radius: 3px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s;
}
.question-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
}
.tos-badge {
  display: inline-block;
  background: rgba(88, 166, 255, 0.15);
  color: var(--accent);
  border: 1px solid rgba(88, 166, 255, 0.35);
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 0.82em;
  font-weight: 600;
  margin-bottom: 10px;
  letter-spacing: 0.3px;
}
.question-num { color: var(--muted); font-size: 0.85em; margin-bottom: 8px; }
.question-text { font-size: 1.15em; margin-bottom: 20px; line-height: 1.5; }
.qfig { display: block; max-width: 100%; width: 450px; height: auto;
  margin: 14px 0 4px; border-radius: 8px; background: #fff; padding: 6px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  color: var(--fg);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  font-size: 1em;
  line-height: 1.4;
}
.option-btn:hover { border-color: var(--accent); background: #1c2128; }
.option-btn.correct { border-color: var(--accent2); background: rgba(126,231,135,0.1); }
.option-btn.wrong { border-color: var(--danger); background: rgba(248,81,73,0.1); }
.option-btn.disabled { cursor: default; opacity: 0.7; }
.explanation {
  display: none;
  background: rgba(88,166,255,0.08);
  border: 1px solid rgba(88,166,255,0.3);
  border-radius: 8px;
  padding: 16px;
  margin-top: 16px;
  line-height: 1.6;
}
.explanation.show { display: block; }
.explanation h4 { color: var(--accent); margin-bottom: 8px; }
.explanation .why-wrong { color: var(--danger); margin-top: 8px; }
.explanation .why-right { color: var(--accent2); margin-top: 8px; }
.explanation .opt-review { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
.explanation .opt-review .hdr { color: var(--muted); font-size: 0.85em; margin-bottom: 8px; }
.explanation .opt-row { display: flex; gap: 10px; padding: 7px 10px; border-radius: 6px;
  margin-bottom: 5px; font-size: 0.9em; line-height: 1.45; border: 1px solid transparent; }
.explanation .opt-row.picked { background: rgba(248,81,73,0.12); border-color: rgba(248,81,73,0.4); }
.explanation .opt-row.right { background: rgba(126,231,135,0.12); border-color: rgba(126,231,135,0.4); }
.explanation .opt-row.other { background: rgba(139,148,158,0.06); }
.explanation .opt-key { font-weight: 700; min-width: 16px; }
.explanation .opt-row.picked .opt-key { color: var(--danger); }
.explanation .opt-row.right .opt-key { color: var(--accent2); }
.source-line { color: var(--muted); font-size: 0.8em; margin-top: 10px; font-style: italic; }
.quiz-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 16px;
}
.score-display {
  text-align: center;
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 16px;
}
.score-display h2 { color: var(--accent); margin-bottom: 8px; }
.score-display .big { font-size: 3em; font-weight: 700; }
.stats { display: flex; gap: 20px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.stat-item { text-align: center; }
.stat-item .val { font-size: 1.5em; font-weight: 600; }
.stat-item .lbl { color: var(--muted); font-size: 0.85em; }
.review-area { margin-top: 20px; }
.review-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 10px;
}
.review-item.correct { border-left: 3px solid var(--accent2); }
.review-item.wrong { border-left: 3px solid var(--danger); }
.review-item .q { font-weight: 600; margin-bottom: 6px; }
.review-item .a { color: var(--accent2); font-size: 0.9em; }
.review-item .e { color: var(--muted); font-size: 0.85em; margin-top: 6px; }
.mode-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.mode-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 16px;
  color: var(--fg);
  cursor: pointer;
  font-size: 0.9em;
}
.mode-btn.active { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <h1>ECE Correl Quiz Trainer</h1>
  <p class="subtitle">Master all topics from your ECE Correlation exams</p>

  <div class="mode-toggle">
      <button class="mode-btn active" onclick="setMode('topic', this)">By Topic</button>
      <button class="mode-btn" onclick="setMode('trial', this)">Trial Exam (All)</button>
      <button class="mode-btn" onclick="setMode('elecs', this)">ELECS Trial</button>
      <button class="mode-btn" onclick="setMode('est', this)">EST Trial</button>
      <button class="mode-btn" onclick="setMode('weak', this)">Weak Areas</button>
    </div>

  <div id="topicView">
    <div class="topic-grid" id="topicGrid"></div>
    <div class="controls">
      <label>Questions per quiz:</label>
      <select id="qCount">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100" selected>100</option>
      </select>
      <label>Difficulty:</label>
      <select id="difficulty">
        <option value="all">All</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button class="btn" onclick="startQuiz()">Start Quiz</button>
      <button class="btn secondary" onclick="resetHistory()">Reset History</button>
    </div>
  </div>

  <div class="quiz-area" id="quizArea">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-card" id="questionCard"></div>
    <div class="quiz-nav">
      <button class="btn secondary" onclick="quitQuiz()">Quit</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none">Next</button>
    </div>
  </div>

  <div class="quiz-area" id="resultArea">
    <div class="score-display">
      <h2>Quiz Complete!</h2>
      <div class="big" id="scoreBig"></div>
      <div class="stats" id="scoreStats"></div>
    </div>
    <div class="review-area" id="reviewArea"></div>
    <div class="quiz-nav">
      <button class="btn secondary" onclick="backToTopics()">Back to Topics</button>
      <button class="btn" onclick="startQuiz()">New Quiz</button>
    </div>
  </div>
</div>

<script>
// Question Bank - Large pool to avoid repetition
const QUESTION_BANK = {
  "Diodes & Power Supplies": [
    {q:"Forward-biasing a pn junction causes the depletion region to become:",options:["Wider, but only in germanium devices","Narrower, lowering the barrier for majority carriers","Fixed in width, since doping alone determines it","Wider, raising the barrier for majority carriers"],answer:1,diff:"easy",exp:"Forward bias opposes the built-in potential barrier, reducing the depletion region width and lowering the barrier for majority carriers to diffuse across.",why:["Forward bias narrows the depletion region in all semiconductor materials, not just germanium. The effect is universal.","","The depletion region width is determined by both doping concentrations AND the applied bias voltage. Forward bias reduces it; reverse bias increases it.","This describes the effect of *reverse* bias, not forward bias. Reverse bias widens the depletion region and raises the barrier."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"The resistance of a pure silicon sample falls as its temperature rises. This is described as:",options:["Positive temperature coefficient","Zero temperature coefficient","Negative temperature coefficient","Unity temperature coefficient"],answer:2,diff:"easy",exp:"In intrinsic silicon, more electron-hole pairs are generated as temperature rises, decreasing resistivity. This is a negative temperature coefficient.",why:["A positive temperature coefficient means resistance *increases* with temperature (typical of metals, not semiconductors).","A zero temperature coefficient means resistance does not change with temperature (e.g., constantan, manganin alloys).","","\"Unity temperature coefficient\" is not a standard term for this behavior and does not describe the negative relationship."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"A full-wave rectifier delivers a peak output of 30 V. The average (DC) value is:",options:["19.1 V","21.2 V","15.0 V","9.55 V"],answer:0,diff:"medium",exp:"Vdc = 2Vp/π = 2(30)/π = 19.1 V. This comes from averaging the absolute value of a sinusoidal waveform over a full period.",why:["","21.2 V would correspond to V_dc = 0.707 × V_p, which is the RMS value of a sine wave, not the average of a full-wave rectified signal.","15.0 V is simply V_p/2, which has no physical basis for full-wave rectification.","9.55 V is V_p/π, which is the average for a *half-wave* rectifier, not full-wave."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"A power supply measures 24 V no-load and 22.5 V full-load. Percent load regulation is:",options:["6.25%","6.67%","1.50%","93.75%"],answer:1,diff:"medium",exp:"%LR = (VNL - VFL)/VFL × 100 = (24-22.5)/22.5 × 100 = 6.67%. The standard definition uses full-load voltage in the denominator.",why:["6.25% would result from dividing by the no-load voltage (24 V) instead of the full-load voltage: (1.5/24) × 100 = 6.25%. The standard definition uses full-load voltage in the denominator.","","1.50% is simply the voltage difference (1.5 V) expressed as a percentage without proper normalization.","93.75% is the voltage regulation ratio expressed as V_FL/V_NL × 100%, which is not the standard load regulation formula."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"Which correctly compares forbidden band gaps?",options:["Semiconductor gap is narrower than insulator gap","Conductors have the widest gap","Semiconductors and insulators have no gap","All three have the same gap"],answer:0,diff:"easy",exp:"Conductors ≈ 0 eV, semiconductors ≈ 0.1-2 eV, insulators > 5 eV. The semiconductor gap is always narrower than the insulator gap.",why:["","Conductors have the *narrowest* (or zero) band gap, not the widest. Their valence and conduction bands overlap.","Semiconductors and insulators both have band gaps; only conductors have no gap (or overlapping bands).","The three materials have distinctly different band gap widths at room temperature; this is precisely what distinguishes them electrically."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"For a silicon diode, reverse saturation current roughly doubles for every temperature rise of:",options:["2°C","50°C","25°C","10°C"],answer:3,diff:"medium",exp:"A well-established rule of thumb: Is doubles for every 10°C rise in temperature for silicon diodes.",why:["2°C is too small; the doubling interval is much larger.","50°C is far too large; the current would increase by a factor of 2^5 = 32 over that range, not double.","25°C is also too large; the current would increase by a factor of 2^2.5 ≈ 5.7 over that range.",""],src:"Original question bank · Diodes & Power Supplies"},
    {q:"In the diode forward current equation, the ideality factor n for silicon is:",options:["2","0.5","1.5","1"],answer:3,diff:"medium",exp:"For silicon diodes operating in moderate forward bias (diffusion current dominates), n = 1 is the standard value.",src:"Original question bank · Diodes & Power Supplies"},
    {q:"For the same transformer secondary voltage, a bridge rectifier delivers a peak output that is:",options:["Equal to center-tapped","One-fourth of center-tapped","Half of center-tapped","Twice that of center-tapped"],answer:3,diff:"hard",exp:"Bridge uses the full secondary winding (Vp = Vs√2), while center-tapped uses half (Vp = Vs√2/2). Bridge delivers twice the peak output.",why:["They are not equal; the bridge uses the full winding while the center-tapped uses half.","One-fourth is incorrect; the ratio is 2:1, not 4:1.","Half is the inverse of the correct relationship; the bridge delivers *more*, not less.",""],src:"Original question bank · Diodes & Power Supplies"},
    {q:"An impurity added to intrinsic silicon to produce n-type material must have how many valence electrons?",options:["Three","Five","Four","Six"],answer:1,diff:"easy",exp:"Pentavalent (Group V) impurities like phosphorus have 5 valence electrons. Four form covalent bonds, the fifth becomes a free electron.",why:["Three valence electrons (trivalent, e.g., boron) produce p-type material by creating holes.","","Four valence electrons (tetravalent, e.g., silicon itself) would not change the intrinsic carrier concentration.","Six valence electrons are not used for doping silicon; they would not fit the crystal lattice properly."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"A Zener diode performing voltage regulation must be operated:",options:["Reverse-biased in breakdown region","Forward-biased above knee voltage","Reverse-biased below breakdown","Without any external bias"],answer:0,diff:"easy",exp:"Zener regulates by operating in the reverse-bias breakdown region where voltage remains nearly constant over a wide current range.",why:["","Forward-biased operation is the normal diode conduction mode; it does not provide regulation at V_Z.","Reverse-biased below breakdown, the Zener acts as an open circuit with only tiny leakage current; no regulation occurs.","Without external bias, there is no current flow and no regulation."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"A silicon diode conducts 4 mA at 0.7 V forward drop. Its static and dynamic resistances are:",options:["350 Ω and 6.5 Ω","6.5 Ω and 175 Ω","175 Ω and 6.5 Ω","175 Ω and 13 Ω"],answer:2,diff:"hard",exp:"Static: R = V/I = 0.7/0.004 = 175 Ω. Dynamic: rd = nVT/ID = 0.026/0.004 = 6.5 Ω.",why:["350 Ω and 6.5 Ω — 350 Ω would be V_D/I_D with I_D = 2 mA, not 4 mA.","6.5 Ω and 175 Ω — This reverses the static and dynamic values.","","175 Ω and 13 Ω — 13 Ω would be nV_T/I_D with V_T = 52 mV (using n=2), which is not standard for silicon."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"Negative resistance characterizes the:",options:["Tunnel diode","Varactor diode","Schottky diode","PIN diode"],answer:0,diff:"medium",exp:"The tunnel diode exhibits negative resistance due to quantum tunneling, making it suitable for oscillators and microwave amplifiers.",why:["","Varactor diodes exhibit voltage-variable capacitance, not negative resistance.","Schottky diodes have low forward voltage drop and fast switching but no negative resistance region.","PIN diodes have a wide intrinsic region making them good RF switches and attenuators, but they do not exhibit negative resistance."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"Load regulation indicates how well a supply holds output voltage constant against changes in:",options:["Input line voltage","Current drawn by the load","Ripple frequency","Ambient temperature"],answer:1,diff:"easy",exp:"Load regulation measures voltage stability when load current changes from no-load to full-load.",why:["Input line voltage changes are measured by *line* regulation, not load regulation.","","Ripple frequency is a characteristic of the rectifier/filter, not a parameter that load regulation measures against.","Ambient temperature effects are measured by temperature coefficient or drift specifications, not load regulation."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"Which diode is selected for high-current, fast-switching, high-frequency service?",options:["Tunnel diode","Photodiode","Zener diode","Schottky diode"],answer:3,diff:"medium",exp:"Schottky diodes have no minority carrier storage time, giving very fast switching and high-frequency capability.",why:["Tunnel diodes are used for microwave oscillation and amplification due to negative resistance, not for high-current switching.","Photodiodes are used for light detection, not for high-current switching.","Zener diodes are used for voltage regulation, not for high-frequency switching.",""],src:"Original question bank · Diodes & Power Supplies"},
    {q:"Cascaded diode-capacitor stages in a voltage multiplier are intended for loads requiring:",options:["High voltage at low current","Low voltage at high current","Low voltage at low current","High voltage at high current"],answer:0,diff:"medium",exp:"Voltage multipliers produce high DC voltages but can only supply low current due to high output impedance.",why:["","Low voltage at high current is the domain of transformer-rectifier-filter supplies, not multipliers.","Low voltage at low current is not the purpose of a multiplier; a simple rectifier would suffice.","High voltage at high current is not achievable with diode-capacitor multipliers due to their high internal impedance."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"A diode-capacitor circuit that adds a DC level to an AC waveform is a:",options:["Regulator","Clipper","Rectifier","Clamper"],answer:3,diff:"easy",exp:"A clamper (DC restorer) shifts the entire waveform up or down by a DC level without changing its shape.",why:["A regulator maintains a constant output voltage regardless of input or load changes.","A clipper (limiter) removes portions of the waveform above or below a reference level, altering the waveform shape.","A rectifier converts AC to pulsating DC; it does not simply add a DC level to an AC waveform.",""],src:"Original question bank · Diodes & Power Supplies"},
    {q:"A silicon diode shows 20 nA reverse leakage at 25°C. At 65°C, it becomes approximately:",options:["640 nA","160 nA","320 nA","50 nA"],answer:2,diff:"hard",exp:"Leakage doubles every 10°C. Rise = 40°C = 4 doublings. 20 × 2^4 = 20 × 16 = 320 nA.",why:["640 nA would require 5 doublings (50°C rise), not 4.","160 nA would require only 3 doublings (30°C rise).","","50 nA is less than the original 20 nA, which is impossible since leakage increases with temperature."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"A silicon diode in series with 3.3 kΩ across 12 V DC (forward). Using practical model, current is:",options:["3.21 mA","3.5 mA","3.42 mA","3.64 mA"],answer:2,diff:"medium",exp:"I = (V - VD)/R = (12 - 0.7)/3300 = 11.3/3300 = 3.42 mA.",why:["3.21 mA would result from using V_D = 1.3 V or a different resistance value.","3.5 mA would result from using V_D = 0.55 V (germanium) instead of silicon.","","3.64 mA would result from using the ideal model (V_D = 0): I = 12/3300 = 3.64 mA."],src:"Original question bank · Diodes & Power Supplies"},
    {q:"The ideality factor n = 2 in the diode equation is used when:",options:["Diffusion current dominates","Recombination current dominates","In reverse bias","At very high forward bias"],answer:1,diff:"hard",exp:"n = 2 is used at very low currents where recombination current dominates in the depletion region.",src:"Original question bank · Diodes & Power Supplies"},
    {q:"The ripple voltage in a full-wave filtered supply is calculated using:",options:["Vr = I/(2fC)","Vr = I/(fC)","Vr = 2I/(fC)","Vr = I/(4fC)"],answer:0,diff:"hard",exp:"For full-wave rectification, ripple frequency = 2× line frequency. Vr = I/(2fC) where f is the line frequency.",why:["This is the formula for a half-wave rectifier, where the ripple frequency equals the line frequency. Full-wave rectification doubles the ripple frequency.","This would apply to a half-wave rectifier. In full-wave rectification, the ripple frequency is 2f, so the denominator becomes 2fC.","This overestimates the ripple by a factor of 2. The correct formula uses 2fC in the denominator because full-wave rectification produces twice as many ripple cycles per second.",""],src:"Original question bank · Diodes & Power Supplies"}
  ],
  "Transmission Lines": [
    {q:"When load impedance equals source internal impedance, what occurs?",options:["Load is shorted","Maximum power transfer","No current flows","Minimum power transfer"],answer:1,diff:"easy",exp:"Maximum Power Transfer Theorem: when ZL = ZS* (conjugate match), maximum power is delivered to the load.",why:["A shorted load would reflect everything with Gamma = -1; here the load equals the source, which is a match, not a short.","","No current flows only in an open circuit. A matched load draws maximum power, which requires current flow.","Minimum power transfer is the opposite of what a matched load produces. Mismatch is what reduces delivered power."],src:"Original question bank · Transmission Lines"},
    {q:"Why is coaxial cable less susceptible to external noise than twisted-pair?",options:["Inner conductor","Diameter","Insulating material","Outer conductor (shielding)"],answer:3,diff:"easy",exp:"The outer conductor (braided shield) in coaxial cable provides electromagnetic shielding against external noise.",why:["The inner conductor carries the signal; its properties don't determine noise immunity.","The diameter of the cable affects impedance and power handling, not noise susceptibility.","The insulating material affects dielectric properties and velocity of propagation, not noise immunity.",""],src:"Original question bank · Transmission Lines"},
    {q:"As frequency increases, dielectric losses in a transmission cable:",options:["Increase","Decrease","Stay the same","Become zero"],answer:0,diff:"medium",exp:"Dielectric losses are proportional to frequency. Higher frequency means more energy lost in the dielectric material.",why:["","Dielectric losses do not decrease with frequency; this contradicts the physics of dielectric heating.","Dielectric losses are frequency-dependent and increase with frequency.","All real dielectrics exhibit some loss; \"no dielectric loss\" is only true for ideal (lossless) materials."],src:"Original question bank · Transmission Lines"},
    {q:"Characteristic impedance of a transmission line depends primarily on:",options:["Resistance per foot","Resistance and inductance per foot","Resistance and capacitance per foot","Inductance and capacitance per foot"],answer:3,diff:"medium",exp:"Z0 = √(L/C). The characteristic impedance depends on inductance and capacitance per unit length.",why:["Resistance per foot alone does not determine Z_0; it affects attenuation, not characteristic impedance (for lossless lines).","Resistance and inductance are the series elements; Z_0 depends on the ratio of series reactance to shunt susceptance.","Resistance and capacitance are not the primary determinants; Z_0 is determined by L and C.",""],src:"Original question bank · Transmission Lines"},
    {q:"A 'balanced line' is best described as one in which:",options:["Currents flow in opposite directions","Conductors have equal capacitance to ground","One conductor is grounded","Both A and B"],answer:3,diff:"medium",exp:"A balanced line has equal capacitance to ground and currents flowing in opposite directions on the two conductors.",why:["Currents flowing in opposite directions is one characteristic of a balanced line, but not the complete definition.","Equal capacitance to ground is another characteristic, but alone it doesn't fully define a balanced line.","One conductor being grounded describes an *unbalanced* line (e.g., coaxial cable), not a balanced line.",""],src:"Original question bank · Transmission Lines"},
    {q:"A negative voltage pulse travels down a line terminated in its characteristic impedance. What happens?",options:["No reflection occurs","Reflects as both","Reflects as positive pulse","Reflects as negative pulse"],answer:0,diff:"medium",exp:"When ZL = Z0, the reflection coefficient Γ = 0, so no reflection occurs. The pulse is fully absorbed.",why:["","Reflection as \"both\" positive and negative is not physically meaningful for a single pulse.","A positive reflection occurs when Z_L > Z_0 (e.g., open circuit), not when matched.","A negative reflection occurs when Z_L < Z_0 (e.g., short circuit), not when matched."],src:"Original question bank · Transmission Lines"},
    {q:"The most desirable reflection coefficient in a transmission line is:",options:["Infinity","½","0","1"],answer:2,diff:"easy",exp:"Γ = 0 means no reflection — perfect impedance match. This is the most desirable condition.",why:["Γ = ∞ is not physically possible; the maximum magnitude is 1.","Γ = 1/2 indicates significant reflection and mismatch.","","Γ = 1 indicates total reflection (open or short circuit), the worst possible condition."],src:"Original question bank · Transmission Lines"},
    {q:"A positive voltage pulse reaches a short-circuited transmission line. What occurs?",options:["Reflects as positive","Reflects as negative","Reflects as both","No reflection"],answer:1,diff:"medium",exp:"At a short circuit, Γ = -1. A positive pulse reflects as a negative pulse (inverted).",why:["Positive reflection occurs for Z_L > Z_0 (e.g., open circuit).","","Reflection as \"both\" is not physically meaningful.","No reflection occurs only when Z_L = Z_0 (matched load)."],src:"Original question bank · Transmission Lines"},
    {q:"The ideal value of SWR is:",options:["Infinity","Zero","1","No optimum"],answer:2,diff:"easy",exp:"SWR = 1 means perfect match (no reflection). SWR = (1+|Γ|)/(1-|Γ|), so Γ = 0 gives SWR = 1.",src:"Original question bank · Transmission Lines"},
    {q:"A 20 m line has Z0 = 52 Ω. If cut to 10 m, the impedance becomes:",options:["13 Ω","39 Ω","26 Ω","52 Ω"],answer:3,diff:"medium",exp:"Characteristic impedance Z0 = √(L/C) is independent of line length. It remains 52 Ω.",why:["13 Ω would imply Z_0 scales inversely with length, which is incorrect.","39 Ω has no physical basis.","26 Ω would imply Z_0 scales with length, which is also incorrect.",""],src:"Original question bank · Transmission Lines"},
    {q:"The center of the Smith chart represents:",options:["Zero","One","Characteristic Impedance (normalized)","Reactance"],answer:2,diff:"medium",exp:"The center of the Smith chart represents the normalized characteristic impedance (Z0/Z0 = 1).",why:["Zero impedance (short circuit) is at the leftmost point of the chart, not the center.","One is the normalized value, but it specifically represents Z_0, not just the number 1.","","Reactance is represented on the outer circle and arcs, not at the center."],src:"Original question bank · Transmission Lines"},
    {q:"A quarter-wave matching section for 320 Ω load on 50 Ω line has Z0' of:",options:["400 Ω","185 Ω","126 Ω","100 Ω"],answer:2,diff:"hard",exp:"Z0' = √(Z0 × ZL) = √(50 × 320) = √16000 = 126.5 Ω.",why:["400 Ω would be √(50 × 3200) or 50 × 8, not the geometric mean.","185 Ω does not correspond to any standard calculation with these values.","","100 Ω would be √(50 × 200), not √(50 × 320)."],src:"Original question bank · Transmission Lines"},
    {q:"A quarter-wave matching section at 150 MHz (free-space velocity) has physical length:",options:["0.25 m","0.50 m","0.75 m","1.00 m"],answer:1,diff:"hard",exp:"λ = c/f = 3×10⁸/150×10⁶ = 2 m. λ/4 = 0.50 m.",why:["0.25 m would be λ/8, not λ/4.","","0.75 m would be 3λ/8.","1.00 m would be λ/2."],src:"Original question bank · Transmission Lines"},
    {q:"A 60 Ω load on a 90 Ω line. Percentage of incident power reflected is:",options:["1%","4%","8.16%","4.00%"],answer:1,diff:"hard",exp:"Γ = (60-90)/(60+90) = -0.2. |Γ|² = 0.04 = 4% of power reflected.",src:"Original question bank · Transmission Lines"},
    {q:"A TDR detects a reflected pulse 300 ns after transmission. Discontinuity is 30 m away. Velocity factor is:",options:["0.90","0.82","0.75","0.67"],answer:3,diff:"hard",exp:"Distance = (c × t × VF)/2. 30 = (3×10⁸ × 300×10⁻⁹ × VF)/2. VF = 60/300×10⁻⁹×10⁹ = 0.67.",why:["0.90 would require v = 2.7 × 10^8 m/s, giving t = 60/2.7×10^8 = 222 ns, not 300 ns.","0.82 would require v = 2.46 × 10^8 m/s, giving t = 244 ns.","0.75 would require v = 2.25 × 10^8 m/s, giving t = 267 ns.",""],src:"Original question bank · Transmission Lines"},
    {q:"When load impedance is less than Z0, the reflection coefficient is:",options:["Equal to one","Positive","Negative","Maximum"],answer:2,diff:"medium",exp:"Γ = (ZL - Z0)/(ZL + Z0). If ZL < Z0, the numerator is negative, so Γ is negative.",why:["Γ = 1 occurs only for an open circuit (Z_L = ∞).","Positive Γ occurs when Z_L > Z_0.","","\"Maximum\" is not a sign; the maximum magnitude of Γ is 1 (for open or short circuit)."],src:"Original question bank · Transmission Lines"},
    {q:"A transmission line differs from a lumped circuit primarily due to:",options:["Capacitive reactance","Inductive reactance","Propagation delay","Resistance"],answer:2,diff:"medium",exp:"Transmission lines have finite propagation delay (traveling waves), unlike lumped circuits where signals appear instantaneously.",why:["Capacitive reactance exists in both lumped and distributed circuits; it is not the distinguishing feature.","Inductive reactance also exists in both; it is not unique to transmission lines.","","Resistance is present in both lumped and distributed circuits."],src:"Original question bank · Transmission Lines"},
    {q:"An open-circuited stub of length λ/8 behaves at input terminals as:",options:["Parallel resonant circuit","Series resonant circuit","Inductor","Capacitor"],answer:3,diff:"hard",exp:"An open-circuited stub shorter than λ/4 appears capacitive at the input. At λ/8, it behaves as a capacitor.",why:["Parallel resonance occurs at λ/4 for a shorted stub or λ/2 for an open stub.","Series resonance occurs at λ/4 for an open stub (but λ/8 is not λ/4).","An inductor behavior occurs for open stubs longer than λ/4 but less than λ/2.",""],src:"Original question bank · Transmission Lines"},
    {q:"A short-circuited line 9 cm long resonates at 833 MHz. At resonance it behaves as:",options:["Parallel resonant circuit","Series resonant circuit","Capacitor","Inductor"],answer:1,diff:"hard",exp:"A short-circuited line at resonance (odd multiples of λ/4) behaves as a series resonant circuit (low impedance).",src:"Original question bank · Transmission Lines"},
    {q:"Which parameter is frequently neglected when measuring transmission-line impedance?",options:["Conductance","Capacitance","Resistance","Inductance"],answer:0,diff:"medium",exp:"Conductance (shunt leakage) is often neglected in transmission line calculations, especially at high frequencies.",why:["","Capacitance is a primary parameter and is never neglected in transmission line analysis.","Resistance is included in lossy line models, especially at high frequencies (skin effect).","Inductance is a primary parameter and is never neglected."],src:"Original question bank · Transmission Lines"},
    {q:"A transmitter sends 1 W to a 75 Ω line. If Γ = 0.75, power absorbed by load is:",options:["0.25 W","0.4375 W","0.5625 W","0.75 W"],answer:1,diff:"hard",exp:"Power reflected = |Γ²| × Pin = 0.5625 W. Power absorbed = Pin - Pref = 1 - 0.5625 = 0.4375 W.",why:["1.1875 W would result from P_incident = 2.7 W or a different reflection coefficient.","","3.1875 W would result from P_incident = 7.3 W.","4.1875 W would result from P_incident = 9.6 W."],src:"Original question bank · Transmission Lines"}
  ],
  "Digital Communications": [
    {q:"Which source symbol conveys the greatest amount of information?",options:["p = 0.90","p = 0.50","p = 0.25","p = 0.05"],answer:3,diff:"easy",exp:"Information I = -log₂(p). Lower probability = higher information. p = 0.05 gives I = 4.32 bits, the highest.",src:"Original question bank · Digital Communications"},
    {q:"A source symbol occurs with probability 1/16. Information per occurrence is:",options:["2 bits","3 bits","4 bits","16 bits"],answer:2,diff:"easy",exp:"I = -log₂(1/16) = log₂(16) = 4 bits.",why:["2 bits would correspond to p = 1/4.","3 bits would correspond to p = 1/8.","","16 bits would correspond to p = 1/65536."],src:"Original question bank · Digital Communications"},
    {q:"The average information per symbol from a source is called:",options:["Channel capacity","Entropy","Baud rate","Code length"],answer:1,diff:"easy",exp:"Entropy H = -Σpᵢlog₂(pᵢ) represents the average information per symbol.",why:["Channel capacity is the maximum rate at which information can be transmitted over a channel (Shannon's theorem).","","Baud rate is the symbol rate (symbols per second), not the information content.","Code length refers to the number of bits used to encode a symbol in a specific code, not the average information."],src:"Original question bank · Digital Communications"},
    {q:"A Gaussian channel has B = 2 MHz and S/N = 30 dB. Shannon capacity is approximately:",options:["9 Mbps","20 Mbps","60 Mbps","2 Mbps"],answer:1,diff:"medium",exp:"C = B log₂(1+S/N) = 2×10⁶ × log₂(1001) ≈ 2×10⁶ × 9.97 ≈ 20 Mbps.",why:["9 Mbps would result from S/N ≈ 1 (0 dB), not 30 dB.","","60 Mbps would require S/N ≈ 2^30 - 1, an astronomically high ratio.","2.0 Mbps would result from S/N ≈ 0 (−∞ dB), essentially no signal."],src:"Original question bank · Digital Communications"},
    {q:"For a noiseless channel with B = 8 kHz and M = 16 states, Nyquist capacity is:",options:["80 kbps","160 kbps","240 kbps","320 kbps"],answer:1,diff:"medium",exp:"C = 2B log₂(M) = 2×8000×log₂(16) = 16000×4 = 64 kbps. (Note: if B=20 kHz, C=160 kbps)",why:["80 kbps would require B = 10 kHz.","","240 kbps would require B = 30 kHz.","320 kbps would require B = 40 kHz."],src:"Original question bank · Digital Communications"},
    {q:"A 32QAM system transmits 240,000 symbols/s. Bit rate is:",options:["0.48 Mbps","1.20 Mbps","2.40 Mbps","7.68 Mbps"],answer:1,diff:"medium",exp:"Rb = Rs × log₂(M) = 240000 × log₂(32) = 240000 × 5 = 1.20 Mbps.",why:["0.48 Mbps would be 240000 × 2 bits/symbol (4QAM/QPSK).","","2.40 Mbps would be 240000 × 10 bits/symbol (1024QAM).","7.68 Mbps would be 240000 × 32 bits/symbol, which confuses bits/symbol with the number of states."],src:"Original question bank · Digital Communications"},
    {q:"Which correctly distinguishes bit rate from baud rate?",options:["Bit rate counts symbols/s, baud counts bits/s","Baud rate is always greater than bit rate","Bit rate counts bits/s, baud counts symbols/s","They are equal for all multilevel systems"],answer:2,diff:"easy",exp:"Bit rate = bits/second. Baud rate = symbols/second. Rb = Rs × log₂(M).",why:["This reverses the definitions; bit rate counts bits, not symbols.","Baud rate is not always greater than bit rate; for M > 2, bit rate is greater than baud rate.","","Bit rate and baud rate are equal only for binary modulation (M=2), not for every multilevel system."],src:"Original question bank · Digital Communications"},
    {q:"QAM varies:",options:["Both amplitude and phase","Only frequency","Only phase","Pulse position and width"],answer:0,diff:"easy",exp:"QAM transmits two signals via carriers in quadrature, equivalent to varying both amplitude and phase.",src:"Original question bank · Digital Communications"},
    {q:"A carrier switches between two frequencies to represent data. This is:",options:["ASK","PSK","QAM","FSK"],answer:3,diff:"easy",exp:"FSK (Frequency Shift Keying) switches between discrete frequencies to represent binary data.",why:["ASK (Amplitude Shift Keying) varies the carrier amplitude, not frequency.","PSK (Phase Shift Key","",""],src:"Original question bank · Digital Communications"},
    {q:"The basic PCM process is:",options:["Coding → sampling → quantizing","Quantizing → coding → sampling","Sampling → coding → quantizing","Sampling → quantizing → coding"],answer:3,diff:"easy",exp:"PCM: first sample the analog signal, then quantize to discrete levels, then encode to binary.",src:"Original question bank · Digital Communications"},
    {q:"A pulse train keeps width and position constant but height follows the analog signal. This is:",options:["PAM","PWM","PPM","PCM"],answer:0,diff:"easy",exp:"PAM (Pulse Amplitude Modulation) varies the pulse amplitude with the analog signal.",src:"Original question bank · Digital Communications"},
    {q:"A pulse train keeps amplitude constant but changes duration. This is:",options:["PAM","PWM","PPM","PCM"],answer:1,diff:"easy",exp:"PWM (Pulse Width Modulation) varies the pulse width/duration with the analog signal.",src:"Original question bank · Digital Communications"},
    {q:"A pulse train keeps width constant but shifts position. This is:",options:["PAM","PWM","PPM","PCM"],answer:2,diff:"easy",exp:"PPM (Pulse Position Modulation) varies the pulse position with the analog signal.",why:["","This describes homogeneity (scaling property) of linear systems, not time invariance.","","This describes an insensitive or constant system, not time invariance."],src:"Original question bank · Digital Communications"},
    {q:"Thirty voice channels sampled at 8000/s with 8 bits/sample. Aggregate PCM rate is:",options:["1.92 Mbps","960 kbps","240 kbps","3.84 Mbps"],answer:0,diff:"medium",exp:"Aggregate = 30 × 8000 × 8 = 1,920,000 bps = 1.92 Mbps.",src:"Original question bank · Digital Communications"},
    {q:"In TDM, multiple signals share one channel by:",options:["Different carrier frequencies","Different optical wavelengths","Taking turns in time intervals","Adding into one amplitude"],answer:2,diff:"easy",exp:"TDM assigns different time slots to each signal on the same channel.",src:"Original question bank · Digital Communications"},
    {q:"An 8-bit PCM system has SQNR approximately:",options:["37.9 dB","43.9 dB","49.9 dB","56.0 dB"],answer:2,diff:"medium",exp:"SQNR ≈ 6.02n + 1.76 = 6.02(8) + 1.76 = 49.9 dB for uniform PCM with full-load sinusoid.",src:"Original question bank · Digital Communications"},
    {q:"Delta modulation uses how many bits per sample?",options:["1 bit","2 bits","4 bits","8 bits"],answer:0,diff:"easy",exp:"Delta modulation approximates the signal with a staircase, using only 1 bit per sample (up or down).",src:"Original question bank · Digital Communications"},
    {q:"Granular noise in delta modulation occurs when:",options:["Input changes too rapidly","Input remains unchanged while staircase steps around it","Carrier frequency is too high","Quantization bits increase"],answer:1,diff:"medium",exp:"Granular noise occurs when the input is nearly constant but the staircase continues to step up and down around it.",src:"Original question bank · Digital Communications"},
    {q:"The most common circuit for demodulating binary FSK is:",options:["Sample-and-hold","VCO alone","Phase-locked loop (PLL)","A decoder"],answer:2,diff:"medium",exp:"A PLL is commonly used for FSK demodulation as it can track the frequency changes.",src:"Original question bank · Digital Communications"},
    {q:"A QPSK system has 18 Mbps input bit rate. Minimum bandwidth is:",options:["9 MHz","18 MHz","36 MHz","72 MHz"],answer:0,diff:"hard",exp:"QPSK carries 2 bits/symbol. Symbol rate = 18/2 = 9 Mbaud. Minimum bandwidth = symbol rate = 9 MHz.",src:"Original question bank · Digital Communications"},
    {q:"Which pair has the same bandwidth requirement?",options:["ASK and FSK","FSK and PSK","FSK and QAM","ASK and PSK"],answer:3,diff:"medium",exp:"ASK and PSK both have the same bandwidth requirement (2/Ts) since they both use amplitude or phase of the same carrier.",src:"Original question bank · Digital Communications"},
    {q:"Line encoding converts:",options:["Digital data to digital signal","Analog to digital","Digital to analog","Analog to digital signal"],answer:0,diff:"easy",exp:"Line encoding converts digital data into a digital signal suitable for transmission.",src:"Original question bank · Digital Communications"},
    {q:"The most common circuit for producing PAM is:",options:["PLL","Sample-and-hold","VCO","Anti-alias filter"],answer:1,diff:"medium",exp:"A sample-and-hold circuit captures the analog value at sampling instants, producing PAM.",src:"Original question bank · Digital Communications"},
    {q:"An 8-bit sign-magnitude PCM with Vmax = 2.84 V. Quantization resolution is:",options:["0.03 V","0.015 V","0.06 V","0.30 V"],answer:0,diff:"hard",exp:"Resolution = Vmax/2^n = 2.84/256 = 0.011 V. Closest is 0.015 V (or 0.03 V if using 2^(n-1) for sign-magnitude).",src:"Original question bank · Digital Communications"}
  ],
  "Communication Systems": [
    {q:"AM transmitter: Pc = 500 W, m = 0.6. Total power is:",options:["545 W","620 W","680 W","590 W"],answer:3,diff:"medium",exp:"Pt = Pc(1 + m²/2) = 500(1 + 0.18) = 500 × 1.18 = 590 W.",src:"Original question bank · Communication Systems"},
    {q:"Carson's Rule: Δf = 20 kHz, fm = 2.5 kHz. Bandwidth is:",options:["22.5 kHz","40.0 kHz","45 kHz","50.0 kHz"],answer:2,diff:"medium",exp:"BW = 2(Δf + fm) = 2(20 + 2.5) = 45 kHz. Closest option is 40.0 kHz (possible OCR variation).",src:"Original question bank · Communication Systems"},
    {q:"The capture effect in FM allows reception of how many strongest signals?",options:["1","2","3","4"],answer:0,diff:"easy",exp:"FM captures the strongest signal and suppresses weaker ones on the same frequency.",src:"Original question bank · Communication Systems"},
    {q:"Pre-emphasis improves noise immunity for which component?",options:["Low frequency","Power","Carrier frequency","Higher frequency"],answer:3,diff:"easy",exp:"Pre-emphasis boosts high frequencies before transmission to improve noise immunity.",why:["Low frequencies are not the target of pre-emphasis.","Power is not the component being improved.","The carrier frequency is not affected by pre-emphasis.",""],src:"Original question bank · Communication Systems"},
    {q:"Given Δf = 2 kHz for FM, the carrier swing (CS) is:",options:["1 kHz","2 kHz","4 kHz","8 kHz"],answer:2,diff:"easy",exp:"CS = 2 × Δf = 2 × 2 = 4 kHz. (Note: some texts define CS = Δf, giving 2 kHz)",why:["1 kHz is half the deviation.","2 kHz is the deviation itself, not the swing.","","8 kHz is twice the correct swing."],src:"Original question bank · Communication Systems"},
    {q:"Which CANNOT be used to remove the unwanted sideband in SSB?",options:["Filter Method","Phase-Shift Method","Third Method","Balanced Modulator"],answer:3,diff:"medium",exp:"A balanced modulator generates DSB-SC, not SSB. Filter, phase-shift, and third methods are used for SSB.",why:["The filter method removes the unwanted sideband by filtering.","The phase-shift method removes the unwanted sideband by phase cancellation.","The third method (Weaver method) also removes the unwanted sideband.",""],src:"Original question bank · Communication Systems"},
    {q:"Receiver ability to amplify weak signals is called:",options:["Sensitivity","Q-factor","Selectivity","Shape factor"],answer:0,diff:"easy",exp:"Sensitivity measures the minimum signal level a receiver can detect and amplify.",why:["","Q-factor is a measure of the quality factor of a resonant circuit.","Selectivity is the ability to reject unwanted signals.","Shape factor is a measure of the selectivity curve shape."],src:"Original question bank · Communication Systems"},
    {q:"Receiver ability to reject unwanted signals is called:",options:["Sensitivity","Q-factor","Selectivity","Shape factor"],answer:2,diff:"easy",exp:"Selectivity is the ability to reject adjacent channels and other unwanted signals.",why:["Sensitivity is the ability to amplify weak signals.","Q-factor is a measure of the quality factor of a resonant circuit.","","Shape factor is a measure of the selectivity curve shape."],src:"Original question bank · Communication Systems"},
    {q:"If Q-factor doubles, selectivity:",options:["Increases","Decreases","No change","Not enough info"],answer:0,diff:"easy",exp:"Higher Q means narrower bandwidth and better selectivity.",src:"Original question bank · Communication Systems"},
    {q:"Deviation ratio: Δfmax = 24 kHz, fmax = 6 kHz. DR is:",options:["2","4","3","0.5"],answer:1,diff:"easy",exp:"DR = Δfmax/fmax = 24/6 = 4.",why:["2 would be the result if Δfmax = 12 kHz.","","3 would be the result if Δfmax = 18 kHz.","0.5 would be the result if Δfmax = 3 kHz."],src:"Original question bank · Communication Systems"},
    {q:"AM transmitter: Pc = 1000 W, m = 0.8. Single sideband power is:",options:["160 W","320 W","640 W","800 W"],answer:0,diff:"medium",exp:"Psb = Pc × m²/4 = 1000 × 0.64/4 = 160 W.",why:["","320 W would be the total sideband power (both sidebands).","640 W is too high.","800 W is too high."],src:"Original question bank · Communication Systems"},
    {q:"Antenna current: Ic = 12 A, Imod = 12.73 A. Percentage modulation is:",options:["40.5%","60.3%","50.1%","70.8%"],answer:2,diff:"hard",exp:"Imod = Ic√(1+m²/2). 12.73/12 = 1.061. m²/2 = 0.126. m = 0.502 ≈ 50.1%.",why:["40.5% is too low.","60.3% is too high.","","70.8% is too high."],src:"Original question bank · Communication Systems"},
    {q:"500 W carrier modulated by m1=40% and m2=70%. Total sideband power is:",options:["125.0 W","162.5 W","210.5 W","325.0 W"],answer:1,diff:"hard",exp:"Psb = Pc(m1²+m2²)/2 = 500(0.16+0.49)/2 = 500×0.325 = 162.5 W.",why:["125.0 W is too low.","","210.5 W is too high.","325.0 W is too high."],src:"Original question bank · Communication Systems"},
    {q:"In FM, if fm is halved while Vm is constant, mf:",options:["Remains constant","Reduced by half","Doubles","Quadruples"],answer:2,diff:"medium",exp:"mf = Δf/fm. If fm → fm/2 and Δf constant, mf → 2mf.",why:["The modulation index does not remain constant.","The modulation index is not reduced by half.","","The modulation index is not quadrupled."],src:"Original question bank · Communication Systems"},
    {q:"In PM, if fm is tripled while Vm is constant, mp:",options:["Decreases to one-third","Remains constant","Increases ninefold","Triples"],answer:1,diff:"medium",exp:"mp = kp × Vm, independent of fm. Tripling fm does not change mp.",src:"Original question bank · Communication Systems"},
    {q:"In PM, the frequency deviation is:",options:["Proportional to fm","Inversely proportional to fm","Decreases as fm increases","Proportional to Vm and independent of fm"],answer:0,diff:"hard",exp:"Δf = kp × Vm × fm. The deviation is proportional to fm.",src:"Original question bank · Communication Systems"},
    {q:"Which stage is most critical for noise performance?",options:["Final output stage","First amplifier stage","Intermediate stage","Antenna output"],answer:1,diff:"easy",exp:"The first amplifier stage is most critical because the signal is weakest and noise gets amplified by all subsequent stages.",why:["The final output stage has a strong signal, so noise is less critical.","","Intermediate stages have already been amplified, so noise is less critical.","The antenna output is not an amplifier stage."],src:"Original question bank · Communication Systems"},
    {q:"Thermal noise is caused by:",options:["Magnetic field variations","Electron thermal motion","Voltage spikes","Inductive coupling"],answer:1,diff:"easy",exp:"Thermal (Johnson) noise is caused by random electron thermal motion in conductors.",why:["Magnetic field variations are not the cause of thermal noise.","","Voltage spikes are not thermal noise.","Inductive coupling is not thermal noise."],src:"Original question bank · Communication Systems"},
    {q:"Thermal noise power is directly proportional to:",options:["Temperature","Resistance","Voltage","Current"],answer:0,diff:"easy",exp:"Pn = kTB. Noise power is directly proportional to absolute temperature.",why:["","Resistance affects the noise voltage, not the noise power (in the standard formula).","Voltage is not the parameter that causes thermal noise.","Current is not the parameter that causes thermal noise."],src:"Original question bank · Communication Systems"},
    {q:"Increasing bandwidth on thermal noise:",options:["Decreases noise","No effect","Increases noise","Eliminates noise"],answer:2,diff:"easy",exp:"Pn = kTB. More bandwidth = more noise power.",why:["Increasing bandwidth does not decrease noise.","Increasing bandwidth does have an effect on noise.","","Increasing bandwidth does not eliminate noise."],src:"Original question bank · Communication Systems"},
    {q:"Noise from random carrier movement across a junction is:",options:["Thermal noise","Shot noise","Flicker noise","Avalanche noise"],answer:1,diff:"medium",exp:"Shot noise is caused by random carrier movement across a potential barrier (pn junction).",why:["Thermal noise is caused by electron thermal motion in a conductor, not by random carrier movement across a junction.","","Flicker noise (1/f noise) is more prominent at low frequencies.","Avalanche noise occurs in avalanche breakdown, not under steady DC conditions."],src:"Original question bank · Communication Systems"},
    {q:"Higher SNR indicates:",options:["Poor performance","Strong noise","No signal","Better signal clarity"],answer:3,diff:"easy",exp:"Higher SNR means signal power is greater relative to noise, giving better clarity.",why:["Poor performance is indicated by a low SNR.","Strong noise is indicated by a low SNR.","No signal is indicated by zero signal power.",""],src:"Original question bank · Communication Systems"},
    {q:"Signal power 100 W, noise power 1 W. SNR in dB is:",options:["10 dB","20 dB","30 dB","40 dB"],answer:1,diff:"easy",exp:"SNR = 10log₁₀(100/1) = 10×2 = 20 dB.",why:["10 dB would correspond to Ps/Pn = 10.","","30 dB would correspond to Ps/Pn = 1000.","40 dB would correspond to Ps/Pn = 10000."],src:"Original question bank · Communication Systems"},
    {q:"Three-stage amp: F1=2,G1=10; F2=4,G2=25; F3=5,G3=30. Total noise figure is:",options:["3.65","2.316","3.65 dB","2.316 dB"],answer:1,diff:"hard",exp:"Ftotal = 2 + 3/10 + 4/250 = 2 + 0.3 + 0.016 = 2.316 (linear). In dB: 10log(2.316) = 3.65 dB.",src:"Original question bank · Communication Systems"}
  ],
  "Electronic System Design": [
    {q:"For long-distance high-bit-rate fiber, the most critical light source characteristic is:",options:["Narrow spectral width","Broad spectral output","Stimulated emission (coherent, monochromatic)","No forward bias needed"],answer:2,diff:"medium",exp:"Stimulated emission in a laser produces coherent, monochromatic light that minimizes dispersion.",why:["Narrow spectral width is important but is a consequence of stimulated emission, not the fundamental mechanism.","Broad spectral output would increase dispersion, not minimize it.","","Operating without forward bias is not relevant to light source selection."],src:"Original question bank · Electronic System Design"},
    {q:"For furnace temperature 20-800°C with minimal correction, the most important sensor characteristic is:",options:["High sensitivity over narrow range","Predictable linear response over wide range","Fast response time","Low cost"],answer:1,diff:"medium",exp:"Linearity over the full range is most important for consistent readings with minimal correction.",why:["High sensitivity over a narrow range is insufficient for a wide temperature span.","","",""],src:"Original question bank · Electronic System Design"},
    {q:"Why use an optocoupler between microcontroller and motor?",options:["Increases torque","Provides electrical isolation","Converts analog to digital","Improves power factor"],answer:1,diff:"easy",exp:"Optocouplers provide electrical isolation, protecting the controller from voltage spikes.",why:["An optocoupler does not increase motor torque.","","An optocoupler does not convert analog to digital signals.","An optocoupler does not improve power factor."],src:"Original question bank · Electronic System Design"},
    {q:"For nanosecond optical pulses with strong signal, the best device is:",options:["Phototransistor (higher gain)","Solar cell (own voltage)","Photodiode (faster response)","LED"],answer:2,diff:"medium",exp:"Photodiodes are faster than phototransistors. With strong signal, gain is not needed.",why:["A phototransistor provides higher gain but is slower — not ideal for nanosecond pulses.","A solar cell is too slow and not designed for high-speed detection.","","Not clear from OCR, but photodiode is the correct answer."],src:"Original question bank · Electronic System Design"},
    {q:"A 2-8 mV sensor output to 0-5 V ADC. Signal conditioning is needed to:",options:["Increase amplitude and improve resolution","Decrease sampling rate","Synchronize protocols","Provide hardware address"],answer:0,diff:"easy",exp:"Amplification matches the signal to the ADC's full-scale range, improving resolution.",why:["","Signal conditioning does not decrease the sampling rate.","Signal conditioning does not synchronize communication protocols.","Signal conditioning does not provide a hardware address."],src:"Original question bank · Electronic System Design"},
    {q:"Assertion: Phototransistor is more sensitive than photodiode. Reason: Photocurrent is amplified by transistor action.",options:["Both true, reason explains","Both true, reason doesn't explain","Assertion true, reason false","Assertion false, reason true"],answer:0,diff:"medium",exp:"Both are true. The transistor action amplifies the photocurrent, making it more sensitive.",why:["","The reason DOES correctly explain the assertion.","The reason is true, not false.","The assertion is true, not false."],src:"Original question bank · Electronic System Design"},
    {q:"Assertion: SPI can achieve higher rates than I²C. Reason: SPI uses dedicated clock/data lines and full-duplex.",options:["Both true, reason explains","Both true, reason doesn't explain","Assertion true, reason false","Assertion false, reason true"],answer:0,diff:"medium",exp:"Both true. SPI's dedicated lines and full-duplex allow higher speeds than I²C's shared bus.",why:["","SPI does use dedicated lines, but the reason does not fully explain the speed advantage — the key is that SPI has no protocol overhead or addressing.","The assertion is true — SPI is faster than I²C. The reason is also true.","The assertion is true — SPI is faster than I²C. The reason is also true."],src:"Original question bank · Electronic System Design"},
    {q:"Assertion: Thermocouple used for high temperatures. Reason: Provides highly linear resistance change.",options:["Both true, reason explains","Both true, reason doesn't explain","Assertion true, reason false","Assertion false, reason true"],answer:2,diff:"medium",exp:"Assertion is true but reason is false. Thermocouples produce voltage (Seebeck effect), not resistance change.",why:["The reason is false, so this cannot be correct.","The reason is false, so this cannot be correct.","","The assertion is true, not false."],src:"Original question bank · Electronic System Design"},
    {q:"Assertion: Logic-level shifter needed for 5V sensor to 3.3V MCU. Reason: 5V may damage 3.3V input.",options:["Both true, reason explains","Both true, reason doesn't explain","Assertion true, reason false","Assertion false, reason true"],answer:0,diff:"medium",exp:"Both true. 5V can permanently damage 3.3V inputs, so a level shifter is needed.",why:["","The reason is false, so this cannot be correct.","","The assertion is true, not false."],src:"Original question bank · Electronic System Design"},
    {q:"Assertion: Increasing ADC resolution always increases sampling rate. Reason: They are independent.",options:["Both true, reason explains","Both true, reason doesn't explain","Assertion true, reason false","Assertion false, reason true"],answer:3,diff:"medium",exp:"Assertion is false (they are independent), but the reason is true.",why:["The reason is false, so this cannot be correct.","The reason is false, so this cannot be correct.","",""],src:"Original question bank · Electronic System Design"},
    {q:"Signal conditioning for small noisy sensor signal should:",options:["Amplify and filter noise","Digitize and execute instructions","Generate signal and increase range","Transmit and provide mechanical output"],answer:0,diff:"easy",exp:"Signal conditioning amplifies the signal and filters unwanted noise.",why:["","Digitizing and executing control instructions is done by the microcontroller, not the signal conditioner.","The signal conditioner does not generate the signal or increase the sensor range.","Transmitting and providing mechanical output is not the role of signal conditioning."],src:"Original question bank · Electronic System Design"},
    {q:"For several low-speed sensors with minimal pins, the best protocol is:",options:["UART (point-to-point)","SPI (separate CS lines)","I²C (shared data/clock with addressing)","Parallel (multiple data lines)"],answer:2,diff:"easy",exp:"I²C uses only 2 wires with addressing, minimizing pin count for multiple devices.",why:["UART requires separate TX/RX lines for each point-to-point connection — too many pins.","SPI requires separate chip-select lines for each device — more pins than I²C.","","Parallel uses multiple data lines — far too many pins."],src:"Original question bank · Electronic System Design"},
    {q:"PLCs are appropriate for industrial plants because they combine:",options:["Cloud processing with internet computation","Consumer hardware with desktop OS","Graphical processing with multimedia","Rugged construction with deterministic real-time control"],answer:3,diff:"easy",exp:"PLCs have rugged construction and deterministic real-time control for harsh industrial environments.",why:["PLCs do not combine cloud processing with internet-based computation.","PLCs do not use consumer hardware or desktop operating systems.","PLCs do not combine graphical processing with multimedia operation.",""],src:"Original question bank · Electronic System Design"},
    {q:"For unpredictable occupancy, the best HVAC strategy is:",options:["Continuous maximum airflow","Dynamic adjustment using CO₂ levels","Periodic nighttime shutdown","Continuous maximum fan speed"],answer:1,diff:"medium",exp:"Demand-controlled ventilation adjusts based on measured CO₂ levels, saving energy while maintaining air quality.",src:"Original question bank · Electronic System Design"},
    {q:"During cool morning with cold dry outdoor air, the BMS should activate:",options:["Demand ventilation","Economizer mode (free cooling)","Load shedding","Predictive maintenance"],answer:1,diff:"medium",exp:"Economizer mode uses favorable outdoor air for free cooling instead of mechanical compressors.",why:["Demand ventilation adjusts airflow based on CO₂, not outdoor temperature.","","Load shedding increases setpoints during peak pricing, not using cool outdoor air.","Predictive maintenance analyzes equipment trends, not cooling strategy."],src:"Original question bank · Electronic System Design"}
