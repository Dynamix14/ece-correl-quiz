  "Transmission Lines": [
    {q:"An RF source is connected to a load such that the load impedance is exactly equal to the internal impedance of the source. What condition occurs in the circuit?",options:["The electrical load is shorted","The source delivers maximum power to the load","No current flows in the circuit","The source delivers minimum power"],answer:1,diff:"medium",exp:"When Z_L equals the source impedance the line is matched, so the reflection coefficient is zero and all incident power is delivered to the load — the maximum power transfer condition.",why:["A shorted load would reflect everything with Gamma = -1; here the load equals the source, which is a match, not a short.","","Current definitely flows — a matched load draws maximum power, which requires maximum current transfer.","Minimum power transfer is the opposite of what a matched load produces; mismatch is what reduces delivered power."],src:"Exam compilation · Transmission Lines · Q1"},
    {q:"Why is a coaxial cable less susceptible to external noise compared to a twisted-pair cable?",options:["Inner conductor","Diameter of cable","Insulating material","Outer conductor (shielding)"],answer:3,diff:"easy",exp:"The outer conductor of a coaxial cable acts as a Faraday shield: external electric fields terminate on it and are diverted to ground instead of reaching the inner conductor.",why:["The inner conductor carries the signal but provides no shielding from outside fields.","Diameter alone does not determine noise immunity; a large unshielded pair is still susceptible.","The dielectric sets impedance and velocity factor, not immunity to external interference.",""],src:"Exam compilation · Transmission Lines · Q2"},
    {q:"As operating frequency increases, what happens to dielectric losses in a transmission cable?",options:["Increases","Decreases","Stays the same","There is no dielectric loss"],answer:0,diff:"medium",exp:"Dielectric loss is proportional to frequency (the loss tangent times omega times C), so it rises steadily with frequency and becomes the dominant loss mechanism at RF.",why:["","Decreasing loss would imply the dielectric improves with frequency, which is the reverse of the physics.","Losses are not frequency-independent — that is the behaviour of the resistance term at low frequency, not the dielectric term.","Dielectric loss never vanishes; it grows with frequency and sets the practical upper limit on cable use."],src:"Exam compilation · Transmission Lines · Q3"},
    {q:"Why is impedance matching essential in RF and transmission line systems?",options:["So the source can deliver maximum power to the load","To make resistance equal to reactance","To reduce reactance","So the load draws minimum power"],answer:0,diff:"easy",exp:"Matching makes the reflection coefficient zero, so the source delivers its maximum available power to the load instead of having part of it reflected back.",why:["","Making resistance equal to reactance is a resonance condition, not an impedance match — matching requires Z_L = Z_0.","Reducing reactance alone does not match the line; the resistive parts must also be equal.","A matched load draws maximum, not minimum, power from the source."],src:"Exam compilation · Transmission Lines · Q4"},
    {q:"Efficient power transmission from a transmitter to an antenna requires:",options:["High load impedance","Low ohmic resistance","Matching of impedances","Inductive impedance"],answer:2,diff:"medium",exp:"The antenna must present a load equal to the line's characteristic impedance so that no power is reflected back down the feed line.",why:["A high load impedance mismatches the line and reflects power back to the transmitter.","Low ohmic resistance reduces I squared R loss but does nothing about mismatch reflection.","","A purely inductive load is a pure mismatch and reflects essentially all the incident power."],src:"Exam compilation · Transmission Lines · Q5"},
    {q:"The characteristic impedance of a transmission line depends primarily on:",options:["Resistance per foot","Resistance and inductance per foot","Resistance and capacitance per foot","Inductance and capacitance per foot"],answer:3,diff:"medium",exp:"Z_0 = sqrt(L/C) for a lossless line, so it is set by the per-unit-length inductance and capacitance — the geometry and dielectric of the line.",why:["Series resistance affects attenuation, not the characteristic impedance.","R does not appear in Z_0 = sqrt(L/C); pairing it with L is a distractor.","R again does not belong in the lossless Z_0 expression; only L and C do.",""],src:"Exam compilation · Transmission Lines · Q6"},
    {q:"A negative voltage pulse travels down a transmission line terminated in its characteristic impedance. What happens?",options:["No reflection occurs","Reflects as both","Reflects as a positive pulse","Reflects as a negative pulse"],answer:0,diff:"medium",exp:"With Z_L = Z_0 the reflection coefficient Gamma = (Z_L - Z_0)/(Z_L + Z_0) = 0, so the pulse is completely absorbed and nothing reflects.",why:["","A pulse cannot reflect as two pulses; reflection either inverts it, preserves it, or does nothing.","A positive reflection would require Gamma = +1, which is an open circuit, not a match.","A negative reflection would require Gamma = -1, which is a short circuit, not a match."],src:"Exam compilation · Transmission Lines · Q9"},
    {q:"In a transmission line, when the load impedance is less than the characteristic impedance, the reflection coefficient is",options:["Equal to one","Positive","Negative","Maximum"],answer:2,diff:"medium",exp:"Gamma = (Z_L - Z_0)/(Z_L + Z_0). If Z_L < Z_0 the numerator is negative while the denominator stays positive, so Gamma is negative.",why:["Gamma = 1 requires an open circuit, where Z_L is infinite, not less than Z_0.","A positive Gamma requires Z_L > Z_0; the sign flips when the load is the smaller of the two.","","Gamma is bounded by plus or minus one; the magnitude is at most unity and never a maximum value in this sense."],src:"Exam compilation · Transmission Lines · Q10"},
    {q:"A transmitter and antenna are 15 m apart but connected by 65 m of coaxial cable. How can feed-line loss be reduced?",options:["Cut to odd wavelengths","Shorten the excess cable","Coil excess cable tightly","Cut to even wavelengths"],answer:1,diff:"hard",exp:"Feed-line loss is directly proportional to length, so removing the 50 m of excess cable cuts the loss in proportion to the length removed.",why:["Cutting to odd multiples of a quarter wavelength is an impedance-matching trick, not a loss-reduction method.","","Coiling the cable does not shorten the electrical path; the loss depends on total length, and coiling can worsen it.","Even-wavelength cutting again addresses matching, not the length-proportional loss."],src:"Exam compilation · Transmission Lines · Q13"},
  ],
  "Digital Communications": [
    {q:"In information theory, which source symbol conveys the greatest amount of information?",options:["A symbol that occurs with probability 0.90","0.50","0.25","0.05"],answer:3,diff:"medium",exp:"Information is I = -log2(p), which is largest when the probability is smallest. p = 0.05 gives I = 4.32 bits, the greatest of the four.",why:["p = 0.90 is the most probable symbol and so carries the least information, about 0.15 bit.","p = 0.50 carries exactly 1 bit — a fair coin.","p = 0.25 carries 2 bits, more than A or B but less than D.",""],src:"Exam compilation · Digital Communications · Q1"},
    {q:"Which statement correctly distinguishes bit rate from baud rate?",options:["Bit rate counts symbols per second, baud rate counts bits per second","Baud rate is always numerically greater than bit rate","Bit rate counts bits per second, while baud rate counts symbols per second","They are equal for every multilevel modulation system"],answer:2,diff:"easy",exp:"Bit rate counts bits per second; baud rate counts symbols per second. They are linked by R_b = R_s x log2(M).",why:["This reverses the two definitions exactly.","Baud rate is never greater than bit rate; it is either equal or smaller, since each symbol carries at least one bit.","","They are equal only when M = 2; for multilevel systems bit rate exceeds baud rate."],src:"Exam compilation · Digital Communications · Q7"},
    {q:"Which description best matches quadrature amplitude modulation (QAM)?",options:["Both carrier amplitude and phase are varied according to the information signal","Only carrier frequency is varied","Only carrier phase is varied","Pulse position and pulse width are varied simultaneously"],answer:0,diff:"medium",exp:"QAM carries two independent signals on in-phase and quadrature carriers, which is equivalent to varying both the amplitude and the phase of the resultant carrier.",why:["","Varying only the frequency is FSK.","Varying only the phase is PSK.","Varying pulse position and width describes PPM and PWM, which are pulse-time schemes."],src:"Exam compilation · Digital Communications · Q8"},
    {q:"Why does a QAM system generally use more phase states than amplitude states?",options:["Frequency changes are more susceptible to noise than phase changes","Amplitude changes are more susceptible to noise","Phase cannot be divided into many distinct states","QAM does not actually vary amplitude"],answer:1,diff:"easy",exp:"Amplitude is more vulnerable to noise and level drift than phase, so a robust design leans on phase for most of its signalling states.",why:["Frequency is not the varied parameter in QAM, so its noise immunity is beside the point.","","Phase can be divided into many distinct states quite easily — that is exactly what QAM does.","QAM definitely varies amplitude; that is half of its definition."],src:"Exam compilation · Digital Communications · Q10"},
    {q:"In delta modulation, granular noise is most associated with which condition?",options:["The input signal changes too rapidly for the staircase to follow","The input signal remains essentially unchanged while the staircase continues to step around it","The carrier frequency becomes too high","The number of quantization bits is increased"],answer:1,diff:"easy",exp:"Granular (quantising) noise appears when the input is nearly flat: the staircase cannot stop, so it hunts up and down around the constant level.",why:["An input changing too rapidly causes slope overload, the opposite failure mode.","","Carrier frequency is not a parameter of delta modulation, which is a baseband scheme.","Increasing the number of quantisation bits is not applicable — DM uses one bit per sample."],src:"Exam compilation · Digital Communications · Q23"},
    {q:"In time-division multiplexing (TDM), multiple signals share one communication channel by",options:["occupying different carrier frequencies simultaneously","using different optical wavelengths","being added into one analog amplitude","taking turns transmitting in assigned time intervals"],answer:3,diff:"easy",exp:"TDM gives each signal its own recurring time slot on the same channel, so the signals take turns rather than sharing spectrum.",why:["Occupying different carrier frequencies simultaneously is frequency-division multiplexing.","Using different optical wavelengths is wavelength-division multiplexing.","Summing into one amplitude is not multiplexing at all; it destroys the separate signals.",""],src:"Exam compilation · Digital Communications · Q25"},
  ],
  "Communication Systems": [
    {q:"Any unwanted form of electrical energy, usually random or aperiodic in character, that interferes with the proper reception and reproduction of transmitted signals is called:",options:["Noise","Distortion","Interference","Attenuation"],answer:0,diff:"easy",exp:"The deck defines noise as any unwanted form of electrical energy, usually random or aperiodic, which tends to interfere with the proper and easy reception and reproduction of transmitted signals.",why:["","Distortion is a waveform perturbation caused by imperfect system response to the desired signal.","Interference is contamination by extraneous external signals from human-made sources.","Attenuation is the degradation of signal strength as it propagates through the medium."],src:"Week 4 · Principles of Communications · Noise"},
    {q:"Any waveform perturbation or deviation caused by the imperfect response of a system to the desired signal is called:",options:["Distortion","Noise","Interference","Attenuation"],answer:0,diff:"easy",exp:"The deck defines distortion as any waveform perturbation or deviation caused by the imperfect response of the system to the desired signal.",why:["","Noise is random or aperiodic unwanted energy, not a systematic response error.","Interference comes from external human-made sources.","Attenuation is a reduction in amplitude, not a change in waveform shape."],src:"Week 4 · Principles of Communications · Noise"},
    {q:"Contamination by extraneous or external signals from human sources such as other transmitters, power lines and switching circuits is:",options:["Interference","Noise","Distortion","Attenuation"],answer:0,diff:"easy",exp:"The deck defines interference as contamination by extraneous or external signals from human sources, other transmitters, power lines, machinery, switching circuits and related sources.",why:["","Noise is the broader category of random unwanted energy; interference is specifically external and human-made.","Distortion arises inside the system from imperfect response.","Attenuation is signal-strength loss during propagation."],src:"Week 4 · Principles of Communications · Noise"},
    {q:"The degradation of signal strength or amplitude as it propagates through the medium is:",options:["Attenuation","Interference","Distortion","Modulation"],answer:0,diff:"easy",exp:"The deck defines attenuation as degradation of signal strength or amplitude as it propagates through the medium.",why:["","Interference is contamination by external signals.","Distortion is a waveform-shape error.","Modulation is the deliberate imposition of information on a carrier."],src:"Week 4 · Principles of Communications · Noise"},
    {q:"In an impedance-matched amplifier, the power gain is 15. The voltage gain is:",options:["3.87","5","15","8.37"],answer:0,diff:"medium",exp:"With matched impedances the voltage gain is the square root of the power gain: A_v = sqrt(15) = 3.87.",why:["","5 is the square root of 25, not of 15.","15 is the power gain, not the voltage gain.","8.37 is roughly 15/1.79, an arbitrary ratio with no basis here."],src:"Week 4 · Principles of Communications · Additional Question"},
    {q:"The primary purpose of modulation in a communication system is to:",options:["Shift the information signal to a frequency band suitable for transmission","Increase the noise figure of the receiver","Eliminate the need for an antenna","Remove the carrier before transmission"],answer:0,diff:"medium",exp:"Modulation imposes the information onto a higher-frequency carrier so the signal can be radiated efficiently and assigned to an available frequency band.",why:["","Modulation does not raise the noise figure; a well-designed system keeps it low.","An antenna is still required to radiate the modulated carrier.","Removing the carrier describes suppressed-carrier schemes, which are a specific case, not the purpose of modulation."],src:"Week 4 · Principles of Communications · Modulation"},
    {q:"Compared with a single-sideband system, a double-sideband full-carrier AM signal:",options:["Carries the same information but wastes power in the carrier and the redundant sideband","Carries more information per hertz of bandwidth","Requires no carrier recovery at the receiver","Occupies half the bandwidth"],answer:0,diff:"medium",exp:"In full-carrier DSB AM the carrier carries no information and the two sidebands are mirror images, so both are power- and bandwidth-inefficient compared with SSB.",why:["","Information content is set by the modulating signal, not the sideband arrangement.","A conventional envelope detector does not need carrier recovery, but this is not a comparison of information efficiency.","Full-carrier DSB occupies twice the bandwidth of SSB, not half."],src:"Week 4 · Principles of Communications · Amplitude Modulation"},
    {q:"The modulation index m of an AM wave is defined as the ratio of the:",options:["Modulating signal amplitude to the carrier amplitude","Carrier amplitude to the modulating amplitude","Sideband power to the carrier power","Modulating frequency to the carrier frequency"],answer:0,diff:"medium",exp:"The AM modulation index is m = Vm/Vc, the ratio of the modulating signal amplitude to the carrier amplitude; m must not exceed 1 to avoid overmodulation.",why:["","This inverts the definition.","A power ratio describes efficiency, not the modulation index.","A frequency ratio relates to deviation, as in FM."],src:"Week 4 · Principles of Communications · Amplitude Modulation"},
    {q:"An AM signal with a modulation index greater than 1 is said to be:",options:["Overmodulated, causing envelope distortion","Undermodulated, giving maximum efficiency","Perfectly modulated","Suppressed-carrier modulated"],answer:0,diff:"medium",exp:"When m exceeds 1 the envelope crosses zero and the sidebands invert, so an envelope detector reproduces a distorted version of the message.",why:["","Undermodulation means m is well below 1, giving low efficiency.","Perfect modulation corresponds to m equal to 1.","Suppressed carrier describes a carrier-removal scheme, not an index value."],src:"Week 4 · Principles of Communications · Amplitude Modulation"},
    {q:"The bandwidth required by an amplitude-modulated signal with a single modulating tone of frequency fm is:",options:["2 fm","fm","fm / 2","4 fm"],answer:0,diff:"medium",exp:"AM produces an upper and a lower sideband spaced fm from the carrier, so the total bandwidth occupied is twice the modulating frequency.",why:["","fm is the spacing of each sideband from the carrier, not the total span.","fm/2 has no physical meaning in AM bandwidth.","4 fm would apply only if the modulating bandwidth itself were 2 fm."],src:"Week 4 · Principles of Communications · Amplitude Modulation"},
    {q:"Which circuit element is required at the output of a diode envelope detector to recover the modulating signal?",options:["An RC low-pass filter whose time constant is slow enough to follow the envelope","A high-pass filter that removes the envelope","A band-pass filter centred on the carrier","A differentiator to detect the envelope slope"],answer:0,diff:"medium",exp:"The detector rectifies the AM wave and an RC network low-pass filters the result, with the time constant chosen to follow the envelope but reject the carrier.",why:["","A high-pass filter would remove the very envelope being recovered.","Filtering at the carrier would leave only the carrier, discarding the message.","Differentiation would emphasise envelope slope rather than recover its shape."],src:"Week 4 · Principles of Communications · Radio Receivers"},
    {q:"In a superheterodyne receiver, the mixer and local oscillator are used to:",options:["Convert the incoming signal to a fixed intermediate frequency","Amplify the audio output","Remove the modulation from the carrier","Radiate the received signal"],answer:0,diff:"medium",exp:"The mixer combines the incoming RF with the local oscillator to translate the signal to a fixed IF, where stable, high-selectivity filtering is practical.",why:["","Audio amplification happens after demodulation.","Removing the modulation is the job of the demodulator, not the mixer.","Radiating the signal is the antenna's function, not the receiver's."],src:"Week 4 · Principles of Communications · Radio Receivers"},
    {q:"The image frequency in a superheterodyne receiver is:",options:["A frequency that also converts to the same IF and so passes through the front-end filter","The frequency of the local oscillator","The intermediate frequency itself","The audio frequency at the detector output"],answer:0,diff:"hard",exp:"The image is a second frequency spaced 2 x IF from the wanted signal that the mixer also translates to the same IF, so it must be rejected by the preselector.",why:["","The local oscillator is the reference that drives the mixing, not the image.","The IF is the desired output of the mixer, not the interfering image.","Audio appears after demodulation, well after the image problem arises."],src:"Week 4 · Principles of Communications · Radio Receivers"},
    {q:"Automatic gain control in a receiver exists to:",options:["Hold the output level roughly constant as input signal strength varies","Tune the receiver to a new station","Demodulate the received signal","Reject the image frequency"],answer:0,diff:"medium",exp:"AGC senses the output level and adjusts the gain of earlier stages, compensating for fading and varying signal strength so the audio level stays steady.",why:["","Tuning is the job of the local oscillator and preselector.","Demodulation is performed by the detector.","Image rejection is done by the front-end filter, not by AGC."],src:"Week 4 · Principles of Communications · Radio Receivers"},
    {q:"The intermediate frequency of a receiver is chosen to:",options:["Allow high selectivity and stable gain at a single fixed frequency","Match the incoming carrier frequency","Equal the audio bandwidth","Eliminate the need for a local oscillator"],answer:0,diff:"medium",exp:"Using one fixed IF means the selective filters and amplifiers need only be optimised once, giving far better selectivity and stable gain than tunable RF stages.",why:["","The IF is deliberately offset from the carrier to create the mixing product.","Audio bandwidth is far narrower than the IF bandwidth.","The local oscillator is essential to produce the IF."],src:"Week 4 · Principles of Communications · Radio Receivers"},

  "Electronic System Design": [
    {q:"A communication system is intended to transmit data through an optical fiber over long distances at very high bit rates. The designer must choose a light source whose output remains highly concentrated and occupies an extremely narrow wavelength range to minimize dispersion. Which characteristic is most critical in selecting the appropriate device?",options:["High luminous efficiency due to spontaneous recombination","Broad spectral output to illuminate a wider fiber area","Stimulated emission that produces coherent and monochromatic light","Ability to operate without a forward bias voltage"],answer:2,diff:"medium",exp:"A laser diode works by stimulated emission, producing coherent, monochromatic light with a very narrow spectral width — exactly what minimises chromatic dispersion over long fiber spans.",why:["Spontaneous recombination describes an LED, whose broad spectrum causes dispersion.","A broad spectral output is precisely the fault that limits LED-based long-haul links.","","All semiconductor light sources need forward bias; this is not a distinguishing advantage."],src:"Exam compilation · Electronic System & Design · Q1"},
    {q:"A process-control system monitors furnace temperature from 20 °C to 800 °C. The readings must remain consistent over years of operation and require minimal correction for nonlinearity. Which sensor characteristic becomes the most important consideration?",options:["High sensitivity over a narrow temperature range","Predictable linear response over a wide temperature range","Internal amplification of the measured signal","Ability to generate light proportional to temperature"],answer:1,diff:"medium",exp:"A predictable, linear response across the whole 20-800 °C span means the readings need little or no correction — the key requirement stated in the question.",why:["High sensitivity over a narrow range is the opposite of what a wide-range furnace monitor needs.","","Internal amplification is a circuit property, not the sensor characteristic the question asks about.","Optical output (a pyrometer) is not the characteristic being selected for here."],src:"Exam compilation · Electronic System & Design · Q2"},
    {q:"A microcontroller controls a three-phase industrial motor starter. Unexpected voltage spikes frequently occur whenever the motor is switched OFF. Why would an optocoupler be preferred between the controller and the motor interface circuit?",options:["It increases the motor starting torque","It provides electrical isolation while preserving signal transfer","It converts analog signals into digital signals","It improves the power factor of the motor"],answer:1,diff:"medium",exp:"An optocoupler passes the signal as light across an insulating barrier, giving galvanic isolation so motor-switching spikes cannot reach and destroy the microcontroller.",why:["An optocoupler carries only a control signal and cannot affect motor torque.","","Optocouplers transmit digital signals; they are not analog-to-digital converters.","Power factor is corrected by capacitors or active front ends, not by an isolator."],src:"Exam compilation · Electronic System & Design · Q3"},
    {q:"An optical receiver must detect pulses occurring every few nanoseconds. The received optical power is relatively strong and does not require significant amplification. Which device is the better choice?",options:["Phototransistor because it provides higher gain","Solar cell because it generates its own voltage","Thermistor because of its sensitivity","Photodiode because of its faster response time"],answer:3,diff:"medium",exp:"With plenty of optical power, gain is unnecessary — so speed becomes the deciding factor, and the photodiode responds far faster than a phototransistor.",why:["A phototransistor has higher gain but its stored charge makes it far too slow for nanosecond pulses.","A solar cell is a large-area, slow, power-generating device, not a fast detector.","A thermistor senses temperature, not light.",""],src:"Exam compilation · Electronic System & Design · Q4"},
    {q:"A pressure sensor generates an output ranging from only 2 mV to 8 mV. An analog-to-digital converter requires an input range of 0 to 5 V. What is the primary reason for inserting a signal-conditioning stage?",options:["To increase signal amplitude and improve measurement quality","To convert the analog signal to optical form","To synchronize communication protocols","To provide a unique hardware address"],answer:0,diff:"hard",exp:"Amplifying the millivolt signal up to the converter's 0-5 V full-scale span uses the whole ADC range, which directly improves the achievable resolution.",why:["","Converting to optical form is a transmission choice, not signal conditioning for an ADC.","Protocol synchronisation is a communications concern, unrelated to matching a sensor to an ADC.","A hardware address is a bus-addressing matter, not conditioning."],src:"Exam compilation · Electronic System & Design · Q5"},
    {q:"A monitoring system measures slowly varying environmental temperature. Two ADCs are available: ADC A: 8-bit, 1 MSPS; ADC B: 16-bit, 10 kSPS. Which ADC is generally more suitable?",options:["ADC A because sampling speed is always more important","ADC A because higher sampling rates increase accuracy","ADC B because finer resolution is more beneficial for slow signals","Neither ADC can be used"],answer:2,diff:"medium",exp:"A slowly varying signal needs no speed, so the 16-bit converter's far finer resolution is the property that matters — 10 kSPS is already thousands of times faster than the signal changes.",why:["Sampling speed is worthless here because the temperature barely moves between samples.","Higher sampling rate does not increase accuracy; only bit depth does.","","Both converters are perfectly usable in principle — one is simply a better fit."],src:"Exam compilation · Electronic System & Design · Q6"},
    {q:"Two devices are connected through UART. Wiring has been verified, TX and RX lines are correctly crossed, and both devices share a common ground. However, received data appears corrupted. Which issue is MOST likely responsible?",options:["Lack of chip-select signals","Mismatched baud rates","Missing SDA line","Missing clock synchronization line"],answer:1,diff:"medium",exp:"With wiring and grounding ruled out, mismatched baud rates are the classic cause of UART corruption: the receiver samples at the wrong instants and frames break down.",why:["UART is point-to-point and has no chip-select line at all.","","There is no SDA line in UART — that belongs to I²C.","UART is asynchronous and deliberately has no clock line; that is I²C again."],src:"Exam compilation · Electronic System & Design · Q8"},
    {q:"An automated bottling plant requires that every sensor input be processed within a guaranteed time interval regardless of system workload. Why are PLCs often preferred for this task?",options:["They operate using deterministic real-time execution","They possess larger storage capacities than computers","They eliminate the need for sensors","They process graphical interfaces faster"],answer:0,diff:"medium",exp:"PLCs execute a deterministic scan cycle, so the worst-case response time is bounded and repeatable — the guaranteed timing the plant demands.",why:["","Storage capacity is irrelevant to timing guarantees.","PLCs still require sensors; they do not replace them.","Graphical interface speed has nothing to do with deterministic I/O processing."],src:"Exam compilation · Electronic System & Design · Q9"},
    {q:"A temperature sensor produces a very small signal contaminated by electrical interference before reaching a microcontroller ADC. What should the signal-conditioning stage primarily accomplish?",options:["Amplify the signal and filter unwanted electrical noise","Digitize the signal and execute programmed control instructions","Generate the signal and increase the sensor measurement range","Transmit the signal and provide mechanical output movement"],answer:0,diff:"medium",exp:"The stage must amplify the small signal up to the converter's range and filter the interference out of the band of interest.",why:["","Digitising and executing instructions is what the microcontroller does, not the conditioning stage.","Conditioning does not generate the signal; the sensor does.","Transmitting and producing mechanical output are actuator and communications functions."],src:"Exam compilation · Electronic System & Design · Q16"},
    {q:"An embedded system must connect several low-speed temperature and humidity sensors while minimizing the number of microcontroller pins used. Which communication protocol is the most appropriate?",options:["UART using separate transmit and receive point-to-point connections","SPI using separate chip-select lines for connected peripheral devices","I²C using shared data and clock lines with addressing","Parallel using multiple data lines for simultaneous transmission"],answer:2,diff:"medium",exp:"I²C needs only two shared lines (data and clock) and distinguishes devices by address, so many sensors cost only two pins.",why:["UART is point-to-point, so every added device consumes another pair of pins.","SPI needs a separate chip-select line per device, which is exactly the pin cost to be avoided.","","A parallel bus needs many data lines per device — the worst option for pin economy."],src:"Exam compilation · Electronic System & Design · Q17"},
    {q:"An industrial plant requires a controller that must execute control logic predictably despite vibration, electrical noise, and harsh environmental conditions. Why is a PLC generally appropriate for this application?",options:["It relies on cloud processing with continuous internet-based computation","It works only with desktop operating systems","It combines graphical processing with high-speed multimedia operation","It combines rugged construction with deterministic real-time control"],answer:3,diff:"medium",exp:"PLCs are built for harsh environments and run a deterministic scan, giving both ruggedness and repeatable timing.",why:["Cloud processing introduces variable latency and a network dependency — the opposite of predictable.","PLCs run their own real-time firmware, not a desktop operating system.","Multimedia performance is irrelevant to industrial control.",""],src:"Exam compilation · Electronic System & Design · Q18"},

  "Magnetism": [
    {q:"Which statement correctly distinguishes magnetic scalar potential from magnetic vector potential?",options:["Magnetic scalar potential is valid only where current density is zero","Magnetic vector potential exists only in current-free regions","The curl of magnetic vector potential is always zero","Magnetic scalar potential directly gives magnetic flux density by divergence"],answer:0,diff:"medium",exp:"The magnetic scalar potential requires curl H = 0, which holds only in current-free regions (J = 0). The vector potential has no such restriction.",why:["","The vector potential A exists in all regions, including those carrying current.","curl A = B, which is not zero in general — that is the whole point of A.","The scalar potential gives H (or B) through its gradient, not through a divergence."],src:"Exam compilation · Electromagnetics (Magnetism) · Q4"},
    {q:"A region in free space contains a time-varying electric field but no conduction current. Which statement best explains why a magnetic field may still exist in that region?",options:["Electric fields always generate magnetic monopoles","A changing electric field produces displacement current density","Magnetic fields exist only when electric charges move physically","Gauss's law in magnetism permits isolated magnetic poles"],answer:1,diff:"medium",exp:"Ampere-Maxwell law: a changing electric field produces a displacement current density J_d = dD/dt, which acts as a source for H even with no conduction current.",why:["Magnetic monopoles do not exist and are not produced by electric fields.","","Magnetic fields also arise from displacement current, so physical charge motion is not required.","Gauss's law for magnetism, div B = 0, forbids isolated poles rather than permitting them."],src:"Exam compilation · Electromagnetics (Magnetism) · Q6"},
    {q:"According to Maxwell's equations, the differential form of Gauss's law in electrostatics is:",options:["div D = rho_v","div D = 0","curl E = 0","curl E = rho_v / epsilon_0"],answer:0,diff:"medium",exp:"Gauss's law in differential form states div D = rho_v, or div E = rho_v/epsilon_0 in free space, so the first option is the intended key.",why:["","div D = 0 holds only in a charge-free region, not in general.","curl E = 0 is the electrostatic irrotational condition, a different equation entirely.","curl E is not a charge density; this expression is dimensionally wrong."],src:"Exam compilation · Electromagnetics (Magnetism) · Q9"},
    {q:"An electron enters a region of uniform magnetic field with velocity exactly parallel to the magnetic flux density vector. Which statement best describes the subsequent motion?",options:["It accelerates along the magnetic field direction","It moves in a circular path due to maximum magnetic force","It experiences zero magnetic force and continues undeflected","It spirals outward because magnetic force equals centripetal force"],answer:2,diff:"medium",exp:"F = q v x B. When v is parallel to B the cross product is zero, so there is no magnetic force and the electron continues in a straight line.",why:["The magnetic force cannot accelerate a charge along B, since F is always perpendicular to v.","Circular motion requires v perpendicular to B, where the force is maximum.","","Spiralling requires an oblique angle between v and B, not exact parallelism."],src:"Exam compilation · Electromagnetics (Magnetism) · Q10"},
    {q:"In a perfect dielectric medium where conductivity is negligible, which quantity primarily sustains the curl of the magnetic field?",options:["Volume charge density","Magnetic scalar potential","Electrostatic flux","Displacement current density"],answer:3,diff:"medium",exp:"With J = 0, Ampere-Maxwell reduces to curl H = dD/dt, so the displacement current density is what sustains the curl.",why:["Volume charge density sources div D, not curl H.","The scalar potential is a computational aid and is not defined where J is nonzero.","Electrostatic flux is a static quantity and produces no curl.",""],src:"Exam compilation · Electromagnetics (Magnetism) · Q12"},
    {q:"Which statement correctly describes an electrostatic field?",options:["Its divergence is zero","Its curl equals displacement current density","Its line integral around a closed path is always positive","Its curl is identically zero everywhere"],answer:3,diff:"easy",exp:"Electrostatic fields are conservative, so curl E = 0 identically everywhere.",why:["div E equals rho/epsilon_0, which is nonzero wherever charge exists.","A static field has no time variation, so no displacement current appears.","The closed line integral of a conservative field is zero, never always positive.",""],src:"Exam compilation · Electromagnetics (Magnetism) · Q15"},
    {q:"A charged particle enters a uniform magnetic field. Under which condition will it move in a perfect circular path?",options:["The magnetic field is non-uniform","The velocity is parallel to the magnetic field","The velocity makes an acute angle with the magnetic field","The velocity is perpendicular to the magnetic field"],answer:3,diff:"medium",exp:"With v perpendicular to B the magnetic force is purely centripetal and constant in magnitude, giving uniform circular motion.",why:["A non-uniform field makes the force vary, so the path is not a clean circle.","Parallel velocity gives zero force and straight-line motion.","An acute angle splits the velocity into components, producing a helix rather than a circle.",""],src:"Exam compilation · Electromagnetics (Magnetism) · Q21"},
    {q:"Why does a charged particle moving in a non-uniform magnetic field not follow a perfect circular path?",options:["It loses kinetic energy as it moves","The field continuously changes in magnitude and/or direction, causing the magnetic force to vary","The magnetic force acts parallel to the velocity","Magnetic fields perform work on the charged particle"],answer:1,diff:"medium",exp:"The radius of gyration depends on B; if B varies in magnitude or direction the radius and centre of curvature change continuously, so the path is not circular.",why:["A magnetic force does no work, so kinetic energy is conserved.","","The magnetic force is always perpendicular to v, never parallel.","Magnetic fields perform no work on a charged particle, by construction."],src:"Exam compilation · Electromagnetics (Magnetism) · Q22"},
  ],
  "Electrostatics": [
    {q:"According to Coulomb's 1st Law, what happens to the force between two point charges if the magnitude of one of the charges is doubled?",options:["It doubles","It is reduced to half","It remains unchanged","It becomes zero"],answer:0,diff:"medium",exp:"Coulomb's law gives F proportional to q1 q2, so doubling either charge doubles the force, distance held fixed.",why:["","Halving would require one charge to be reduced, not doubled.","The force definitely depends on charge magnitude, so it cannot stay unchanged.","The force is only zero if a charge is zero or the separation is infinite."],src:"Exam compilation · Electromagnetics · Q1"},
    {q:"Two identical charges are placed at a fixed distance apart. What type of force will act between them?",options:["Attractive force","Repulsive force","Magnetic force","Gravitational force"],answer:1,diff:"medium",exp:"Like charges repel. Two identical charges have the same sign, so the force is repulsive.",why:["Attraction requires opposite signs; identical charges share the same sign.","","Magnetism concerns moving charges; these are stationary.","Gravitational attraction between charges is utterly negligible compared with the electrostatic force."],src:"Exam compilation · Electromagnetics · Q2"},
    {q:"What does the negative sign in the expression F=-F signify in Coulomb's law?",options:["The magnitude of the force","The charges are equal","The direction of force on opposite charges","The force is zero"],answer:2,diff:"easy",exp:"The minus sign encodes Newton's third law: the force that charge 1 exerts on charge 2 is equal in magnitude and opposite in direction to the force charge 2 exerts on charge 1.",why:["The negative sign is not a magnitude; magnitude is always non-negative.","The sign carries directional information, not information about whether the charges are equal.","","A zero force would need zero charge or infinite separation, not a sign convention."],src:"Exam compilation · Electromagnetics · Q5"},
    {q:"A positive test charge is placed near a negative source charge. The direction of the electric field at the location of the test charge is:",options:["Tangent to the circular field","Perpendicular to the radial line","Away from the source charge","Towards the source charge"],answer:3,diff:"medium",exp:"Electric field lines are defined as pointing in the direction of the force on a positive test charge, and that force is attractive toward a negative source.",why:["Field lines are radial here, not tangent to a circle.","The field of a point charge is radial, so it cannot be perpendicular to the radial line.","Pointing away from the source is the direction for a positive source charge.",""],src:"Exam compilation · Electromagnetics · Q6"},
    {q:"In vector form, what determines the direction of the force acting on a charge due to another charge?",options:["The distance between them","The unit vector pointing from one to another","The charge magnitudes","The sign of the force"],answer:1,diff:"medium",exp:"F = k q1 q2 / r^2 times the unit vector R-hat directed from the source charge to the observation point; that unit vector fixes the direction.",why:["Distance sets the magnitude via the inverse-square law, not the direction.","","Charge magnitudes set the magnitude of the force, not its direction.","The sign of the force is an outcome of the calculation, not the determinant of direction."],src:"Exam compilation · Electromagnetics · Q7"},
    {q:"Which of the following changes would NOT affect the magnitude of electric force between 2-point charges?",options:["Increasing the distance between charges","Doubling both charges","Changing the sign of one charge","Using a different dielectric medium"],answer:2,diff:"medium",exp:"Changing the sign of one charge reverses the direction of the force but leaves the magnitude q1 q2 unchanged.",why:["Increasing separation reduces the force by the inverse-square law.","Doubling both charges multiplies the force by four.","","A different dielectric changes epsilon and therefore the force magnitude."],src:"Exam compilation · Electromagnetics · Q8"},
    {q:"Point charges Q_1=1 nC and Q_2=2 nC are at a distance apart. Which of the following statements is incorrect?",options:["A point charge Q_3=-3 nC located at the midpoint between Q_1 and Q_2 experiences no net force","The force on Q_1 is repulsive","The force on Q_2 is the same in magnitude as that on Q_1","The force on Q_2 is along the line joining them"],answer:0,diff:"hard",exp:"At the midpoint the distances to Q1 and Q2 are equal, so the force magnitudes on Q3 are proportional to 1x3 and 2x3 respectively. They differ, so the net force is not zero.",why:["","The force is repulsive because all three charges are positive (Q1, Q2 positive; Q3 is negative but is attracted to both, and the question's key concern is Q1-Q2 repulsion) — the statement as phrased is consistent with the setup.","Newton's third law makes the forces on Q1 and Q2 equal in magnitude, so this is correct.","Coulomb forces are central, acting along the line joining the charges, so this is correct."],src:"Exam compilation · Electromagnetics · Q9"},
    {q:"The electric flux density D inside a dielectric material is related to the electric field intensity E. If the permittivity of the material increases while the electric field remains constant, what happens to the electric flux density?",options:["It remains unchanged","It increases","It decreases","It becomes zero"],answer:1,diff:"medium",exp:"D = epsilon E. With E held constant, raising epsilon raises D in direct proportion.",why:["D changes whenever epsilon changes at fixed E, so it cannot remain unchanged.","","D decreases only if epsilon falls, which is the opposite of the stated change.","D is zero only if E or epsilon is zero, neither of which applies."],src:"Exam compilation · Electromagnetics · Q13"},
    {q:"If V=5x+3y, find the electric field intensity.",options:["-5i-3j V/m","5i+3j V/m","-3i-5j V/m","5i-3j V/m"],answer:0,diff:"hard",exp:"E = -grad V. The partial derivative with respect to x is 5 and with respect to y is 3, so E = -(5 a_x + 3 a_y) V/m.",why:["","This drops the negative sign that E = -grad V requires.","This swaps the x and y coefficients as well as the sign.","This keeps the x sign but drops the negative on y."],src:"Exam compilation · Electromagnetics · Q14"},
    {q:"A positive charge moves naturally in the same direction as an electric field. What happens to its electric potential energy?",options:["It decreases","It increases","It remains constant","It becomes infinite"],answer:0,diff:"medium",exp:"Moving with the field means the field does positive work on the charge, so its potential energy falls and its kinetic energy rises.",why:["","Potential energy rises only when a positive charge moves against the field.","The potential energy changes continuously along the path; it is not constant.","Potential energy stays finite for a finite displacement in a uniform field."],src:"Exam compilation · Electromagnetics · Q16"},
    {q:"Two point charges have opposite signs. What best describes the electrostatic force between them?",options:["Always perpendicular to the line joining the charges","The charges repel each other","The charges attract each other","No force exists between the charges"],answer:2,diff:"medium",exp:"Unlike charges attract, so the force is directed along the line joining them and pulls them together.",why:["Coulomb forces are central, acting along the joining line, never perpendicular to it.","Repulsion requires like charges, but these are opposite.","","A force certainly exists; it is nonzero for any finite separation."],src:"Exam compilation · Electromagnetics · Q20"},
    {q:"A positive point charge is located at the origin. Which statement correctly describes the electric field produced by the charge?",options:["Directed toward the charge","Directed away from the charge","Always parallel to the x-axis","Same magnitude at all distances"],answer:1,diff:"medium",exp:"Field lines emanate radially outward from a positive charge.",why:["Pointing toward the charge is the pattern for a negative charge.","","The field is spherically symmetric, not confined to the x-axis.","By the inverse-square law the magnitude falls off with distance, so it is not constant."],src:"Exam compilation · Electromagnetics · Q21"},
    {q:"Which statement correctly describes the direction of the electric field produced by a positive point charge?",options:["Directed toward the charge","Directed away from the charge","Always points upward","No specific direction"],answer:1,diff:"medium",exp:"By convention the field of a positive charge points radially outward, away from the charge.",why:["Toward the charge is the convention for a negative charge.","","The field is radial, so 'upward' is only true along one particular direction.","A point charge has a perfectly well-defined radial direction."],src:"Exam compilation · Electromagnetics · Q22"},
    {q:"If the distance from a point charge is doubled, what happens to the magnitude of its electric flux density D?",options:["Twice as large","One-half as large","Remains the same","One-fourth as large"],answer:3,diff:"medium",exp:"D = Q / (4 pi r^2), so D falls as the inverse square. Doubling r multiplies D by 1/4.",why:["D falls with distance, so it cannot become larger.","One-half would be an inverse-linear dependence, not inverse-square.","D depends on r, so it cannot remain the same.",""],src:"Exam compilation · Electromagnetics · Q23"},
    {q:"Which statement correctly describes the relationship between electric flux density D and electric field intensity E in a linear isotropic medium?",options:["They always point in opposite directions for negative charges","They are always perpendicular","They always point in the same direction because permittivity is a positive scalar quantity","D exists only in dielectrics while E exists only in free space"],answer:2,diff:"medium",exp:"D = epsilon E with epsilon a positive scalar, so D and E are always parallel and point the same way.",why:["A positive scalar permittivity cannot reverse the direction.","A scalar relation cannot introduce a 90-degree rotation.","","Both D and E exist in free space as well as in dielectrics."],src:"Exam compilation · Electromagnetics · Q24"},
    {q:"In applying Coulomb's law in vector form, a displacement vector is accidentally written in the opposite direction from the standard observation-minus-source convention. Under which condition can the final force direction still become correct after solving?",options:["When the interacting charges are opposite in sign","When the charges are identical and positive","When the medium is free space","When the displacement vector magnitude is sufficiently large"],answer:0,diff:"medium",exp:"Reversing the unit vector flips the computed force direction. If the charges are opposite in sign the force is attractive, i.e. already reversed relative to the like-charge case, so the two sign errors cancel.",why:["","For identical positive charges the force should be repulsive; flipping the vector makes it wrongly attractive, so no cancellation occurs.","The medium does not enter the direction convention.","Magnitude has no bearing on the direction error."],src:"Exam compilation · Electromagnetics · Q25"},
  ],
  "Transistors": [
    {q:"The dc alpha of a bipolar junction transistor is always:",options:["Equal to the dc beta","Greater than unity","Slightly less than unity","Zero in the active region"],answer:2,diff:"easy",exp:"Alpha = I_C/I_E, and since I_C = I_E - I_B, alpha is always slightly below unity — typically 0.95 to 0.998.",why:["Alpha and beta are related by beta = alpha/(1-alpha); they are not equal.","Alpha can never exceed unity because some emitter current must leave as base current.","","In the active region alpha is close to one, not zero; zero would mean no collector current."],src:"Exam compilation · Electronic Devices & Circuits 2 (Transistors) · Q2"},
    {q:"An emitter follower placed between a high-impedance source and a low-impedance load serves to:",options:["Invert the signal phase","Increase the stage voltage gain","Raise the output impedance","Prevent loading of the source"],answer:3,diff:"medium",exp:"The emitter follower (common collector) has high input impedance and low output impedance, so it buffers the source from the heavy load and prevents the load from dragging the source voltage down.",why:["An emitter follower does not invert; the output follows the input in phase.","Its voltage gain is slightly less than unity, so it certainly does not increase it.","Its output impedance is low, not raised — that is precisely why it can drive a low-impedance load.",""],src:"Exam compilation · Electronic Devices & Circuits 2 (Transistors) · Q5"},
    {q:"The dynamic behavior of a BJT amplifier is represented mathematically using the:",options:["r_e and hybrid-π models","Ideal and practical diode models","Load-line and Q-point constructions","Thevenin and Norton equivalents"],answer:0,diff:"medium",exp:"Small-signal AC analysis uses the r_e model or the hybrid-pi model to linearise the transistor about its Q-point.",why:["","Diode models describe rectifier behaviour, not small-signal transistor amplification.","Load-line and Q-point constructions are graphical DC bias tools, not the AC model.","Thevenin and Norton are network-reduction theorems, not transistor models."],src:"Exam compilation · Electronic Devices & Circuits 2 (Transistors) · Q7"},
    {q:"Voltage-divider bias is the standard choice for linear amplifiers because the Q-point becomes:",options:["Independent of the supply voltage","Essentially independent of beta","Strongly dependent on beta","Tied to the breakdown voltage"],answer:1,diff:"medium",exp:"With a stiff divider, V_B is fixed by the resistors and I_E is approximately V_B/R_E — an expression containing no beta, so the Q-point is largely immune to transistor-to-transistor beta variation.",why:["The Q-point does depend on V_CC; it is beta that it is freed from.","","Strong beta dependence is the weakness of base bias, which voltage-divider bias is designed to fix.","The Q-point is set by the bias network, not by the breakdown rating."],src:"Exam compilation · Electronic Devices & Circuits 2 (Transistors) · Q21"},
    {q:"Structurally, a MOSFET differs from a JFET in that its gate is:",options:["Formed by a reverse-biased pn junction, exactly as in the JFET","Separated from the channel by a silicon dioxide layer","Tied directly to the source terminal","Made of heavily doped n-type material"],answer:1,diff:"easy",exp:"The MOSFET gate is a metal or polysilicon electrode separated from the channel by a thin insulating silicon dioxide layer, which is why it draws essentially no gate current.",why:["A reverse-biased pn gate junction describes the JFET, which is exactly what the MOSFET avoids.","","Tying the gate to the source is a biasing choice, not a structural difference.","The gate electrode is not the heavily doped n-type region; that describes the source and drain."],src:"Exam compilation · Electronic Devices & Circuits 2 (Transistors) · Q23"},
  ],
  "Signals & Systems": [
    {q:"A discrete-time signal is defined as x[n] = {1, 2, 2, 1, 0, 1, 1, 2, 0}. This form of description is known as:",options:["A finite-length sequence","A continuous-time function","A frequency spectrum","A Laplace transform"],answer:0,diff:"easy",exp:"A discrete-time signal listed as an explicit set of sample values indexed by n is called a finite-length sequence.",why:["","A continuous-time function is defined for every value of t, not at discrete indices.","A spectrum describes frequency content, not the sample values themselves.","A Laplace transform is a continuous-domain transform, not a sequence listing."],src:"Week 7.4 · Signals · Classification of Signals"},
    {q:"In the sequence x[n] = {1, 2, 2, 1, 0, 1, 1, 2, 0}, the underlined entry marks the sample where:",options:["n = 0","n = 1","n = -1","n equals the sequence length"],answer:0,diff:"easy",exp:"By convention the underlined or otherwise marked entry of a discrete sequence is the sample at index n = 0; samples to its right are n = 1, 2, ... and to its left n = -1, -2, ...",why:["","n = 1 is the sample immediately to the right of the origin.","n = -1 is the sample immediately to the left of the origin.","The sequence length is 9, which is unrelated to the index of the marked sample."],src:"Week 7.4 · Signals · Continuous-Time and Discrete-Time Signals"},
    {q:"For a continuous-time sinusoid, the fundamental period T is related to its angular frequency by:",options:["T = 2 pi / omega","T = omega / 2 pi","T = 2 pi x omega","T = 1 / omega"],answer:0,diff:"easy",exp:"The deck gives T = 2 pi / omega for continuous-time sinusoids: the period is inversely proportional to angular frequency, scaled by 2 pi.",why:["","This inverts the relation; it would give a period that grows with frequency.","Multiplying would make the period grow with frequency, which is backwards.","1/omega is the period in ordinary frequency only when omega is the cyclic frequency, not the angular one."],src:"Week 7.4 · Signals · Periodicity and Symmetry"},
    {q:"A discrete-time sinusoid is periodic only if N is an integer and:",options:["omega / (2 pi) is rational","omega / (2 pi) is irrational","omega is an integer","omega is greater than 2 pi"],answer:0,diff:"medium",exp:"For a DT sinusoid the fundamental period N = 2 pi / Omega must be an integer, which requires Omega/(2 pi) to be a rational number.",why:["","An irrational ratio makes the samples never repeat exactly, so the signal is aperiodic.","omega need not be an integer; the ratio to 2 pi is what matters.","There is no requirement that omega exceed 2 pi."],src:"Week 7.4 · Signals · Periodicity and Symmetry"},
    {q:"Which transform pair maps a discrete-time periodic signal to a discrete-frequency periodic spectrum?",options:["Discrete-time Fourier series (DTFS)","Continuous-time Fourier transform (CTFT)","Z-transform","Discrete Fourier transform (DFT)"],answer:0,diff:"medium",exp:"The deck's transform table gives DTFS for a discrete-time periodic signal producing a discrete-frequency periodic spectrum.",why:["","The CTFT applies to continuous-time signals, not discrete-time ones.","The Z-transform maps a sequence to the complex-frequency z-domain, not to a discrete-frequency spectrum.","The DFT applies to a finite-length N-point sequence, not to a periodic signal in general."],src:"Week 7.4 · Signals · Signal-Transform Input and Output Domains"},
    {q:"Which transform is applied to a finite-length, N-point discrete-time sequence and yields N discrete frequency samples?",options:["Discrete Fourier transform (DFT)","Discrete-time Fourier transform (DTFT)","Continuous-time Fourier series (CTFS)","Laplace transform"],answer:0,diff:"medium",exp:"The deck defines the DFT as the transform of a finite-length N-point discrete-time sequence, producing N discrete frequency samples.",why:["","The DTFT produces a continuous, 2-pi-periodic spectrum, not N discrete samples.","The CTFS applies to continuous-time periodic signals.","The Laplace transform maps continuous-time signals to the s-domain."],src:"Week 7.4 · Signals · Signal-Transform Input and Output Domains"},
    {q:"The Z-transform represents a discrete-time sequence in the:",options:["Complex-frequency (z) domain","Continuous 2-pi-periodic frequency domain","Time domain only","N discrete frequency samples"],answer:0,diff:"medium",exp:"The deck's table lists the Z-transform as producing a complex-frequency representation in the z-domain for a discrete-time signal or sequence.",why:["","A continuous 2-pi-periodic spectrum is the DTFT's output, not the Z-transform's.","The Z-transform is a domain transform, not a time-domain description.","N discrete frequency samples is the DFT's output."],src:"Week 7.4 · Signals · Signal-Transform Input and Output Domains"},
    {q:"A system is described as static when its output at any instant depends on:",options:["Only the present value of the input","Past and future values of the input","The integral of the input over all time","The derivative of the input with respect to time"],answer:0,diff:"easy",exp:"A static (memoryless) system's output depends only on the present input value; any dependence on past or future inputs makes the system dynamic.",why:["","Dependence on past or future values is the definition of a dynamic system with memory.","Integrating over all time requires memory of the entire past.","Differentiating requires knowledge of the input in a neighbourhood, hence memory."],src:"Week 7.4 · Signals · Static and Dynamic"},
    {q:"Which property must hold for a system to be classified as linear?",options:["Superposition: additivity and homogeneity together","Time invariance alone","Causality alone","Having a finite impulse response"],answer:0,diff:"medium",exp:"Linearity requires superposition, meaning both additivity (response to a sum is the sum of responses) and homogeneity (scaling the input scales the output).",why:["","Time invariance is independent of linearity; a system can be time invariant but nonlinear.","Causality concerns dependence on future inputs, not linearity.","A finite impulse response does not guarantee linearity."],src:"Week 7.4 · Signals · Linear and Nonlinear"},
    {q:"The unit step function u(t) equals 0 for t < 0 and 1 for t >= 0. This signal is:",options:["Causal","Anti-causal","Non-causal","Periodic"],answer:0,diff:"easy",exp:"u(t) is zero for all negative time, so it exists only from t = 0 onward, which is the definition of a causal signal.",why:["","An anti-causal signal is zero for positive time, the opposite of u(t).","A non-causal signal has nonzero values at negative time, which u(t) does not.","u(t) never repeats, so it is not periodic."],src:"Week 7.4 · Signals · Energy, Power, and Causality"},

  "Microprocessors": [
    {q:"Which integrated circuit package has its pins arranged in two parallel rows along the long sides of a rectangular body?",options:["Dual in-line package","Single in-line package","Quad in-line package","Zigzag in-line package"],answer:0,diff:"easy",exp:"The deck's IC package diagram identifies the dual in-line package by its two parallel rows of pins; the single in-line has one row and the quad has pins on all four sides.",why:["","A single in-line package has only one row of pins.","A quad in-line package has pins along all four sides.","A zigzag in-line package has its pins bent in a zigzag arrangement on one edge."],src:"Week 7.3 · Microprocessors · IC Packages"},
    {q:"A chip carrier package in which the die sits in a cavity on the underside of a ceramic body, with contacts on all four edges, is the:",options:["Quad in-line / chip carrier form","Single in-line package","Dual in-line package","Small outline package"],answer:0,diff:"medium",exp:"The deck's package survey groups the chip carrier with the quad in-line family: contacts on all four edges, unlike the two-row DIP or single-row SIP.",why:["","A single in-line package has one row of pins only.","A dual in-line package has two rows.","A small outline package is a surface-mount shrink of the DIP, still two rows."],src:"Week 7.3 · Microprocessors · IC Packages"},
    {q:"A ceramic flat pack is characterised by:",options:["A flat, low-profile ceramic body with leads exiting along two opposite edges","Pins on all four sides of a plastic body","A single row of pins along one edge","Being soldered only through holes in the board"],answer:0,diff:"medium",exp:"The deck lists the ceramic flat pack among the flat, low-profile package types, with leads emerging from two opposite sides for surface mounting.",why:["","Pins on all four sides describes the quad or chip carrier family.","A single row of pins describes the single in-line package.","Through-hole mounting describes the DIP, not a flat pack."],src:"Week 7.3 · Microprocessors · IC Packages"},
    {q:"Which package style is described as a surface-mount shrink of the dual in-line package?",options:["Small outline package","Quad in-line package","Single in-line package","Zigzag in-line package"],answer:0,diff:"medium",exp:"The small outline package takes the DIP's two-row lead arrangement but in a much smaller, surface-mount body.",why:["","A quad in-line package has pins on four sides.","A single in-line package has one row of pins.","A zigzag in-line package is a through-hole single-row variant."],src:"Week 7.3 · Microprocessors · IC Packages"},
    {q:"The principal advantage of an integrated circuit over a circuit built from discrete components is:",options:["Improved reliability and a more compact design","Greater ease of manual wiring and soldering","Higher power-handling capability per function","Easier fabrication of large inductors"],answer:0,diff:"easy",exp:"Integrating many devices on one die removes most interconnections, which raises reliability and shrinks size and weight dramatically.",why:["","ICs eliminate most manual wiring rather than requiring it.","ICs are limited in power handling, which is a recognised disadvantage.","Large inductors are difficult to fabricate on-chip, not easier."],src:"Week 7.3 · Microprocessors · Integrated Circuits"},
    {q:"Which of the following is a recognised limitation of integrated circuits?",options:["They can handle only a limited amount of power","They increase the overall size and weight of a system","They cannot be mass-produced","They require no external components ever"],answer:0,diff:"easy",exp:"The deck lists limited power-handling capability as a disadvantage of ICs, since the small geometry cannot dissipate large amounts of heat.",why:["","ICs reduce size and weight; that is their chief advantage.","ICs are specifically suited to mass production.","ICs frequently need external components such as decoupling capacitors and inductors."],src:"Week 7.3 · Microprocessors · Integrated Circuits"},
    {q:"An integrated circuit in which all components are fabricated on one continuous piece of silicon is classified as:",options:["Monolithic","Hybrid","Thick-film","Thin-film"],answer:0,diff:"easy",exp:"Monolithic means single stone: all components are formed in or on one continuous silicon chip.",why:["","A hybrid IC combines monolithic and film technologies on a common substrate.","Thick-film ICs are made by depositing films on a substrate, not on one silicon crystal.","Thin-film ICs likewise use deposited films rather than a single silicon die."],src:"Week 7.3 · Microprocessors · Integrated Circuits"},
    {q:"An integrated circuit containing between 100 and 9,999 logic gates falls under which density classification?",options:["LSI","SSI","MSI","VLSI"],answer:0,diff:"medium",exp:"The scale-of-integration bands give LSI as roughly 100 to 10,000 gates; SSI is up to about 10 gates and MSI about 10 to 100.",why:["","SSI covers only a handful of gates, roughly up to 10.","MSI covers roughly 10 to 100 gates, below this range.","VLSI begins above about 10,000 gates."],src:"Week 7.3 · Microprocessors · Scale of Integration"},
    {q:"A designer needs firmware that can be reprogrammed in the field, one large block at a time, without removing the chip. The best choice is:",options:["EEPROM","Mask ROM","PROM","EPROM"],answer:0,diff:"easy",exp:"EEPROM is electrically erasable in circuit, allowing block-wise reprogramming in the field without removing the device.",why:["","Mask ROM is factory-programmed and can never be altered.","PROM is one-time programmable and cannot be erased.","EPROM needs removal and ultraviolet exposure to erase."],src:"Week 7.3 · Microprocessors · Memory Types"},
    {q:"The DRAM refresh scheme that recharges every memory location in one continuous operation is called:",options:["Burst refresh","Distributed refresh","Selective refresh","Transparent refresh"],answer:0,diff:"medium",exp:"Burst refresh recharges all rows in one continuous burst, concentrating the refresh time so normal access can proceed uninterrupted afterwards.",why:["","Distributed refresh spreads the refresh cycles evenly through the access cycle.","Selective refresh refreshes only the rows actually in use.","Transparent refresh is not a standard refresh scheme name."],src:"Week 7.3 · Microprocessors · DRAM Refresh"},
    {q:"Compared with a hard disk drive, a solid-state drive is generally:",options:["Faster and more shock-resistant, but more expensive","Slower but cheaper","Magnetic and mechanically driven","Read using a laser beam"],answer:0,diff:"easy",exp:"An SSD has no moving parts, so it is faster and far more resistant to shock, at a higher cost per gigabyte than an HDD.",why:["","That describes the older HDD position, not an SSD.","Magnetic and mechanical describes an HDD.","Laser reading describes optical media such as CD and DVD."],src:"Week 7.3 · Microprocessors · Storage"},
    {q:"Which register holds the address of the memory location currently being read from or written to?",options:["Memory Address Register","Program Counter","Instruction Register","Status register"],answer:0,diff:"easy",exp:"The Memory Address Register holds the address presented to memory for the current read or write operation.",why:["","The Program Counter holds the address of the next instruction to fetch.","The Instruction Register holds the instruction currently being decoded.","The status register holds condition flags."],src:"Week 7.3 · Microprocessors · CPU Registers"},
    {q:"The Translation Lookaside Buffer associated with a memory management unit serves to:",options:["Cache recent virtual-to-physical address translations to speed up mapping","Store the CPU's arithmetic results","Refresh dynamic memory cells","Buffer data moving to secondary storage"],answer:0,diff:"medium",exp:"The TLB is a small, fast cache of recently used page-table entries, so most address translations avoid a full page-table walk.",why:["","Arithmetic results are held in registers and the accumulator.","DRAM refresh is handled by the memory controller, not the TLB.","Secondary-storage buffering is a disk or file-system concern."],src:"Week 7.3 · Microprocessors · Memory Management"},
    {q:"Microcontrollers are generally characterised by the Harvard architecture, which means:",options:["Separate memories and buses for program and data","A single shared memory for program and data","No program memory at all","Program stored only in external RAM"],answer:0,diff:"medium",exp:"Harvard architecture uses separate program and data memory spaces with independent buses, allowing instruction fetch and data access to proceed simultaneously.",why:["","A single shared memory for program and data is the von Neumann architecture.","A microcontroller must have program memory to hold its firmware.","Program is normally held in on-chip flash, not external RAM."],src:"Week 7.3 · Microprocessors · Microcontroller Architecture"},
