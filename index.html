<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ECE Correl Quiz Trainer</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --card2: #1c2128;
  --border: #30363d;
  --fg: #c9d1d9;
  --accent: #58a6ff;
  --accent2: #7ee787;
  --danger: #f85149;
  --warn: #d29922;
  --muted: #8b949e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}
/* iOS: tap targets >= 44px, no double-tap-zoom delay, visible tap feedback. */
button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(88,166,255,0.25);
  min-height: 44px;
  font: inherit;
  color: inherit;
}
button:active { transform: scale(0.985); opacity: 0.92; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  padding: 20px;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
  line-height: 1.5;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 6px; color: var(--accent); font-size: 1.8em; }
.subtitle { text-align: center; color: var(--muted); margin-bottom: 6px; }
.bank-line { text-align: center; color: var(--muted); font-size: 0.82em; margin-bottom: 20px; }
.bank-line span { color: var(--accent2); }
h2 { font-size: 1.15em; margin-bottom: 10px; }
h3 { font-size: 1.02em; margin-bottom: 10px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.view { display: none; }
.view.active { display: block; }
.mode-toggle { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.mode-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 0.9em;
}
.mode-btn:hover { border-color: var(--accent); }
.mode-btn.active { border-color: var(--accent); color: var(--accent); background: var(--card2); }
.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.topic-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
  font-size: 0.95em;
}
.topic-btn:hover { border-color: var(--accent); background: var(--card2); }
.topic-btn.active { border-color: var(--accent); background: var(--card2); box-shadow: 0 0 0 1px var(--accent); }
.topic-btn .count { color: var(--muted); font-size: 0.8em; margin-top: 4px; }
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.controls label { color: var(--muted); font-size: 0.9em; }
select, input[type="file"] {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg);
  padding: 8px 10px;
  font-size: 0.9em;
  min-height: 40px;
}
.btn {
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #0d1117;
  border-radius: 6px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 0.95em;
  font-weight: 600;
}
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: transparent; border-color: var(--border); color: var(--fg); font-weight: 500; }
.btn.secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; padding: 8px 10px; }
.btn.ghost:hover { color: var(--fg); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.progress-wrap { margin-bottom: 14px; }
.progress-bar {
  height: 8px;
  background: var(--card2);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.progress-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
.quiz-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 0.85em;
  margin-bottom: 8px;
}
.quiz-head .timer { font-variant-numeric: tabular-nums; }
.quiz-head .timer.warn { color: var(--warn); }
.quiz-head .timer.danger { color: var(--danger); }
.question-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}
.tos-badge {
  display: inline-block;
  background: rgba(88,166,255,0.12);
  border: 1px solid rgba(88,166,255,0.4);
  color: var(--accent);
  font-size: 0.75em;
  border-radius: 999px;
  padding: 3px 10px;
  margin-bottom: 10px;
}
.question-num { color: var(--muted); font-size: 0.8em; margin-bottom: 10px; letter-spacing: 0.02em; }
.question-text { font-size: 1.05em; line-height: 1.55; margin-bottom: 16px; }
.qfig { display: block; max-width: 100%; height: auto; margin: 12px 0; border-radius: 8px; background: #fff; padding: 6px; }
.options { display: grid; gap: 10px; }
.option-btn {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  text-align: left;
  cursor: pointer;
  font-size: 0.95em;
  line-height: 1.45;
}
.option-btn:hover:not(.disabled) { border-color: var(--accent); }
.option-btn.correct { border-color: var(--accent2); background: rgba(126,231,135,0.1); }
.option-btn.wrong { border-color: var(--danger); background: rgba(248,81,73,0.1); }
.option-btn.disabled { cursor: default; }
.option-btn .key {
  display: inline-block;
  min-width: 1.6em;
  color: var(--muted);
  font-weight: 700;
}
.option-btn.correct .key { color: var(--accent2); }
.option-btn.wrong .key { color: var(--danger); }
.explanation { display: none; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; font-size: 0.92em; }
.explanation.show { display: block; }
.explanation h4 { margin-bottom: 6px; font-size: 1em; }
.explanation h4.ok { color: var(--accent2); }
.explanation h4.bad { color: var(--danger); }
.explanation p + p { margin-top: 8px; }
.why-wrong { color: var(--warn); }
.opt-review { margin-top: 12px; }
.opt-review .hdr { color: var(--muted); font-size: 0.85em; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.opt-row { display: flex; gap: 10px; padding: 6px 0; border-top: 1px dashed rgba(48,54,61,0.8); }
.opt-row .opt-key { font-weight: 700; color: var(--muted); }
.opt-row.picked .opt-key { color: var(--danger); }
.opt-row.right .opt-key { color: var(--accent2); }
.source-line { margin-top: 12px; color: var(--muted); font-size: 0.78em; }
.quiz-nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.quiz-nav .spacer { flex: 1; }
.kbd-hint { color: var(--muted); font-size: 0.78em; }
.score-display { background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-align: center; padding: 20px; margin-bottom: 16px; }
.score-display h2 { color: var(--accent); margin-bottom: 8px; }
.score-display .big { font-size: 3em; font-weight: 700; line-height: 1.1; }
.stats { display: flex; gap: 20px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.stat-item { text-align: center; }
.stat-item .val { font-size: 1.4em; font-weight: 600; }
.stat-item .lbl { color: var(--muted); font-size: 0.8em; }
table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; font-size: 0.85em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--card2); border-radius: 999px; overflow: hidden; min-width: 60px; }
.bar > span { display: block; height: 100%; background: var(--accent2); }
.bar > span.mid { background: var(--warn); }
.bar > span.low { background: var(--danger); }
.review-area { margin-top: 20px; }
.review-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
}
.review-item.correct { border-left: 3px solid var(--accent2); }
.review-item.wrong { border-left: 3px solid var(--danger); }
.review-item.skipped { border-left: 3px solid var(--muted); }
.review-item .q { font-weight: 600; margin-bottom: 6px; }
.review-item .a { font-size: 0.9em; margin-bottom: 2px; }
.review-item .a.pick-bad { color: var(--danger); }
.review-item .a.pick-ok { color: var(--accent2); }
.review-item .e { color: var(--muted); font-size: 0.85em; margin-top: 6px; }
.study-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.study-item .q { font-weight: 600; margin-bottom: 10px; }
.study-item ol { margin-left: 20px; }
.study-item li { padding: 3px 0; }
.study-item li.key { color: var(--accent2); font-weight: 600; }
.study-item .meta { color: var(--muted); font-size: 0.8em; margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
.study-item .notes { margin-top: 10px; font-size: 0.88em; color: var(--muted); }
.study-item .notes div { padding: 3px 0; }
.notice { background: rgba(210,153,34,0.12); border: 1px solid rgba(210,153,34,0.4); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 0.85em; margin-bottom: 14px; }
.empty { color: var(--muted); font-size: 0.9em; padding: 8px 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (max-width: 520px) {
  h1 { font-size: 1.45em; }
  .score-display .big { font-size: 2.4em; }
  body { padding: 14px; }
}
</style>
</head>
<body>
<noscript><div style="background:#d29922;color:#0d1117;padding:12px 16px;margin-bottom:16px;border-radius:8px;font-weight:600;line-height:1.4">
JavaScript is disabled in this viewer, so nothing is tappable. Open the file in Safari, Chrome, or Firefox, or use the hosted link.</div></noscript>
<div class="container">
  <h1>ECE Correl Quiz Trainer</h1>
  <p class="subtitle">Mapua ECE Correlation review — ELECS &amp; EST</p>
  <p class="bank-line" id="bankLine"></p>

  <nav class="mode-toggle" id="modeTabs" aria-label="Quiz mode">
    <button class="mode-btn active" data-mode="topic" aria-pressed="true">By Topic</button>
    <button class="mode-btn" data-mode="trial" aria-pressed="false">Trial Exam (All)</button>
    <button class="mode-btn" data-mode="elecs" aria-pressed="false">ELECS Trial</button>
    <button class="mode-btn" data-mode="est" aria-pressed="false">EST Trial</button>
    <button class="mode-btn" data-mode="weak" aria-pressed="false">Weak Areas</button>
    <button class="mode-btn" data-mode="study" aria-pressed="false">Study Mode</button>
  </nav>

  <!-- HOME -->
  <section class="view active" id="viewHome">
    <details class="card" id="dashCard">
      <summary style="cursor:pointer;font-weight:600">Progress dashboard</summary>
      <div id="dashBody" style="margin-top:14px"></div>
    </details>

    <div id="topicView">
      <div class="topic-grid" id="topicGrid"></div>
      <div class="controls">
        <label for="qCount">Questions:</label>
        <select id="qCount">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100" selected>100</option>
        </select>
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
          <option value="all">All</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <label for="pace">Pace:</label>
        <select id="pace">
          <option value="0" selected>No timer</option>
          <option value="45">45 s / item</option>
          <option value="60">60 s / item</option>
          <option value="90">90 s / item</option>
        </select>
        <button class="btn" id="startBtn">Start Quiz</button>
      </div>
      <p class="notice" id="diffNotice" style="display:none"></p>
    </div>

    <div class="controls" style="border-top:1px solid var(--border);padding-top:16px">
      <button class="btn secondary" id="exportBtn">Export progress</button>
      <button class="btn secondary" id="importBtn">Import progress</button>
      <input type="file" id="importFile" accept="application/json,.json" class="sr-only">
      <button class="btn ghost" id="resetBtn">Reset history</button>
      <span class="spacer" style="flex:1"></span>
      <span class="kbd-hint">Keys: A–D / 1–4 answer · Enter next · Esc quit</span>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="viewQuiz">
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Quiz progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="quiz-head">
      <span id="quizMeta"></span>
      <span class="timer" id="quizTimer" aria-live="off">00:00</span>
    </div>
    <div class="question-card" id="questionCard"></div>
    <div class="quiz-nav">
      <button class="btn secondary" id="quitBtn">Quit</button>
      <span class="spacer"></span>
      <button class="btn secondary" id="skipBtn">Skip</button>
      <button class="btn" id="nextBtn" style="display:none">Next</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="view" id="viewResults">
    <div class="score-display">
      <h2 id="resultTitle">Quiz complete</h2>
      <div class="big" id="scoreBig"></div>
      <div class="stats" id="scoreStats"></div>
    </div>
    <div class="card" id="sectionBreakdown" style="display:none"></div>
    <div class="review-area" id="reviewArea"></div>
    <div class="quiz-nav" style="margin-top:16px">
      <button class="btn secondary" id="backBtn">Back to topics</button>
      <span class="spacer"></span>
      <button class="btn" id="againBtn">New quiz</button>
    </div>
  </section>

  <!-- STUDY -->
  <section class="view" id="viewStudy">
    <div class="controls">
      <label for="studyTopic">Topic:</label>
      <select id="studyTopic"></select>
      <label for="studyFilter">Show:</label>
      <select id="studyFilter">
        <option value="all" selected>Everything</option>
        <option value="hard">Hard only</option>
        <option value="missed">Missed before</option>
        <option value="unseen">Never attempted</option>
      </select>
      <span class="spacer" style="flex:1"></span>
      <button class="btn secondary" id="studyBackBtn">Back</button>
    </div>
    <p class="empty" id="studyCount"></p>
    <div id="studyList"></div>
  </section>
</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
